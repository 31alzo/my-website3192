<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>تسجيل الدخول — عالم شيخ الأساتذة</title>

    <meta
        name="description"
        content="تسجيل الدخول إلى عالم شيخ الأساتذة — الأستاذ AI"
    >

    <meta name="theme-color" content="#1769e0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --primary: #1769e0;
            --primary-dark: #0d4fac;
            --primary-light: #eaf2ff;
            --bg: #f5f8fd;
            --surface: #ffffff;
            --text: #172033;
            --muted: #707b8f;
            --border: #e3e9f2;
            --danger: #dc3545;
            --success: #159a65;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;

            font-family: "Cairo", Arial, sans-serif;

            background:
                radial-gradient(
                    circle at 15% 10%,
                    rgba(23, 105, 224, .10),
                    transparent 30%
                ),
                var(--bg);

            color: var(--text);

            display: flex;
            flex-direction: column;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        button,
        input {
            font-family: inherit;
        }

        header {
            height: 72px;

            background: rgba(255,255,255,.94);
            border-bottom: 1px solid var(--border);

            display: flex;
            align-items: center;
        }

        .header-inner {
            width: min(1100px, calc(100% - 28px));
            margin: auto;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 11px;

            font-weight: 800;
        }

        .brand-icon {
            width: 43px;
            height: 43px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 14px;

            background: linear-gradient(
                135deg,
                #1769e0,
                #4d91ff
            );

            color: white;
            font-size: 21px;
        }

        .brand-name {
            font-size: 16px;
            line-height: 1.2;
        }

        .brand-subtitle {
            color: var(--primary);
            font-size: 10px;
            font-weight: 700;
        }

        .home-link {
            color: var(--muted);
            font-size: 13px;
            font-weight: 600;

            transition: .2s;
        }

        .home-link:hover {
            color: var(--primary);
        }

        main {
            flex: 1;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 40px 15px;
        }

        .auth-wrapper {
            width: 100%;
            max-width: 460px;
        }

        .auth-card {
            background: var(--surface);

            border: 1px solid var(--border);

            border-radius: 25px;

            padding: 34px 30px;

            box-shadow:
                0 20px 55px rgba(23, 32, 51, .09);
        }

        .auth-icon {
            width: 62px;
            height: 62px;

            margin: 0 auto 17px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 19px;

            background: var(--primary-light);

            font-size: 29px;
        }

        .auth-title {
            text-align: center;

            font-size: 28px;
            font-weight: 800;

            margin-bottom: 6px;
        }

        .auth-description {
            text-align: center;

            color: var(--muted);

            font-size: 13px;

            margin-bottom: 27px;
        }

        .form-group {
            margin-bottom: 17px;
        }

        label {
            display: block;

            font-size: 13px;
            font-weight: 700;

            margin-bottom: 7px;
        }

        input {
            width: 100%;

            height: 49px;

            padding: 0 14px;

            border: 1px solid var(--border);

            border-radius: 12px;

            background: #fbfcfe;

            color: var(--text);

            outline: none;

            font-size: 14px;

            transition: .2s;
        }

        input:focus {
            border-color: var(--primary);

            background: white;

            box-shadow:
                0 0 0 4px rgba(23, 105, 224, .09);
        }

        input::placeholder {
            color: #a2aaba;
        }

        .auth-button {
            width: 100%;

            height: 50px;

            border: none;

            border-radius: 13px;

            background: var(--primary);

            color: white;

            font-size: 15px;
            font-weight: 800;

            cursor: pointer;

            transition: .2s;
        }

        .auth-button:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
        }

        .auth-button:disabled {
            opacity: .65;
            cursor: not-allowed;
            transform: none;
        }

        .register-button {
            margin-top: 10px;

            background: var(--primary-light);

            color: var(--primary);
        }

        .register-button:hover {
            background: #dceaff;
        }

        .divider {
            display: flex;
            align-items: center;

            gap: 12px;

            margin: 22px 0;
        }

        .divider::before,
        .divider::after {
            content: "";

            flex: 1;

            height: 1px;

            background: var(--border);
        }

        .divider span {
            color: #98a1b1;

            font-size: 11px;
            font-weight: 700;
        }

        .message {
            min-height: 22px;

            margin-top: 17px;

            text-align: center;

            font-size: 13px;
            font-weight: 600;

            color: var(--muted);
        }

        .back-link {
            display: block;

            margin-top: 22px;

            text-align: center;

            color: var(--primary);

            font-size: 13px;
            font-weight: 700;
        }

        footer {
            padding: 22px 15px;

            text-align: center;

            color: #8993a5;

            font-size: 11px;
        }

        @media (max-width: 500px) {

            header {
                height: 64px;
            }

            .auth-card {
                padding: 28px 20px;

                border-radius: 21px;
            }

            .auth-title {
                font-size: 25px;
            }

            .home-link {
                font-size: 12px;
            }

            .brand-name {
                font-size: 14px;
            }

            .brand-icon {
                width: 39px;
                height: 39px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="header-inner">

        <a href="index.html" class="brand">

            <div class="brand-icon">
                🎓
            </div>

            <div>
                <div class="brand-name">
                    عالم شيخ الأساتذة
                </div>

                <div class="brand-subtitle">
                    الأستاذ AI
                </div>
            </div>

        </a>

        <a href="index.html" class="home-link">
            العودة للرئيسية
        </a>

    </div>
</header>


<main>

    <div class="auth-wrapper">

        <div class="auth-card">

            <div class="auth-icon">
                🔐
            </div>

            <h1 class="auth-title">
                أهلاً بك من جديد
            </h1>

            <p class="auth-description">
                سجل دخولك لمتابعة رحلتك التعليمية
            </p>


            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        البريد الإلكتروني
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="example@email.com"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        كلمة المرور
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="أدخل كلمة المرور"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="auth-button"
                    id="loginButton"
                >
                    تسجيل الدخول
                </button>

            </form>


            <div class="divider">
                <span>أو</span>
            </div>


            <button
                type="button"
                class="auth-button register-button"
                id="registerButton"
            >
                إنشاء حساب جديد
            </button>


            <p
                id="authMessage"
                class="message"
                aria-live="polite"
            ></p>


            <a
                href="index.html"
                class="back-link"
            >
                ← العودة إلى الصفحة الرئيسية
            </a>

        </div>

    </div>

</main>


<footer>
    © 2026 عالم شيخ الأساتذة — الأستاذ AI
</footer>


<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
    "https://qkzdlxqledsznhbifaxy.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_ZdpHXwLlhpbXztsTXpAFTg_TgOji91v";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


/* =========================================
   ELEMENTS
========================================= */

const loginForm =
    document.getElementById("loginForm");

const loginButton =
    document.getElementById("loginButton");

const registerButton =
    document.getElementById("registerButton");

const message =
    document.getElementById("authMessage");


/* =========================================
   MESSAGE
========================================= */

function showMessage(text, type = "") {

    message.textContent = text;

    if (type === "success") {
        message.style.color = "var(--success)";
    }
    else if (type === "error") {
        message.style.color = "var(--danger)";
    }
    else {
        message.style.color = "var(--muted)";
    }
}


/* =========================================
   ERROR TRANSLATION
========================================= */

function translateError(error) {

    if (!error) {
        return "حدث خطأ غير متوقع.";
    }

    const text =
        error.toLowerCase();


    if (
        text.includes("invalid login credentials")
    ) {
        return "البريد الإلكتروني أو كلمة المرور غير صحيحة.";
    }


    if (
        text.includes("email not confirmed")
    ) {
        return "يرجى تأكيد بريدك الإلكتروني أولاً.";
    }


    if (
        text.includes("user already registered")
    ) {
        return "هذا البريد مسجل بالفعل. حاول تسجيل الدخول.";
    }


    if (
        text.includes("password should be at least")
    ) {
        return "يجب أن تحتوي كلمة المرور على 6 أحرف على الأقل.";
    }


    if (
        text.includes("rate limit")
    ) {
        return "تم تجاوز عدد المحاولات. حاول مرة أخرى لاحقًا.";
    }


    return "حدث خطأ. يرجى المحاولة مرة أخرى.";
}


/* =========================================
   LOGIN
========================================= */

loginForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const email =
            document
                .getElementById("email")
                .value
                .trim();


        const password =
            document
                .getElementById("password")
                .value;


        if (!email || !password) {

            showMessage(
                "أدخل البريد الإلكتروني وكلمة المرور.",
                "error"
            );

            return;
        }


        loginButton.disabled = true;

        loginButton.textContent =
            "جارٍ تسجيل الدخول...";

        showMessage("");


        try {

            const { data, error } =
                await supabaseClient.auth
                    .signInWithPassword({

                        email: email,

                        password: password

                    });


            if (error) {
                throw error;
            }


            if (!data.session) {

                throw new Error(
                    "Login session was not created."
                );

            }


            showMessage(
                "تم تسجيل الدخول بنجاح ✓",
                "success"
            );


            /*
             * مؤقتًا نعيد الطالب إلى الصفحة الرئيسية.
             *
             * لاحقًا، بعد بناء لوحة الطالب،
             * سنغير هذا الرابط إلى dashboard.html.
             */

            setTimeout(
                function() {

                    window.location.href =
                        "index.html";

                },
                700
            );


        }
        catch (error) {

            console.error(
                "Login error:",
                error
            );


            showMessage(
                translateError(error.message),
                "error"
            );

        }
        finally {

            loginButton.disabled =
                false;

            loginButton.textContent =
                "تسجيل الدخول";

        }

    }
);


/* =========================================
   CREATE ACCOUNT
========================================= */

registerButton.addEventListener(
    "click",
    async function() {

        const email =
            document
                .getElementById("email")
                .value
                .trim();


        const password =
            document
                .getElementById("password")
                .value;


        if (!email) {

            showMessage(
                "أدخل بريدك الإلكتروني أولاً.",
                "error"
            );

            return;
        }


        if (!password) {

            showMessage(
                "أدخل كلمة المرور أولاً.",
                "error"
            );

            return;
        }


        if (password.length < 6) {

            showMessage(
                "كلمة المرور يجب أن تحتوي على 6 أحرف على الأقل.",
                "error"
            );

            return;
        }


        registerButton.disabled = true;

        registerButton.textContent =
            "جارٍ إنشاء الحساب...";

        showMessage("");


        try {

            const { data, error } =
                await supabaseClient.auth
                    .signUp({

                        email: email,

                        password: password

                    });


            if (error) {
                throw error;
            }


            if (!data.user) {

                throw new Error(
                    "Account could not be created."
                );

            }


            if (!data.session) {

                showMessage(
                    "تم إنشاء الحساب. تحقق من بريدك الإلكتروني لتأكيد الحساب.",
                    "success"
                );

            }
            else {

                showMessage(
                    "تم إنشاء الحساب بنجاح ✓",
                    "success"
                );


                setTimeout(
                    function() {

                        window.location.href =
                            "index.html";

                    },
                    700
                );

            }

        }
        catch (error) {

            console.error(
                "Registration error:",
                error
            );


            showMessage(
                translateError(error.message),
                "error"
            );

        }
        finally {

            registerButton.disabled =
                false;

            registerButton.textContent =
                "إنشاء حساب جديد";

        }

    }
);


/* =========================================
   CHECK SESSION
========================================= */

async function checkSession() {

    try {

        const { data, error } =
            await supabaseClient.auth
                .getSession();


        if (error) {

            console.error(error);

            return;
        }


        if (data.session) {

            console.log(
                "Active session found:",
                data.session.user.id
            );

        }

    }
    catch (error) {

        console.error(
            "Session check error:",
            error
        );

    }

}


checkSession();

</script>

</body>
            </html>
