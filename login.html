<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sign In | VID SECRET</title>

    <meta
        name="description"
        content="Sign in to your VID SECRET account."
    >

    <meta
        name="theme-color"
        content="#050505"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<!-- ================= HEADER ================= -->

<header class="site-header">

    <div class="container header-content">

        <a
            href="index.html"
            class="logo"
        >

            <span class="logo-icon">
                ▶
            </span>

            <span class="logo-text">
                VID <strong>SECRET</strong>
            </span>

        </a>


        <nav class="main-nav">

            <a href="index.html">
                Home
            </a>

            <a href="index.html#videos">
                Videos
            </a>

            <a href="index.html#categories">
                Categories
            </a>

        </nav>

    </div>

</header>


<!-- ================= MAIN ================= -->

<main>

<section class="login-page">

    <div class="container">


        <div class="auth-box">


            <div class="auth-logo">
                🔐
            </div>


            <span class="card-category">
                VID SECRET
            </span>


            <h1>
                Sign In
            </h1>


            <p class="auth-description">

                Sign in to access your account
                and personal content.

            </p>


            <!-- LOGIN FORM -->

            <form id="loginForm">


                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="example@email.com"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="button auth-button"
                >

                    Sign In

                </button>


            </form>


            <!-- DIVIDER -->

            <div class="auth-divider">

                <span>
                    OR
                </span>

            </div>


            <!-- REGISTER -->

            <button
                type="button"
                class="button secondary-button auth-button"
                onclick="showRegister()"
            >

                Create New Account

            </button>


            <!-- MESSAGE -->

            <p
                id="authMessage"
                class="auth-message"
            ></p>


            <!-- BACK -->

            <a
                href="index.html"
                class="back-link auth-back"
            >

                ← Back to Home

            </a>


        </div>

    </div>

</section>

</main>


<!-- ================= FOOTER ================= -->

<footer class="site-footer">

    <div class="container">

        <div class="footer-logo">

            ▶ VID <strong>SECRET</strong>

        </div>


        <p>

            © 2026 VID SECRET — All Rights Reserved

        </p>

    </div>

</footer>


<!-- ================= SCRIPT ================= -->

<script>

const loginForm =
    document.getElementById("loginForm");


loginForm.addEventListener(
    "submit",
    function(event) {

        event.preventDefault();

        const message =
            document.getElementById("authMessage");

        message.textContent =
            "The account system will be connected to the database in the next phase.";

    }
);


function showRegister() {

    const message =
        document.getElementById("authMessage");

    message.textContent =
        "Account registration will be activated after connecting the database.";

}

</script>


</body>

</html>
