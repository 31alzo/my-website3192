<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sign In | VID SECRET</title>

<meta
    name="description"
    content="Sign in to your VID SECRET account."
>

<meta name="theme-color" content="#050505">

<link rel="stylesheet" href="style.css">

<!-- Supabase JavaScript -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head><body><header class="site-header"><div class="container header-content">

    <a href="index.html" class="logo">
        <span class="logo-icon">▶</span>

        <span class="logo-text">
            VID <strong>SECRET</strong>
        </span>
    </a>

    <nav class="main-nav">
        <a href="index.html">Home</a>
        <a href="index.html#videos">Videos</a>
        <a href="index.html#categories">Categories</a>
    </nav>

</div>

</header><main><section class="login-page"><div class="container">

    <div class="auth-box">

        <div class="auth-logo">
            🔐
        </div>

        <span class="card-category">
            VID SECRET
        </span>

        <h1>
            Sign In
        </h1>

        <p class="auth-description">
            Sign in to access your account
            and personal content.
        </p>


        <!-- LOGIN -->

        <form id="loginForm">

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="example@email.com"
                    autocomplete="email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <button
                type="submit"
                class="button auth-button"
                id="loginButton"
            >
                Sign In
            </button>

        </form>


        <div class="auth-divider">
            <span>OR</span>
        </div>


        <!-- REGISTER -->

        <button
            type="button"
            class="button secondary-button auth-button"
            id="registerButton"
        >
            Create New Account
        </button>


        <!-- MESSAGE -->

        <p
            id="authMessage"
            class="auth-message"
            aria-live="polite"
        ></p>


        <a
            href="index.html"
            class="back-link auth-back"
        >
            ← Back to Home
        </a>

    </div>

</div>

</section></main><footer class="site-footer"><div class="container">

    <div class="footer-logo">
        ▶ VID <strong>SECRET</strong>
    </div>

    <p>
        © 2026 VID SECRET — All Rights Reserved
    </p>

</div>

</footer><script>

/* =========================================
   SUPABASE CONFIGURATION
========================================= */

const SUPABASE_URL =
    "https://qkzdlxqledsznhbifaxy.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_ZdpHXwLlhpbXztsTXpAFTg_TgOji91v";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


/* =========================================
   ELEMENTS
========================================= */

const loginForm =
    document.getElementById("loginForm");

const loginButton =
    document.getElementById("loginButton");

const registerButton =
    document.getElementById("registerButton");

const message =
    document.getElementById("authMessage");


/* =========================================
   MESSAGE FUNCTION
========================================= */

function showMessage(text) {

    message.textContent = text;

}


/* =========================================
   LOGIN
========================================= */

loginForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        const email =
            document.getElementById("email")
                .value
                .trim();

        const password =
            document.getElementById("password")
                .value;


        if (!email || !password) {

            showMessage(
                "Please enter your email and password."
            );

            return;

        }


        loginButton.disabled = true;

        loginButton.textContent =
            "Signing In...";

        showMessage("");


        try {

            const { data, error } =
                await supabaseClient.auth
                    .signInWithPassword({

                        email: email,

                        password: password

                    });


            if (error) {

                throw error;

            }


            if (!data.session) {

                throw new Error(
                    "Login session was not created."
                );

            }


            console.log(
                "Logged in user:",
                data.user
            );


            console.log(
                "User UID:",
                data.user.id
            );


            showMessage(
                "Login successful!"
            );


            /*
             * Give Supabase time to save
             * the authentication session.
             */

            setTimeout(
                function() {

                    window.location.href =
                        "index.html";

                },
                800
            );


        } catch (error) {

            console.error(
                "Login error:",
                error
            );


            showMessage(
                translateError(error.message)
            );


        } finally {

            loginButton.disabled =
                false;

            loginButton.textContent =
                "Sign In";

        }

    }
);


/* =========================================
   CREATE ACCOUNT
========================================= */

registerButton.addEventListener(
    "click",
    async function() {

        const email =
            document.getElementById("email")
                .value
                .trim();

        const password =
            document.getElementById("password")
                .value;


        if (!email) {

            showMessage(
                "Enter your email address first."
            );

            return;

        }


        if (!password) {

            showMessage(
                "Enter a password first."
            );

            return;

        }


        if (password.length < 6) {

            showMessage(
                "Password must contain at least 6 characters."
            );

            return;

        }


        registerButton.disabled =
            true;

        registerButton.textContent =
            "Creating Account...";

        showMessage("");


        try {

            const { data, error } =
                await supabaseClient.auth
                    .signUp({

                        email: email,

                        password: password

                    });


            if (error) {

                throw error;

            }


            if (!data.user) {

                throw new Error(
                    "Account could not be created."
                );

            }


            /*
             * If email confirmation is enabled,
             * there will be no active session yet.
             */

            if (!data.session) {

                showMessage(
                    "Account created successfully. Please check your email and confirm your account."
                );

            } else {

                showMessage(
                    "Account created successfully!"
                );


                setTimeout(
                    function() {

                        window.location.href =
                            "index.html";

                    },
                    800
                );

            }


        } catch (error) {

            console.error(
                "Registration error:",
                error
            );


            showMessage(
                translateError(error.message)
            );


        } finally {

            registerButton.disabled =
                false;

            registerButton.textContent =
                "Create New Account";

        }

    }
);


/* =========================================
   ERROR TRANSLATION
========================================= */

function translateError(error) {

    if (!error) {

        return "Something went wrong.";

    }


    const text =
        error.toLowerCase();


    if (
        text.includes(
            "invalid login credentials"
        )
    ) {

        return "Incorrect email or password.";

    }


    if (
        text.includes(
            "email not confirmed"
        )
    ) {

        return "Please confirm your email before signing in.";

    }


    if (
        text.includes(
            "user already registered"
        )
    ) {

        return "This email is already registered. Try signing in.";

    }


    if (
        text.includes(
            "password should be at least"
        )
    ) {

        return "Password must contain at least 6 characters.";

    }


    if (
        text.includes(
            "rate limit"
        )
    ) {

        return "Too many attempts. Please wait and try again.";

    }


    return error;

}


/* =========================================
   CHECK CURRENT SESSION
========================================= */

async function checkSession() {

    try {

        const { data, error } =
            await supabaseClient.auth
                .getSession();


        if (error) {

            console.error(error);

            return;

        }


        if (data.session) {

            console.log(
                "Active session found."
            );

            console.log(
                "User UID:",
                data.session.user.id
            );

        }

    } catch (error) {

        console.error(
            "Session check error:",
            error
        );

    }

}


checkSession();


/* =========================================
   AUTH STATE LISTENER
========================================= */

supabaseClient.auth.onAuthStateChange(
    function(event, session) {

        console.log(
            "Auth state:",
            event
        );


        if (session) {

            console.log(
                "Authenticated UID:",
                session.user.id
            );

        }

    }
);

</script></body>
            </html>
