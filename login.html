<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>تسجيل الدخول | EduNova AI</title>

  <link rel="stylesheet" href="style.css">

  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .auth-container {
      width: 100%;
      max-width: 430px;
    }

    .auth-logo {
      text-align: center;
      margin-bottom: 24px;
    }

    .auth-logo-icon {
      width: 70px;
      height: 70px;
      margin: 0 auto;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--primary);
      color: #fff;
      font-size: 28px;
      font-weight: 800;
      box-shadow: var(--shadow-lg);
    }

    .auth-logo h1 {
      margin-top: 12px;
      color: var(--text);
      font-size: 25px;
      font-weight: 800;
    }

    .auth-logo p {
      margin-top: 6px;
      color: var(--text-muted);
      font-size: 14px;
    }

    .auth-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 24px;
      box-shadow: var(--shadow-lg);
    }

    .auth-tabs {
      display: flex;
      gap: 5px;
      background: var(--surface-alt);
      padding: 5px;
      border-radius: var(--radius-md);
      margin-bottom: 24px;
    }

    .auth-tab {
      flex: 1;
      border: 0;
      background: transparent;
      color: var(--text-muted);
      padding: 12px;
      border-radius: var(--radius-sm);
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: var(--transition-fast);
    }

    .auth-tab.active {
      background: var(--surface);
      color: var(--primary);
      box-shadow: var(--shadow-sm);
    }

    .auth-form-title {
      color: var(--text);
      font-size: 22px;
      margin-bottom: 8px;
    }

    .auth-form-description {
      color: var(--text-muted);
      font-size: 14px;
      line-height: 1.7;
      margin-bottom: 22px;
    }

    .auth-field {
      margin-bottom: 16px;
    }

    .auth-field label {
      display: block;
      margin-bottom: 7px;
      color: var(--text);
      font-size: 14px;
      font-weight: 700;
    }

    .auth-field input {
      width: 100%;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--surface);
      color: var(--text);
      font-size: 15px;
      outline: none;
      transition: var(--transition-fast);
    }

    .auth-field input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-soft);
    }

    .auth-main-btn {
      width: 100%;
      border: 0;
      background: var(--primary);
      color: #fff;
      padding: 15px;
      border-radius: var(--radius-md);
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 5px;
      transition: var(--transition-fast);
    }

    .auth-main-btn:hover {
      filter: brightness(.94);
    }

    .auth-main-btn:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .auth-message {
      display: none;
      padding: 12px;
      border-radius: var(--radius-md);
      margin-bottom: 16px;
      font-size: 14px;
      line-height: 1.7;
    }

    .auth-message.success {
      display: block;
      background: var(--success-soft);
      color: var(--success);
      border: 1px solid var(--success);
    }

    .auth-message.error {
      display: block;
      background: var(--danger-soft);
      color: var(--danger);
      border: 1px solid var(--danger);
    }

    .auth-back {
      text-align: center;
      margin-top: 18px;
    }

    .auth-back button {
      border: 0;
      background: transparent;
      color: var(--primary);
      font-size: 14px;
      cursor: pointer;
    }

    .auth-footer {
      text-align: center;
      color: var(--text-muted);
      font-size: 12px;
      margin-top: 20px;
    }

    html.dark-mode .auth-logo-icon {
      box-shadow: 0 10px 30px rgba(0, 0, 0, .35);
    }

    @media (max-width: 480px) {
      .auth-page {
        padding: 16px 12px;
      }

      .auth-card {
        padding: 20px;
      }

      .auth-logo h1 {
        font-size: 22px;
      }
    }
  </style>
</head>

<body>

  <main class="auth-page">

    <div class="auth-container">

      <!-- LOGO -->

      <div class="auth-logo">

        <div class="auth-logo-icon">
          AI
        </div>

        <h1 data-i18n="site_name">
          EduNova AI
        </h1>

        <p data-i18n="teacher_description">
          الأستاذ AI — طريقك نحو تعلم أفضل
        </p>

      </div>


      <!-- CARD -->

      <div class="auth-card">

        <!-- TABS -->

        <div class="auth-tabs">

          <button
            type="button"
            class="auth-tab active"
            id="loginTab"
            onclick="showLogin()"
            data-i18n="login"
          >
            تسجيل الدخول
          </button>

          <button
            type="button"
            class="auth-tab"
            id="registerTab"
            onclick="showRegister()"
            data-i18n="register"
          >
            إنشاء حساب
          </button>

        </div>


        <!-- MESSAGE -->

        <div
          id="message"
          class="auth-message"
          role="alert"
          aria-live="polite"
        ></div>


        <!-- LOGIN -->

        <div id="loginForm">

          <h2
            class="auth-form-title"
            data-i18n="welcome_back"
          >
            مرحبًا بعودتك 👋
          </h2>

          <p
            class="auth-form-description"
            data-i18n="login_description"
          >
            سجل الدخول للانتقال إلى لوحة الطالب ومتابعة تعلمك.
          </p>


          <div class="auth-field">

            <label
              for="loginEmail"
              data-i18n="email"
            >
              البريد الإلكتروني
            </label>

            <input
              type="email"
              id="loginEmail"
              placeholder="example@email.com"
              data-i18n-placeholder="email_placeholder"
              autocomplete="email"
            >

          </div>


          <div class="auth-field">

            <label
              for="loginPassword"
              data-i18n="password"
            >
              كلمة المرور
            </label>

            <input
              type="password"
              id="loginPassword"
              placeholder="أدخل كلمة المرور"
              data-i18n-placeholder="password_placeholder"
              autocomplete="current-password"
            >

          </div>


          <button
            type="button"
            class="auth-main-btn"
            id="loginButton"
            onclick="login()"
            data-i18n="login"
          >
            تسجيل الدخول
          </button>

        </div>


        <!-- REGISTER -->

        <div
          id="registerForm"
          style="display:none;"
        >

          <h2
            class="auth-form-title"
            data-i18n="create_account"
          >
            إنشاء حساب جديد 🎓
          </h2>

          <p
            class="auth-form-description"
            data-i18n="register_description"
          >
            أنشئ حسابك وابدأ رحلتك التعليمية مع الأستاذ AI.
          </p>


          <div class="auth-field">

            <label
              for="registerName"
              data-i18n="name"
            >
              الاسم
            </label>

            <input
              type="text"
              id="registerName"
              placeholder="اكتب اسمك"
              data-i18n-placeholder="name_placeholder"
              autocomplete="name"
            >

          </div>


          <div class="auth-field">

            <label
              for="registerEmail"
              data-i18n="email"
            >
              البريد الإلكتروني
            </label>

            <input
              type="email"
              id="registerEmail"
              placeholder="example@email.com"
              data-i18n-placeholder="email_placeholder"
              autocomplete="email"
            >

          </div>


          <div class="auth-field">

            <label
              for="registerPassword"
              data-i18n="password"
            >
              كلمة المرور
            </label>

            <input
              type="password"
              id="registerPassword"
              placeholder="6 أحرف على الأقل"
              data-i18n-placeholder="password_min"
              autocomplete="new-password"
            >

          </div>


          <button
            type="button"
            class="auth-main-btn"
            id="registerButton"
            onclick="register()"
            data-i18n="register"
          >
            إنشاء الحساب
          </button>

        </div>


        <!-- BACK -->

        <div class="auth-back">

          <button
            type="button"
            onclick="goHome()"
            data-i18n="back_home"
          >
            ← العودة إلى الصفحة الرئيسية
          </button>

        </div>

      </div>


      <!-- FOOTER -->

      <div class="auth-footer">

        © <span id="currentYear">2026</span>
        <span data-i18n="site_name">EduNova AI</span>
        —
        <span data-i18n="ai_teacher">الأستاذ AI</span>

      </div>

    </div>

  </main>


  <!-- GLOBAL SCRIPT -->

  <script src="script.js"></script>


  <!-- SUPABASE -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <script>

    /* =========================================================
       LOGIN PAGE
       EduNova AI
       Arabic / French • Global Theme • Supabase
       ========================================================= */


    const SUPABASE_URL =
      "https://qkzdlxqledsznhbifaxy.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_ZdpHXwLlhpbXztsTXpAFTg_TgOji91v";


    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    /* =========================================================
       TRANSLATIONS
       ========================================================= */

    const LOGIN_TRANSLATIONS = {

      ar: {

        register: "إنشاء حساب",
        welcome_back: "مرحبًا بعودتك 👋",
        login_description:
          "سجل الدخول للانتقال إلى لوحة الطالب ومتابعة تعلمك.",

        create_account:
          "إنشاء حساب جديد 🎓",

        register_description:
          "أنشئ حسابك وابدأ رحلتك التعليمية مع الأستاذ AI.",

        email:
          "البريد الإلكتروني",

        password:
          "كلمة المرور",

        name:
          "الاسم",

        email_placeholder:
          "example@email.com",

        password_placeholder:
          "أدخل كلمة المرور",

        password_min:
          "6 أحرف على الأقل",

        name_placeholder:
          "اكتب اسمك",

        back_home:
          "← العودة إلى الصفحة الرئيسية",

        login_loading:
          "جاري تسجيل الدخول...",

        register_loading:
          "جاري إنشاء الحساب...",

        login_success:
          "تم تسجيل الدخول بنجاح. جاري فتح لوحة الطالب...",

        session_error:
          "تم تسجيل الدخول، لكن لم يتم إنشاء جلسة.",

        fill_all:
          "الرجاء ملء جميع البيانات.",

        password_short:
          "كلمة المرور يجب أن تحتوي على 6 أحرف على الأقل.",

        register_success:
          "تم إنشاء الحساب بنجاح. تحقق من بريدك الإلكتروني لتأكيد الحساب، ثم سجل الدخول.",

        unknown_error:
          "حدث خطأ غير معروف.",

        invalid_credentials:
          "البريد الإلكتروني أو كلمة المرور غير صحيحة.",

        email_not_confirmed:
          "يجب تأكيد البريد الإلكتروني أولًا.",

        already_registered:
          "هذا البريد الإلكتروني مسجل بالفعل.",

        password_too_short:
          "كلمة المرور قصيرة جدًا.",

        invalid_email:
          "البريد الإلكتروني غير صالح.",

        generic_error:
          "حدث خطأ. حاول مرة أخرى."

      },


      fr: {

        register: "Créer un compte",
        welcome_back: "Bon retour 👋",
        login_description:
          "Connectez-vous pour accéder à votre tableau de bord et continuer votre apprentissage.",

        create_account:
          "Créer un nouveau compte 🎓",

        register_description:
          "Créez votre compte et commencez votre parcours éducatif avec le professeur AI.",

        email:
          "Adresse e-mail",

        password:
          "Mot de passe",

        name:
          "Nom",

        email_placeholder:
          "example@email.com",

        password_placeholder:
          "Entrez votre mot de passe",

        password_min:
          "6 caractères minimum",

        name_placeholder:
          "Entrez votre nom",

        back_home:
          "→ Retour à l'accueil",

        login_loading:
          "Connexion en cours...",

        register_loading:
          "Création du compte...",

        login_success:
          "Connexion réussie. Ouverture du tableau de bord...",

        session_error:
          "Connexion réussie, mais aucune session n'a été créée.",

        fill_all:
          "Veuillez remplir tous les champs.",

        password_short:
          "Le mot de passe doit contenir au moins 6 caractères.",

        register_success:
          "Compte créé avec succès. Vérifiez votre e-mail pour confirmer votre compte, puis connectez-vous.",

        unknown_error:
          "Une erreur inconnue s'est produite.",

        invalid_credentials:
          "L'adresse e-mail ou le mot de passe est incorrect.",

        email_not_confirmed:
          "Vous devez d'abord confirmer votre adresse e-mail.",

        already_registered:
          "Cette adresse e-mail est déjà enregistrée.",

        password_too_short:
          "Le mot de passe est trop court.",

        invalid_email:
          "L'adresse e-mail n'est pas valide.",

        generic_error:
          "Une erreur s'est produite. Veuillez réessayer."

      }

    };


    /* =========================================================
       LANGUAGE
       ========================================================= */

    function getLoginLanguage() {

      if (
        typeof getSiteLanguage === "function"
      ) {
        return getSiteLanguage();
      }

      return localStorage.getItem("site_language") || "ar";
    }


    function loginText(key) {

      const language =
        getLoginLanguage();

      return (
        LOGIN_TRANSLATIONS[language]?.[key] ||
        LOGIN_TRANSLATIONS.ar[key] ||
        key
      );

    }


    function translateLoginPage() {

      const language =
        getLoginLanguage();


      if (
        typeof applySiteLanguage === "function"
      ) {
        applySiteLanguage(language);
      }


      document.documentElement.lang =
        language;

      document.documentElement.dir =
        language === "fr" ? "ltr" : "rtl";


      document.title =
        language === "fr"
          ? "Connexion | EduNova AI"
          : "تسجيل الدخول | EduNova AI";

    }


    /* =========================================================
       TABS
       ========================================================= */

    function showLogin() {

      document.getElementById("loginForm")
        .style.display = "block";

      document.getElementById("registerForm")
        .style.display = "none";


      document.getElementById("loginTab")
        .classList.add("active");

      document.getElementById("registerTab")
        .classList.remove("active");


      clearMessage();

    }


    function showRegister() {

      document.getElementById("loginForm")
        .style.display = "none";

      document.getElementById("registerForm")
        .style.display = "block";


      document.getElementById("loginTab")
        .classList.remove("active");

      document.getElementById("registerTab")
        .classList.add("active");


      clearMessage();

    }


    /* =========================================================
       MESSAGES
       ========================================================= */

    function showMessage(text, type) {

      const message =
        document.getElementById("message");


      message.textContent =
        text;

      message.className =
        "auth-message " + type;

    }


    function clearMessage() {

      const message =
        document.getElementById("message");


      message.textContent =
        "";

      message.className =
        "auth-message";

    }


    /* =========================================================
       LOGIN
       ========================================================= */

    async function login() {

      const email =
        document.getElementById("loginEmail")
          .value
          .trim();


      const password =
        document.getElementById("loginPassword")
          .value;


      const button =
        document.getElementById("loginButton");


      if (!email || !password) {

        showMessage(
          loginText("fill_all"),
          "error"
        );

        return;
      }


      button.disabled = true;

      button.textContent =
        loginText("login_loading");


      const { data, error } =
        await supabaseClient.auth
          .signInWithPassword({

            email: email,
            password: password

          });


      if (error) {

        showMessage(
          translateError(error.message),
          "error"
        );


        button.disabled = false;

        button.textContent =
          loginText("login");


        return;
      }


      if (data.session) {

        showMessage(
          loginText("login_success"),
          "success"
        );


        setTimeout(() => {

          window.location.href =
            "dashboard.html";

        }, 500);


      } else {

        showMessage(
          loginText("session_error"),
          "error"
        );


        button.disabled = false;

        button.textContent =
          loginText("login");

      }

    }


    /* =========================================================
       REGISTER
       ========================================================= */

    async function register() {

      const name =
        document.getElementById("registerName")
          .value
          .trim();


      const email =
        document.getElementById("registerEmail")
          .value
          .trim();


      const password =
        document.getElementById("registerPassword")
          .value;


      const button =
        document.getElementById("registerButton");


      if (!name || !email || !password) {

        showMessage(
          loginText("fill_all"),
          "error"
        );

        return;
      }


      if (password.length < 6) {

        showMessage(
          loginText("password_short"),
          "error"
        );

        return;
      }


      button.disabled = true;

      button.textContent =
        loginText("register_loading");


      const { data, error } =
        await supabaseClient.auth.signUp({

          email: email,

          password: password,

          options: {

            data: {

              full_name: name

            }

          }

        });


      if (error) {

        showMessage(
          translateError(error.message),
          "error"
        );


        button.disabled = false;

        button.textContent =
          loginText("register");


        return;
      }


      if (!data.session) {

        showMessage(
          loginText("register_success"),
          "success"
        );


        button.disabled = false;

        button.textContent =
          loginText("register");


        return;
      }


      window.location.href =
        "dashboard.html";

    }


    /* =========================================================
       SUPABASE ERROR TRANSLATION
       ========================================================= */

    function translateError(message) {

      if (!message) {

        return loginText("unknown_error");

      }


      if (
        message.includes(
          "Invalid login credentials"
        )
      ) {

        return loginText(
          "invalid_credentials"
        );

      }


      if (
        message.includes(
          "Email not confirmed"
        )
      ) {

        return loginText(
          "email_not_confirmed"
        );

      }


      if (
        message.includes(
          "User already registered"
        )
      ) {

        return loginText(
          "already_registered"
        );

      }


      if (
        message.includes(
          "Password should be at least"
        )
      ) {

        return loginText(
          "password_too_short"
        );

      }


      if (
        message.includes(
          "Unable to validate email"
        )
      ) {

        return loginText(
          "invalid_email"
        );

      }


      return loginText(
        "generic_error"
      );

    }


    /* =========================================================
       HOME
       ========================================================= */

    function goHome() {

      if (
        typeof goTo === "function"
      ) {

        goTo("index.html");

      } else {

        window.location.href =
          "index.html";

      }

    }


    /* =========================================================
       EXISTING SESSION
       ========================================================= */

    async function checkExistingSession() {

      try {

        const { data } =
          await supabaseClient.auth
            .getSession();


        if (data.session) {

          window.location.href =
            "dashboard.html";

        }

      } catch (error) {

        console.error(
          "Session check error:",
          error
        );

      }

    }


    /* =========================================================
       GLOBAL SETTINGS
       ========================================================= */

    function initializeLoginPage() {

      if (
        typeof initializeGlobalSettings === "function"
      ) {

        initializeGlobalSettings();

      }


      if (
        typeof applySiteTheme === "function"
      ) {

        applySiteTheme(
          getSiteTheme()
        );

      }


      translateLoginPage();


      if (
        typeof setCurrentYear === "function"
      ) {

        setCurrentYear(
          "currentYear"
        );

      } else {

        document.getElementById(
          "currentYear"
        ).textContent =
          new Date().getFullYear();

      }

    }


    window.addEventListener(
      "storage",
      function(event) {

        if (
          event.key === "site_language"
        ) {

          translateLoginPage();

        }


        if (
          event.key === "site_theme"
        ) {

          if (
            typeof applySiteTheme === "function"
          ) {

            applySiteTheme(
              event.newValue || "light"
            );

          }

        }

      }
    );


    window.addEventListener(
      "languageChanged",
      function() {

        translateLoginPage();

      }
    );


    window.addEventListener(
      "languagechange",
      function() {

        translateLoginPage();

      }
    );


    /* =========================================================
       START
       ========================================================= */

    document.addEventListener(
      "DOMContentLoaded",
      function() {

        initializeLoginPage();

        checkExistingSession();

      }
    );

  </script>

</body>
  </html>
