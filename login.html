<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>تسجيل الدخول | عالم شيخ الأساتذة</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Tahoma, sans-serif;
      background: linear-gradient(135deg, #eef6ff, #ffffff);
      color: #123;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 430px;
    }

    .logo {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo-icon {
      width: 70px;
      height: 70px;
      margin: auto;
      background: #1677ff;
      color: white;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: bold;
      box-shadow: 0 10px 25px rgba(22,119,255,.25);
    }

    .logo h1 {
      margin-top: 12px;
      font-size: 25px;
      color: #0757c9;
    }

    .logo p {
      margin-top: 6px;
      color: #667085;
      font-size: 14px;
    }

    .card {
      background: white;
      border-radius: 24px;
      padding: 25px;
      box-shadow: 0 15px 45px rgba(0, 70, 160, .12);
      border: 1px solid #e7effa;
    }

    .tabs {
      display: flex;
      background: #f1f6fd;
      padding: 5px;
      border-radius: 14px;
      margin-bottom: 25px;
    }

    .tab {
      flex: 1;
      border: none;
      background: transparent;
      padding: 12px;
      border-radius: 10px;
      font-size: 15px;
      cursor: pointer;
      color: #667085;
      font-weight: bold;
    }

    .tab.active {
      background: white;
      color: #1268dc;
      box-shadow: 0 3px 10px rgba(0,0,0,.06);
    }

    .form-title {
      font-size: 22px;
      margin-bottom: 8px;
      color: #14213d;
    }

    .form-description {
      color: #667085;
      font-size: 14px;
      margin-bottom: 22px;
      line-height: 1.6;
    }

    .field {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: bold;
      color: #344054;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d0d5dd;
      border-radius: 12px;
      font-size: 15px;
      outline: none;
      transition: .2s;
      background: white;
    }

    input:focus {
      border-color: #1677ff;
      box-shadow: 0 0 0 3px rgba(22,119,255,.1);
    }

    .main-btn {
      width: 100%;
      border: none;
      background: #1677ff;
      color: white;
      padding: 15px;
      border-radius: 13px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
      transition: .2s;
    }

    .main-btn:hover {
      background: #075dcc;
    }

    .main-btn:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 16px;
      font-size: 14px;
      line-height: 1.6;
    }

    .message.success {
      display: block;
      background: #ecfdf3;
      color: #067647;
      border: 1px solid #abefc6;
    }

    .message.error {
      display: block;
      background: #fef3f2;
      color: #b42318;
      border: 1px solid #fecdca;
    }

    .back {
      text-align: center;
      margin-top: 18px;
    }

    .back a {
      color: #1677ff;
      text-decoration: none;
      font-size: 14px;
    }

    .footer {
      text-align: center;
      color: #98a2b3;
      font-size: 12px;
      margin-top: 20px;
    }

    @media (max-width: 480px) {
      body {
        padding: 15px;
      }

      .card {
        padding: 20px;
      }

      .logo h1 {
        font-size: 22px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">
      <div class="logo-icon">AI</div>
      <h1>عالم شيخ الأساتذة</h1>
      <p>الأستاذ AI — طريقك نحو تعلم أفضل</p>
    </div>

    <div class="card">

      <div class="tabs">
        <button class="tab active" id="loginTab" onclick="showLogin()">
          تسجيل الدخول
        </button>

        <button class="tab" id="registerTab" onclick="showRegister()">
          إنشاء حساب
        </button>
      </div>

      <div id="message" class="message"></div>

      <!-- LOGIN -->

      <div id="loginForm">

        <h2 class="form-title">مرحبًا بعودتك 👋</h2>

        <p class="form-description">
          سجل الدخول للانتقال إلى لوحة الطالب ومتابعة تعلمك.
        </p>

        <div class="field">
          <label for="loginEmail">البريد الإلكتروني</label>
          <input
            type="email"
            id="loginEmail"
            placeholder="example@email.com"
            autocomplete="email"
          >
        </div>

        <div class="field">
          <label for="loginPassword">كلمة المرور</label>
          <input
            type="password"
            id="loginPassword"
            placeholder="أدخل كلمة المرور"
            autocomplete="current-password"
          >
        </div>

        <button class="main-btn" id="loginButton" onclick="login()">
          تسجيل الدخول
        </button>

      </div>


      <!-- REGISTER -->

      <div id="registerForm" style="display:none;">

        <h2 class="form-title">إنشاء حساب جديد 🎓</h2>

        <p class="form-description">
          أنشئ حسابك وابدأ رحلتك التعليمية مع الأستاذ AI.
        </p>

        <div class="field">
          <label for="registerName">الاسم</label>
          <input
            type="text"
            id="registerName"
            placeholder="اكتب اسمك"
            autocomplete="name"
          >
        </div>

        <div class="field">
          <label for="registerEmail">البريد الإلكتروني</label>
          <input
            type="email"
            id="registerEmail"
            placeholder="example@email.com"
            autocomplete="email"
          >
        </div>

        <div class="field">
          <label for="registerPassword">كلمة المرور</label>
          <input
            type="password"
            id="registerPassword"
            placeholder="6 أحرف على الأقل"
            autocomplete="new-password"
          >
        </div>

        <button class="main-btn" id="registerButton" onclick="register()">
          إنشاء الحساب
        </button>

      </div>

      <div class="back">
        <a href="index.html">← العودة إلى الصفحة الرئيسية</a>
      </div>

    </div>

    <div class="footer">
      © 2026 عالم شيخ الأساتذة — الأستاذ AI
    </div>

  </div>


  <!-- SUPABASE -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    const SUPABASE_URL =
      "https://qkzdlxqledsznhbifaxy.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_ZdpHXwLlhpbXztsTXpAFTg_TgOji91v";

    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    // تغيير بين تسجيل الدخول وإنشاء الحساب

    function showLogin() {

      document.getElementById("loginForm").style.display = "block";
      document.getElementById("registerForm").style.display = "none";

      document.getElementById("loginTab").classList.add("active");
      document.getElementById("registerTab").classList.remove("active");

      clearMessage();
    }


    function showRegister() {

      document.getElementById("loginForm").style.display = "none";
      document.getElementById("registerForm").style.display = "block";

      document.getElementById("loginTab").classList.remove("active");
      document.getElementById("registerTab").classList.add("active");

      clearMessage();
    }


    function showMessage(text, type) {

      const message =
        document.getElementById("message");

      message.textContent = text;
      message.className = "message " + type;
    }


    function clearMessage() {

      const message =
        document.getElementById("message");

      message.textContent = "";
      message.className = "message";
    }


    // تسجيل الدخول

    async function login() {

      const email =
        document.getElementById("loginEmail").value.trim();

      const password =
        document.getElementById("loginPassword").value;

      const button =
        document.getElementById("loginButton");


      if (!email || !password) {

        showMessage(
          "الرجاء إدخال البريد الإلكتروني وكلمة المرور.",
          "error"
        );

        return;
      }


      button.disabled = true;
      button.textContent = "جاري تسجيل الدخول...";


      const { data, error } =
        await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });


      if (error) {

        showMessage(
          translateError(error.message),
          "error"
        );

        button.disabled = false;
        button.textContent = "تسجيل الدخول";

        return;
      }


      if (data.session) {

        showMessage(
          "تم تسجيل الدخول بنجاح. جاري فتح لوحة الطالب...",
          "success"
        );

        // الانتقال إلى لوحة الطالب
        window.location.href = "dashboard.html";

      } else {

        showMessage(
          "تم تسجيل الدخول، لكن لم يتم إنشاء جلسة.",
          "error"
        );

        button.disabled = false;
        button.textContent = "تسجيل الدخول";
      }
    }


    // إنشاء حساب

    async function register() {

      const name =
        document.getElementById("registerName").value.trim();

      const email =
        document.getElementById("registerEmail").value.trim();

      const password =
        document.getElementById("registerPassword").value;


      const button =
        document.getElementById("registerButton");


      if (!name || !email || !password) {

        showMessage(
          "الرجاء ملء جميع البيانات.",
          "error"
        );

        return;
      }


      if (password.length < 6) {

        showMessage(
          "كلمة المرور يجب أن تحتوي على 6 أحرف على الأقل.",
          "error"
        );

        return;
      }


      button.disabled = true;
      button.textContent = "جاري إنشاء الحساب...";


      const { data, error } =
        await supabaseClient.auth.signUp({

          email: email,

          password: password,

          options: {

            data: {
              full_name: name
            }

          }

        });


      if (error) {

        showMessage(
          translateError(error.message),
          "error"
        );

        button.disabled = false;
        button.textContent = "إنشاء الحساب";

        return;
      }


      /*
        إذا كان تأكيد البريد الإلكتروني مفعلاً
        فسيطلب Supabase من الطالب تأكيد بريده.
      */

      if (!data.session) {

        showMessage(
          "تم إنشاء الحساب بنجاح. تحقق من بريدك الإلكتروني لتأكيد الحساب، ثم سجل الدخول.",
          "success"
        );

        button.disabled = false;
        button.textContent = "إنشاء الحساب";

        return;
      }


      // إذا كان الدخول تلقائيًا بعد التسجيل
      window.location.href = "dashboard.html";
    }


    // ترجمة أخطاء Supabase إلى العربية

    function translateError(message) {

      if (!message) {
        return "حدث خطأ غير معروف.";
      }


      if (
        message.includes("Invalid login credentials")
      ) {
        return "البريد الإلكتروني أو كلمة المرور غير صحيحة.";
      }


      if (
        message.includes("Email not confirmed")
      ) {
        return "يجب تأكيد البريد الإلكتروني أولًا.";
      }


      if (
        message.includes("User already registered")
      ) {
        return "هذا البريد الإلكتروني مسجل بالفعل.";
      }


      if (
        message.includes("Password should be at least")
      ) {
        return "كلمة المرور قصيرة جدًا.";
      }


      if (
        message.includes("Unable to validate email")
      ) {
        return "البريد الإلكتروني غير صالح.";
      }


      return "حدث خطأ. حاول مرة أخرى.";
    }


    // إذا كان الطالب مسجل الدخول أصلًا
    // لا حاجة لإظهار صفحة الدخول

    async function checkExistingSession() {

      const { data } =
        await supabaseClient.auth.getSession();

      if (data.session) {

        window.location.href = "dashboard.html";

      }
    }


    checkExistingSession();

  </script>

</body>
              </html>
