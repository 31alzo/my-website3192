<!DOCTYPE html><html lang="ar" dir="rtl"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><title>الفصل الأول | عالم شيخ الأساتذة</title>

<link rel="stylesheet" href="style.css">

<style>
    .chapter-page {
        padding-bottom: 50px;
    }

    .chapter-hero {
        position: relative;
        overflow: hidden;

        padding: 25px 21px;
        margin-bottom: 22px;

        color: white;

        background:
            linear-gradient(
                135deg,
                var(--primary),
                var(--primary-dark)
            );

        border-radius: var(--radius-lg);

        box-shadow:
            0 14px 35px rgba(37, 99, 235, .16);
    }

    .chapter-hero-content {
        position: relative;
        z-index: 2;
    }

    .chapter-label {
        display: block;

        margin-bottom: 6px;

        font-size: 12px;

        opacity: .85;
    }

    .chapter-hero h1 {
        font-size: clamp(25px, 6vw, 32px);
        font-weight: 850;
    }

    .chapter-hero p {
        margin-top: 7px;

        font-size: 13px;
        line-height: 1.8;

        opacity: .9;
    }

    .chapter-progress-box {
        margin-top: 17px;
    }

    .chapter-progress-head {
        display: flex;

        justify-content: space-between;

        margin-bottom: 7px;

        font-size: 11px;

        opacity: .9;
    }

    .chapter-progress {
        height: 7px;

        overflow: hidden;

        background: rgba(255,255,255,.25);

        border-radius: 20px;
    }

    .chapter-progress-bar {
        width: 0%;
        height: 100%;

        background: white;

        border-radius: inherit;

        transition: width .3s ease;
    }

    .back-library {
        margin-bottom: 20px;
    }

    .lessons-header {
        display: flex;

        align-items: center;
        justify-content: space-between;

        gap: 10px;

        margin-bottom: 13px;
    }

    .lessons-header h2 {
        font-size: 20px;
        font-weight: 850;
    }

    .lessons-count {
        color: var(--text-soft);

        font-size: 11px;
    }

    .lessons-list {
        display: grid;

        gap: 10px;
    }

    .lesson-card {
        width: 100%;

        padding: 14px;

        display: flex;

        align-items: center;

        gap: 12px;

        text-align: right;

        background: var(--surface);

        border: 1px solid var(--border);

        border-radius: var(--radius-md);

        box-shadow: var(--shadow-sm);

        transition:
            transform var(--transition),
            box-shadow var(--transition),
            border-color var(--transition);
    }

    .lesson-card.lesson-open {
        cursor: pointer;
    }

    .lesson-card.lesson-open:hover {
        transform: translateY(-1px);

        border-color: #bfdbfe;

        box-shadow: var(--shadow-md);
    }

    .lesson-card.lesson-open:active {
        transform: scale(.99);
    }

    .lesson-number {
        width: 45px;
        height: 45px;

        flex-shrink: 0;

        display: grid;
        place-items: center;

        border-radius: 13px;

        background: var(--primary-light);

        color: var(--primary);

        font-size: 15px;
        font-weight: 850;
    }

    .lesson-card.completed .lesson-number {
        background: #dcfce7;
        color: #15803d;
    }

    .lesson-info {
        min-width: 0;
        flex: 1;
    }

    .lesson-info h3 {
        font-size: 14px;
        font-weight: 800;

        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .lesson-info p {
        margin-top: 4px;

        color: var(--text-soft);

        font-size: 11px;
    }

    .lesson-action {
        flex-shrink: 0;
    }

    .lesson-action span {
        min-width: 37px;
        height: 35px;

        padding: 0 9px;

        display: grid;
        place-items: center;

        border-radius: 9px;

        font-size: 11px;
        font-weight: 800;
    }

    .lesson-open .lesson-action span {
        background: var(--primary);
        color: white;
    }

    .lesson-locked .lesson-action span {
        background: #f1f5f9;
        color: var(--text-soft);
    }

    .free-label {
        display: inline-block;

        margin-right: 5px;

        padding: 3px 6px;

        background: #dcfce7;

        color: #15803d;

        border-radius: 6px;

        font-size: 9px;
        font-weight: 850;
    }

    .chapter-note {
        margin-top: 20px;

        padding: 16px;

        background: var(--primary-light);

        border: 1px solid #dbeafe;

        border-radius: var(--radius-md);

        color: var(--text-soft);

        font-size: 12px;

        line-height: 1.8;
    }

    @media (min-width: 700px) {

        .chapter-page {
            max-width: 850px;

            margin: auto;
        }

        .lessons-list {
            grid-template-columns: repeat(2, 1fr);
        }

    }
</style>

</head><body><!-- Header -->

<header class="site-header">

    <div class="container header-inner">

        <button
            class="brand"
            onclick="goHome()"
            aria-label="الصفحة الرئيسية">

            <span class="brand-icon">
                AI
            </span>

            <span>
                عالم شيخ الأساتذة
            </span>

        </button>


        <button
            class="btn btn-secondary"
            onclick="goLibrary()">

            📚 مكتبتي

        </button>

    </div>

</header>


<main class="page">

    <div class="container chapter-page">


        <!-- Hero -->

        <section class="chapter-hero">

            <div class="chapter-hero-content">

                <span class="chapter-label">
                    الرياضيات • الفصل الأول
                </span>

                <h1>
                    الفصل الأول
                </h1>

                <p>
                    ابدأ بالدروس بالترتيب وتابع
                    تقدمك خطوة بخطوة.
                </p>


                <div class="chapter-progress-box">

                    <div class="chapter-progress-head">

                        <span>
                            تقدمك
                        </span>

                        <span id="progressText">
                            0%
                        </span>

                    </div>

                    <div class="chapter-progress">

                        <div
                            id="progressBar"
                            class="chapter-progress-bar">
                        </div>

                    </div>

                </div>

            </div>

        </section>


        <!-- Back -->

        <button
            class="btn btn-secondary back-library"
            onclick="goLibrary()">

            ← العودة إلى مكتبتي

        </button>


        <!-- Lessons -->

        <section>

            <div class="lessons-header">

                <h2>
                    الدروس
                </h2>

                <span
                    id="lessonsCount"
                    class="lessons-count">

                    0 / 20 مكتمل

                </span>

            </div>


            <div
                id="lessonsList"
                class="lessons-list">
            </div>


            <div class="chapter-note">

                💡 <strong>ملاحظة:</strong>
                الدرس الأول متاح حاليًا للتجربة.
                سيتم فتح بقية الدروس في المراحل
                القادمة.

            </div>

        </section>


    </div>

</main>


<script>

    const TOTAL_LESSONS = 20;


    /* =========================
       LESSONS
       ========================= */

    function buildLessons() {

        const container =
            document.getElementById(
                "lessonsList"
            );


        container.innerHTML = "";


        let completed =
            getCompletedLessons();


        for (
            let number = 1;
            number <= TOTAL_LESSONS;
            number++
        ) {

            const isOpen =
                number === 1;


            const isCompleted =
                completed.includes(number);


            const card =
                document.createElement(
                    "button"
                );


            card.className =
                "lesson-card " +
                (isOpen
                    ? "lesson-open "
                    : "lesson-locked ") +
                (isCompleted
                    ? "completed"
                    : "");


            card.type = "button";


            if (isOpen) {

                card.onclick =
                    () => openLesson(number);

            } else {

                card.onclick =
                    () => lockedLesson();

            }


            const numberBox =
                document.createElement(
                    "div"
                );


            numberBox.className =
                "lesson-number";


            numberBox.innerHTML =
                isCompleted
                    ? "✓"
                    : number;


            const info =
                document.createElement(
                    "div"
                );


            info.className =
                "lesson-info";


            const title =
                document.createElement(
                    "h3"
                );


            title.textContent =
                "الدرس " + number;


            if (number === 1) {

                const free =
                    document.createElement(
                        "span"
                    );

                free.className =
                    "free-label";

                free.textContent =
                    "مجاني";

                title.appendChild(
                    free
                );

            }


            const description =
                document.createElement(
                    "p"
                );


            description.textContent =
                isOpen
                    ? "متاح للمشاهدة الآن"
                    : "هذا الدرس مقفل حاليًا";


            info.appendChild(
                title
            );

            info.appendChild(
                description
            );


            const action =
                document.createElement(
                    "div"
                );


            action.className =
                "lesson-action";


            const actionText =
                document.createElement(
                    "span"
                );


            actionText.textContent =
                isOpen
                    ? "فتح"
                    : "🔒";


            action.appendChild(
                actionText
            );


            card.appendChild(
                numberBox
            );

            card.appendChild(
                info
            );

            card.appendChild(
                action
            );


            container.appendChild(
                card
            );

        }


        updateProgress();

    }


    /* =========================
       COMPLETED LESSONS
       ========================= */

    function getCompletedLessons() {

        try {

            const saved =
                JSON.parse(
                    localStorage.getItem(
                        "completed_lessons_list"
                    ) || "[]"
                );


            return Array.isArray(saved)
                ? saved
                : [];

        } catch {

            return [];

        }

    }


    /* =========================
       PROGRESS
       ========================= */

    function updateProgress() {

        const completed =
            getCompletedLessons();


        const count =
            completed.length;


        const progress =
            Math.min(
                100,
                Math.round(
                    (count / TOTAL_LESSONS) * 100
                )
            );


        document.getElementById(
            "progressText"
        ).textContent =
            progress + "%";


        document.getElementById(
            "progressBar"
        ).style.width =
            progress + "%";


        document.getElementById(
            "lessonsCount"
        ).textContent =
            count +
            " / " +
            TOTAL_LESSONS +
            " مكتمل";

    }


    /* =========================
       OPEN LESSON
       ========================= */

    function openLesson(number) {

        if (number !== 1) {

            lockedLesson();

            return;

        }


        localStorage.setItem(
            "selected_lesson_number",
            number
        );


        window.location.href =
            "lesson.html";

    }


    /* =========================
       LOCKED
       ========================= */

    function lockedLesson() {

        alert(
            "هذا الدرس مقفل حاليًا 🔒\n\n" +
            "الدرس الأول متاح مجانًا، " +
            "وسيتم فتح بقية الدروس لاحقًا."
        );

    }


    /* =========================
       NAVIGATION
       ========================= */

    function goLibrary() {

        window.location.href =
            "library.html";

    }


    function goHome() {

        window.location.href =
            "index.html";

    }


    /* =========================
       START
       ========================= */

    buildLessons();

</script>

</body></html>
