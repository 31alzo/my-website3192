<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

          content="EduNova AI — المنتدى الطلابي للنقاش والتعاون وتبادل المعرفة.">

        /* =====================================================
           EduNova AI — Forum
           ===================================================== */

        .forum-hero {
            position: relative;
            overflow: hidden;
            margin-bottom: 22px;
            padding: 30px 24px;
            border-radius: 26px;

            background:
                linear-gradient(
                    135deg,
                    var(--primary),
                    var(--primary-dark)
                );

            color: #fff;

            box-shadow:
                0 16px 38px rgba(37,99,235,.18);
        }

        .forum-hero::after {
            content: "";
            position: absolute;
            width: 220px;
            height: 220px;
            left: -90px;
            top: -100px;
            border: 1px solid rgba(255,255,255,.12);
            border-radius: 50%;
        }

        .forum-hero-content {
            position: relative;
            z-index: 1;
        }

        .forum-hero .eyebrow {
            margin-bottom: 8px;
            color: rgba(255,255,255,.78);
            font-size: 13px;
            font-weight: 700;
        }

        .forum-hero h1 {
            margin: 0 0 10px;
            color: #fff;
            font-size: 28px;
            line-height: 1.3;
        }

        .forum-hero p {
            max-width: 680px;
            margin: 0;
            color: rgba(255,255,255,.86);
            font-size: 14px;
            line-height: 1.9;
        }

        .write-card {
            margin-bottom: 24px;
        }

        .write-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .write-icon {
            width: 46px;
            height: 46px;
            display: grid;
            place-items: center;
            flex-shrink: 0;

            border-radius: 14px;
            background: var(--primary-light);
            color: var(--primary);

            font-size: 13px;
            font-weight: 800;
        }

        .write-icon::before {
            content: "POST";
        }

        .write-header h2 {
            margin: 0;
            font-size: 18px;
        }

        .write-header p {
            margin: 4px 0 0;
            color: var(--text-soft);
            font-size: 12px;
        }

        .forum-input,
        .forum-textarea {
            width: 100%;
            box-sizing: border-box;

            margin-bottom: 10px;
            padding: 13px 14px;

            border: 1px solid var(--border);
            border-radius: 14px;

            background: var(--surface);
            color: var(--text);

            font-family: inherit;
            font-size: 14px;

            outline: none;

            transition:
                border-color .2s ease,
                box-shadow .2s ease;
        }

        .forum-input::placeholder,
        .forum-textarea::placeholder {
            color: var(--text-light);
        }

        .forum-input:focus,
        .forum-textarea:focus {
            border-color: var(--primary);
            box-shadow:
                0 0 0 4px
                rgba(37,99,235,.08);
        }

        .forum-textarea {
            min-height: 120px;
            resize: vertical;
            line-height: 1.8;
        }

        .publish-row {
            display: flex;
            justify-content: flex-end;
        }

        .publish-btn {
            min-width: 150px;
        }

        .posts-heading {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;

            margin: 28px 0 14px;
        }

        .posts-heading h2 {
            margin: 0;
            font-size: 20px;
        }

        .posts-count {
            padding: 6px 10px;

            border: 1px solid var(--border);
            border-radius: 999px;

            background: var(--surface);
            color: var(--text-soft);

            font-size: 12px;
            white-space: nowrap;
        }

        .post-card {
            margin-bottom: 14px;
            padding: 18px;

            border: 1px solid var(--border);
            border-radius: 20px;

            background: var(--surface);

            box-shadow: var(--shadow-sm);

            transition:
                transform .2s ease,
                box-shadow .2s ease;
        }

        .post-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .post-top {
            display: flex;
            align-items: center;
            gap: 11px;
            margin-bottom: 14px;
        }

        .post-avatar {
            width: 44px;
            height: 44px;
            display: grid;
            place-items: center;
            flex-shrink: 0;

            border-radius: 50%;
            background: var(--primary-light);
            color: var(--primary);

            font-weight: 800;
        }

        .post-user {
            color: var(--text);
            font-size: 14px;
            font-weight: 800;
        }

        .post-time {
            margin-top: 3px;
            color: var(--text-light);
            font-size: 11px;
        }

        .post-title {
            margin-bottom: 8px;
            color: var(--text);

            font-size: 17px;
            font-weight: 800;
            line-height: 1.5;
        }

        .post-content {
            color: var(--text-soft);
            font-size: 14px;
            line-height: 1.9;

            white-space: pre-wrap;
            word-break: break-word;
        }

        .post-actions {
            display: flex;
            align-items: center;
            gap: 8px;

            margin-top: 15px;
            padding-top: 13px;

            border-top: 1px solid var(--border);
        }

        .comment-toggle {
            padding: 9px 12px;

            border: 1px solid var(--border);
            border-radius: 11px;

            background: var(--surface);
            color: var(--text-soft);

            font-family: inherit;
            font-size: 12px;

            cursor: pointer;

            transition:
                border-color .2s ease,
                color .2s ease,
                background .2s ease;
        }

        .comment-toggle:hover {
            border-color: var(--primary);
            background: var(--primary-light);
            color: var(--primary);
        }

        .comments-area {
            display: none;

            margin-top: 14px;
            padding-top: 14px;

            border-top: 1px solid var(--border);
        }

        .comments-area.open {
            display: block;
        }

        .comments-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .comment {
            padding: 11px 12px;

            border-radius: 13px;

            background: var(--surface-muted);

            color: var(--text-soft);

            font-size: 13px;
            line-height: 1.7;

            display: inline-block;
            margin-bottom: 3px;
            color: var(--primary);
        }

        .comment-box {
            margin-top: 11px;
        }

        .comment-box textarea {
            width: 100%;
            box-sizing: border-box;

            min-height: 75px;
            padding: 11px;

            resize: vertical;

            border: 1px solid var(--border);
            border-radius: 12px;

            background: var(--surface);
            color: var(--text);

            font-family: inherit;
            font-size: 13px;

            outline: none;
        }

        .comment-box textarea::placeholder {
            color: var(--text-light);
        }

        .comment-box textarea:focus {
            border-color: var(--primary);
        }

            padding: 9px 13px;

            border-radius: 10px;

            background: var(--primary);
            color: #fff;

            font-family: inherit;
            font-size: 12px;

            border-radius: 20px;

/* =====================================================
   Language
===================================================== */

function getForumLanguage() {

    if (typeof getSiteLanguage === "function") {
        return getSiteLanguage();
    }

    return localStorage.getItem("site_language") || "ar";
}


function forumText(key) {

    const language =
        getForumLanguage();

    return (
        FORUM_TRANSLATIONS[language]?.[key] ||
        FORUM_TRANSLATIONS.ar?.[key] ||
        key
    );
}


function translateForumPage() {

    const language =
        getForumLanguage();

    document.documentElement.lang =
        language === "fr"
            ? "fr"
            : "ar";

    document.documentElement.dir =
        language === "fr"
            ? "ltr"
            : "rtl";


    document.title =
        language === "fr"
            ? "Forum | EduNova AI"
            : "المنتدى | EduNova AI";


    document
        .querySelectorAll("[data-forum-i18n]")
        .forEach(function(element) {

            const key =
                element.getAttribute(
                    "data-forum-i18n"
                );

            element.textContent =
                forumText(key);

        });


    document
        .querySelectorAll("[data-forum-placeholder]")
        .forEach(function(element) {

            const key =
                element.getAttribute(
                    "data-forum-placeholder"
                );

            element.placeholder =
                forumText(key);

        });


    renderPosts();

}

/* =====================================================
   Authentication
===================================================== */

async function checkAuth() {

    try {

        const {
            data: { session }
        } =
            await supabaseClient.auth.getSession();


        if (!session) {

            window.location.href =
                "login.html";

            return false;

        }


        currentUser =
            session.user;


        return true;

    } catch (error) {

        console.error(
            "Forum authentication error:",
            error
        );

        return false;

    }

}


function getDisplayName() {

    if (
        currentUser &&
        currentUser.user_metadata &&
        currentUser.user_metadata.full_name
    ) {

        return currentUser
            .user_metadata
            .full_name;

    }


    if (
        currentUser &&
        currentUser.email
    ) {

        return currentUser
            .email
            .split("@")[0];

    }


    return forumText(
        "default_student"
    );

}


function getInitial(name) {

    if (!name) {

        return forumText(
            "default_student"
        ).charAt(0);

    }

    return name.charAt(0);

}


/* =====================================================
   Local storage
===================================================== */

function getPosts() {

    const saved =
        localStorage.getItem(
            "forum_posts"
        );


    if (!saved) {
        return [];
    }


    try {

        const posts =
            JSON.parse(saved);

        return Array.isArray(posts)
            ? posts
            : [];

    } catch (error) {

        return [];

    }

}


function savePosts(posts) {

    localStorage.setItem(
        "forum_posts",
        JSON.stringify(posts)
    );

}

        getPosts();


    if (!posts.length) {

        return getLocalizedDefaultPosts();

    }


    return posts;

}


/* =====================================================
   Render
===================================================== */

function renderPosts() {

    const container =
        document.getElementById(
            "postsContainer"
        );

    const countElement =
        document.getElementById(
            "postsCount"
        );


    if (!container || !countElement) {
        return;
    }


    const posts =
        getPostsForDisplay();


    container.innerHTML =
        "";


    countElement.textContent =
        `${posts.length} ${forumText("posts_count")}`;


    if (!posts.length) {

        container.innerHTML = `

            <div class="empty-forum">

                <div
                    class="empty-forum-icon"
                    aria-hidden="true">
                </div>

                <h3>
                    ${escapeHTML(
                        forumText("no_posts")
                    )}
                </h3>

                <p>
                    ${escapeHTML(
                        forumText("first_post")
                    )}
                </p>

            </div>

        `;

        return;

    }


    posts
        .slice()
        .reverse()
        .forEach(function(post) {

            const article =
                document.createElement(
                    "article"
                );


            article.className =
                "post-card";


            const comments =
                Array.isArray(post.comments)
                    ? post.comments
                    : [];


            let commentsHTML =
                "";


            comments.forEach(
                function(comment) {

                    commentsHTML += `

                        <div class="comment">

                            <strong>
                                ${escapeHTML(
                                    comment.name ||
                                    forumText(
                                        "default_student"
                                    )
                                )}
                            </strong>

                            <br>

                            ${escapeHTML(
                                comment.text || ""
                            )}

                        </div>

                    `;

                }
            );


            article.innerHTML = `

                <div class="post-top">

                    <div class="post-avatar">

                        ${escapeHTML(
                            getInitial(post.name)
                        )}

                    </div>

                    <div>

                        <div class="post-user">

                            ${escapeHTML(
                                post.name ||
                                forumText(
                                    "default_student"
                                )
                            )}

                        </div>

                        <div class="post-time">

                            ${escapeHTML(
                                post.time || ""
                            )}

                        </div>

                    </div>

                </div>


                <div class="post-title">

                    ${escapeHTML(
                        post.title || ""
                    )}

                </div>


                <div class="post-content">

                    ${escapeHTML(
                        post.content || ""
                    )}

                </div>


                <div class="post-actions">

                    <button
                        type="button"
                        class="comment-toggle"
                        onclick="toggleComments(${post.id})">

                        ${escapeHTML(
                            forumText("comments")
                        )}

                        (${comments.length})

                    </button>

                </div>


                <div
                    class="comments-area"
                    id="comments-${post.id}">

                    <div class="comments-list">

                        ${commentsHTML}

                    </div>


                    <div class="comment-box">

                        <textarea
                            id="comment-input-${post.id}"
                            maxlength="1000"
                            placeholder="${escapeHTML(
                                forumText(
                                    "write_comment"
                                )
                            )}"></textarea>


                        <button
                            type="button"
                            class="comment-submit"
                            onclick="addComment(${post.id})">

                            ${escapeHTML(
                                forumText(
                                    "publish_comment"
                                )
                            )}

                        </button>

                    </div>

                </div>

            `;


            container.appendChild(
                article
            );

        });

}


/* =====================================================
   Create post
===================================================== */

function createPost() {

    const titleElement =
        document.getElementById(
            "postTitle"
        );

    const contentElement =
        document.getElementById(
            "postContent"
        );


    if (!titleElement || !contentElement) {
        return;
    }


    const title =
        titleElement.value.trim();

    const content =
        contentElement.value.trim();


    if (!title) {

        showMessage(
            forumText(
                "write_title_first"
            )
        );

        titleElement.focus();

        return;

    }


    if (!content) {

        showMessage(
            forumText(
                "write_content_first"
            )
        );

        contentElement.focus();

        return;

    }


    const existingPosts =
        getPosts();


    const newPost = {

        id:
            Date.now(),

        name:
            getDisplayName(),

        title:
            title,

        content:
            content,

        time:
            forumText("now"),

        comments:
            []

    };


    existingPosts.push(
        newPost
    );


    savePosts(
        existingPosts
    );


    titleElement.value =
        "";

    contentElement.value =
        "";


    renderPosts();


    showMessage(
        forumText(
            "post_published"
        )
    );

}


/* =====================================================
   Comments
===================================================== */

function toggleComments(postId) {

    const area =
        document.getElementById(
            "comments-" + postId
        );


    if (!area) {
        return;
    }


    area.classList.toggle(
        "open"
    );

}


function addComment(postId) {

    const input =
        document.getElementById(
            "comment-input-" + postId
        );


    if (!input) {
        return;
    }


    const text =
        input.value.trim();


    if (!text) {

        showMessage(
            forumText(
                "write_comment_first"
            )
        );

        input.focus();

        return;

    }


    const posts =
        getPosts();


    const post =
        posts.find(
            function(item) {

                return (
                    String(item.id) ===
                    String(postId)
                );

            }
        );


    if (!post) {
        return;
    }


    if (!Array.isArray(post.comments)) {
        post.comments = [];
    }


    post.comments.push({

        name:
            getDisplayName(),

        text:
            text

    });


    savePosts(
        posts
    );


    renderPosts();


    showMessage(
        forumText(
            "comment_published"
        )
    );

}


/* =====================================================
   Message
===================================================== */

function showMessage(message) {

    const old =
        document.querySelector(
            ".forum-message"
        );


    if (old) {
        old.remove();
    }


    const box =
        document.createElement(
            "div"
        );


    box.className =
        "forum-message";


    box.textContent =
        message;


    Object.assign(
        box.style,
        {

            position:
                "fixed",

            bottom:
                "25px",

            left:
                "50%",

            transform:
                "translateX(-50%)",

            background:
                "var(--text)",

            color:
                "var(--surface)",

            padding:
                "12px 18px",

            borderRadius:
                "12px",

            fontSize:
                "13px",

            zIndex:
                "9999",

            boxShadow:
                "0 8px 25px rgba(0,0,0,.18)",

            maxWidth:
                "90%",

            textAlign:
                "center"

        }
    );


    document.body.appendChild(
        box
    );


    setTimeout(
        function() {

            box.style.opacity =
                "0";

            box.style.transition =
                ".25s";


            setTimeout(
                function() {

                    box.remove();

                },
                250
            );

        },
        2200
    );

}


/* =====================================================
   Navigation
===================================================== */

function goDashboard() {

    if (typeof goTo === "function") {

        goTo(
            "dashboard.html"
        );

        return;

    }


    window.location.href =
        "dashboard.html";

}


/* =====================================================
   Global events
===================================================== */

window.addEventListener(
    "languageChanged",
    translateForumPage
);

window.addEventListener(
    "siteLanguageChanged",
    translateForumPage
);


window.addEventListener(
    "themeChanged",
    function() {

        if (
            typeof applySiteTheme ===
            "function"
        ) {

            applySiteTheme(
                typeof getSiteTheme ===
                "function"
                    ? getSiteTheme()
                    : "light"
            );

        }

    }
);


window.addEventListener(
    "siteThemeChanged",
    function() {

        if (
            typeof applySiteTheme ===
            "function"
        ) {

            applySiteTheme(
                typeof getSiteTheme ===
                "function"
                    ? getSiteTheme()
                    : "light"
            );

        }

    }
);


window.addEventListener(
    "storage",
    function(event) {

        if (
            event.key ===
            "site_language"
        ) {

            translateForumPage();

        }


        if (
            event.key ===
            "site_theme"
        ) {

            if (
                typeof applySiteTheme ===
                "function"
            ) {

                applySiteTheme(
                    event.newValue ||
                    "light"
                );

            }

        }

    }
);


/* =====================================================
   Start
===================================================== */

async function startForumPage() {

    if (
        typeof initializeGlobalSettings ===
        "function"
    ) {

        initializeGlobalSettings();

    }


    if (
        typeof applySiteTheme ===
        "function"
    ) {

        applySiteTheme(
            typeof getSiteTheme ===
            "function"
                ? getSiteTheme()
                : "light"
        );

    }


    if (
        typeof applySiteLanguage ===
        "function"
    ) {

        applySiteLanguage(
            getForumLanguage()
        );

    }


    translateForumPage();


    const authenticated =
        await checkAuth();


    if (!authenticated) {
        return;
    }


    renderPosts();

}


document.addEventListener(
    "DOMContentLoaded",
    startForumPage
);

</script>
