<!DOCTYPE html><html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>المنتدى | عالم شيخ الأساتذة</title>  <link rel="stylesheet" href="style.css">  <style>
    /* =========================================
       Forum Page
       ========================================= */

    .forum-hero {
      background:
        linear-gradient(135deg, #2563eb, #1d4ed8);
      color: white;
      border-radius: 24px;
      padding: 28px 22px;
      margin-bottom: 20px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 12px 30px rgba(37, 99, 235, 0.18);
    }

    .forum-hero::after {
      content: "";
      position: absolute;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: rgba(255,255,255,0.08);
      left: -70px;
      top: -70px;
    }

    .forum-hero-content {
      position: relative;
      z-index: 1;
    }

    .forum-hero .eyebrow {
      font-size: 13px;
      font-weight: 700;
      opacity: .85;
      margin-bottom: 8px;
    }

    .forum-hero h1 {
      margin: 0 0 10px;
      font-size: 26px;
    }

    .forum-hero p {
      margin: 0;
      line-height: 1.8;
      font-size: 14px;
      opacity: .92;
      max-width: 650px;
    }

    .write-card {
      margin-bottom: 22px;
    }

    .write-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .write-icon {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: var(--primary-light);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 21px;
      flex-shrink: 0;
    }

    .write-header h2 {
      margin: 0;
      font-size: 18px;
    }

    .write-header p {
      margin: 4px 0 0;
      color: var(--text-soft);
      font-size: 12px;
    }

    .forum-input,
    .forum-textarea {
      width: 100%;
      border: 1px solid var(--border);
      background: #f8fafc;
      color: var(--text);
      border-radius: 14px;
      padding: 13px 14px;
      font-family: inherit;
      font-size: 14px;
      outline: none;
      transition: .2s;
      margin-bottom: 10px;
    }

    .forum-input:focus,
    .forum-textarea:focus {
      border-color: var(--primary);
      background: white;
      box-shadow: 0 0 0 4px rgba(37,99,235,.08);
    }

    .forum-textarea {
      min-height: 115px;
      resize: vertical;
      line-height: 1.7;
    }

    .publish-row {
      display: flex;
      justify-content: flex-end;
    }

    .publish-btn {
      min-width: 150px;
    }

    .posts-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 25px 0 14px;
    }

    .posts-heading h2 {
      margin: 0;
      font-size: 20px;
    }

    .posts-count {
      font-size: 12px;
      color: var(--text-soft);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 10px;
    }

    .post-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 18px;
      margin-bottom: 14px;
      box-shadow: var(--shadow-sm);
      transition: transform .2s, box-shadow .2s;
    }

    .post-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    .post-top {
      display: flex;
      align-items: center;
      gap: 11px;
      margin-bottom: 14px;
    }

    .post-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--primary-light);
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      flex-shrink: 0;
    }

    .post-user {
      font-size: 14px;
      font-weight: 800;
      color: var(--text);
    }

    .post-time {
      font-size: 11px;
      color: var(--text-light);
      margin-top: 3px;
    }

    .post-title {
      font-size: 17px;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 8px;
      line-height: 1.5;
    }

    .post-content {
      color: var(--text-soft);
      line-height: 1.9;
      font-size: 14px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .post-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 15px;
      padding-top: 13px;
      border-top: 1px solid #eef2f7;
    }

    .comment-toggle {
      border: 1px solid var(--border);
      background: #f8fafc;
      color: var(--text-soft);
      border-radius: 11px;
      padding: 9px 12px;
      font-family: inherit;
      font-size: 12px;
      cursor: pointer;
      transition: .2s;
    }

    .comment-toggle:hover {
      border-color: var(--primary);
      color: var(--primary);
      background: var(--primary-light);
    }

    .comments-area {
      display: none;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }

    .comments-area.open {
      display: block;
    }

    .comments-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .comment {
      background: #f8fafc;
      border-radius: 13px;
      padding: 11px 12px;
      line-height: 1.7;
      font-size: 13px;
      color: var(--text-soft);
    }

    .comment strong {
      color: var(--primary);
      display: inline-block;
      margin-bottom: 3px;
    }

    .comment-box {
      margin-top: 11px;
    }

    .comment-box textarea {
      width: 100%;
      min-height: 75px;
      resize: vertical;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 11px;
      font-family: inherit;
      outline: none;
      background: white;
      font-size: 13px;
    }

    .comment-box textarea:focus {
      border-color: var(--primary);
    }

    .comment-submit {
      margin-top: 7px;
      border: none;
      background: var(--primary);
      color: white;
      border-radius: 10px;
      padding: 9px 13px;
      font-family: inherit;
      font-size: 12px;
      cursor: pointer;
    }

    .empty-forum {
      text-align: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 35px 20px;
    }

    .empty-forum-icon {
      font-size: 42px;
      margin-bottom: 10px;
    }

    .empty-forum h3 {
      margin: 0 0 6px;
      font-size: 17px;
    }

    .empty-forum p {
      margin: 0;
      color: var(--text-soft);
      font-size: 13px;
    }

    .bottom-action {
      margin-top: 25px;
      margin-bottom: 20px;
    }

    @media (max-width: 600px) {

      .forum-hero {
        border-radius: 20px;
        padding: 23px 18px;
      }

      .forum-hero h1 {
        font-size: 22px;
      }

      .write-header h2 {
        font-size: 17px;
      }

      .publish-row {
        display: block;
      }

      .publish-btn {
        width: 100%;
      }

      .post-card {
        padding: 15px;
        border-radius: 17px;
      }

      .post-title {
        font-size: 16px;
      }

      .posts-heading h2 {
        font-size: 18px;
      }

    }
  </style></head><body>  <!-- Header -->  <header class="site-header">
    <div class="container header-inner">  <a href="dashboard.html" class="brand">

  </button>

</div>

  </header>  <main class="page"><div class="container">

  <!-- Hero -->
  <section class="forum-hero">

    <div class="forum-hero-content">

      <div class="eyebrow">
        مجتمع الطلاب 💬
      </div>

      <h1>
        المنتدى الطلابي
      </h1>

      <p>
        اسأل، ناقش، شارك حلولك واستفد من تجارب بقية الطلاب.
        هذا المكان مخصص للتعلم والتعاون.
      </p>

    </div>

  </section>


  <!-- New post -->
  <section class="card write-card">

    <div class="write-header">

      <div class="write-icon">
        ✍️
      </div>

      <div>
        <h2>
          اكتب منشورًا جديدًا
        </h2>

        <p>
          شارك سؤالًا أو فكرة أو حلًا مفيدًا

      </div>

    </div>


    <input
      id="postTitle"

    <textarea
      id="postContent"

    <div class="publish-row">

      <button
        id="publishBtn"

  <!-- Posts heading -->
  <div class="posts-heading">

  </div>

  <!-- Back -->
  <div class="bottom-action">

  </nav>  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>  <script>

    const SUPABASE_URL =
      "https://qkzdlxqledsznhbifaxy.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_ZdpHXwLlhpbXztsTXpAFTg_TgOji91v";

    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    let currentUser = null;


    /* =========================================
       Default posts
       ========================================= */

    const defaultPosts = [

      {
        id: 1,
        name: "طالب الرياضيات",
        title: "كيف أفهم هذا التمرين؟",
        content:
          "هل يمكن لأحد أن يساعدني في فهم طريقة حل التمرين؟ أريد أن أفهم الخطوات وليس الجواب فقط.",
        time: "اليوم",
        comments: [
          {
            name: "طالب مجتهد",
            text:
              "حاول تقسيم المسألة إلى خطوات صغيرة وستجد أن الحل يصبح أسهل."
          }
        ]
      },

      {
        id: 2,
        name: "محب الرياضيات",
        title: "مشاركة حل",
        content:
          "وجدت طريقة مختلفة لحل أحد التمارين، وسأشاركها معكم للاستفادة والنقاش.",
        time: "أمس",
        comments: []
      }

    ];


    /* =========================================
       Authentication
       ========================================= */

    async function checkAuth() {

      const {
        data: { session }
      } = await supabaseClient.auth.getSession();


      if (!session) {

        window.location.href = "login.html";

        return false;
      }


      currentUser = session.user;

      return true;

    }


    function getDisplayName() {

      if (
        currentUser &&
        currentUser.user_metadata &&
        currentUser.user_metadata.full_name
      ) {

        return currentUser.user_metadata.full_name;

      }


      if (
        currentUser &&
        currentUser.email
      ) {

        return currentUser.email.split("@")[0];

      }


      return "طالب";

    }


    function getInitial(name) {

      if (!name) {
        return "ط";
      }

      return name.charAt(0);

    }


    /* =========================================
       Local forum storage
       ========================================= */

    function getPosts() {

      const saved =
        localStorage.getItem("forum_posts");


      if (saved) {

        try {

          return JSON.parse(saved);

        } catch (error) {

          return defaultPosts;

        }

      }


      return defaultPosts;

    }


    function savePosts(posts) {

      localStorage.setItem(
        "forum_posts",
        JSON.stringify(posts)
      );

    }


    /* =========================================
       Render posts
       ========================================= */

    function renderPosts() {

      const container =
        document.getElementById("postsContainer");

      const countElement =
        document.getElementById("postsCount");

      const posts = getPosts();


      container.innerHTML = "";


      countElement.textContent =
        `${posts.length} منشور`;


      if (!posts.length) {

        container.innerHTML = `

          <div class="empty-forum">

            <div class="empty-forum-icon">
              💬
            </div>

            <h3>
              لا توجد منشورات بعد
            </h3>

            <p>
              كن أول طالب يبدأ النقاش!
            </p>

          </div>

        `;

        return;
      }


      posts
        .slice()
        .reverse()
        .forEach(function(post) {

          const article =
            document.createElement("article");

          article.className = "post-card";


          const comments =
            post.comments || [];


          let commentsHTML = "";


          comments.forEach(function(comment) {

            commentsHTML += `

              <div class="comment">

                <strong>
                  ${escapeHTML(comment.name)}
                </strong>

                <br>

                ${escapeHTML(comment.text)}

              </div>

            `;

          });


          article.innerHTML = `

            <div class="post-top">

              <div class="post-avatar">
                ${escapeHTML(getInitial(post.name))}
              </div>

              <div>

                <div class="post-user">
                  ${escapeHTML(post.name)}
                </div>

                <div class="post-time">
                  ${escapeHTML(post.time)}
                </div>

              </div>

            </div>


            <div class="post-title">
              ${escapeHTML(post.title)}
            </div>


            <div class="post-content">
              ${escapeHTML(post.content)}
            </div>


            <div class="post-actions">

              <button
                class="comment-toggle"
                onclick="toggleComments(${post.id})">

                💬 التعليقات (${comments.length})

              </button>

            </div>


            <div
              class="comments-area"
              id="comments-${post.id}">

              <div class="comments-list">

                ${commentsHTML}

              </div>


              <div class="comment-box">

                <textarea
                  id="comment-input-${post.id}"
                  maxlength="1000"
                  placeholder="اكتب تعليقك..."></textarea>            <button
              class="comment-submit"
              onclick="addComment(${post.id})">

              نشر التعليق

            </button>

          </div>

        </div>

      `;


      container.appendChild(article);

    });

}


/* =========================================
   Create post
   ========================================= */

function createPost() {

  const title =
    document.getElementById("postTitle")
      .value
      .trim();


  const content =
    document.getElementById("postContent")
      .value
      .trim();


  if (!title) {

    showMessage(
      "اكتب عنوان المنشور أولًا."
    );

    return;
  }


  if (!content) {

    showMessage(
      "اكتب محتوى المنشور أولًا."
    );

    return;
  }


  const posts = getPosts();


  const newPost = {

    id: Date.now(),

    name: getDisplayName(),

    title: title,

    content: content,

    time: "الآن",

    comments: []

  };


  posts.push(newPost);

  savePosts(posts);


  document.getElementById("postTitle").value = "";

  document.getElementById("postContent").value = "";


  renderPosts();


  showMessage(
    "تم نشر منشورك بنجاح ✓"
  );

}


/* =========================================
   Comments
   ========================================= */

function toggleComments(postId) {

  const area =
    document.getElementById(
      "comments-" + postId
    );


  if (!area) {
    return;
  }


  area.classList.toggle("open");

}


function addComment(postId) {

  const input =
    document.getElementById(
      "comment-input-" + postId
    );


  if (!input) {
    return;
  }


  const text =
    input.value.trim();


  if (!text) {

    showMessage(
      "اكتب التعليق أولًا."
    );

    return;
  }


  const posts = getPosts();


  const post =
    posts.find(function(item) {

      return item.id === postId;

    });


  if (!post) {
    return;
  }


  if (!post.comments) {
    post.comments = [];
  }


  post.comments.push({

    name: getDisplayName(),

    text: text

  });


  savePosts(posts);

  renderPosts();


  showMessage(
    "تم نشر تعليقك ✓"
  );

}


/* =========================================
   Safe HTML
   ========================================= */

function escapeHTML(value) {

  return String(value)

    .replace(/&/g, "&amp;")

    .replace(/</g, "&lt;")

    .replace(/>/g, "&gt;")

    .replace(/"/g, "&quot;")

    .replace(/'/g, "&#039;");

}


/* =========================================
   Message
   ========================================= */

function showMessage(message) {

  const old =
    document.querySelector(".forum-message");

  if (old) {
    old.remove();
  }


  const box =
    document.createElement("div");

  box.className = "forum-message";


  box.textContent = message;


  Object.assign(box.style, {

    position: "fixed",
    bottom: "85px",
    left: "50%",
    transform: "translateX(-50%)",
    background: "#172033",
    color: "white",
    padding: "12px 18px",
    borderRadius: "12px",
    fontSize: "13px",
    zIndex: "9999",
    boxShadow: "0 8px 25px rgba(0,0,0,.18)",
    maxWidth: "90%",
    textAlign: "center"

  });


  document.body.appendChild(box);


  setTimeout(function() {

    box.style.opacity = "0";
    box.style.transition = ".25s";

    setTimeout(function() {

      box.remove();

    }, 250);

  }, 2200);

}


/* =========================================
   Navigation
   ========================================= */

function goDashboard() {

  window.location.href =
    "dashboard.html";

}


/* =========================================
   Start
   ========================================= */

async function startPage() {

  const authenticated =
    await checkAuth();


  if (!authenticated) {
    return;
  }


  renderPosts();

}


startPage();

  </script></body>
