<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>حسابي | EduNova AI</title>

    <link
        rel="stylesheet"
        href="style.css">

    <style>

        /* =========================================================
           ACCOUNT PAGE
           EduNova AI
           Clean • Minimal • Responsive
           ========================================================= */

        .account-page-header {
            margin-bottom: 18px;
        }

        .account-page-header .container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .account-page-brand {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            text-decoration: none;
            color: var(--text);
            font-weight: 900;
            font-size: 16px;
        }

        .account-page-brand-icon {
            width: 35px;
            height: 35px;
            border-radius: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--text);
            color: var(--surface);
            font-size: 11px;
            font-weight: 900;
            letter-spacing: -.5px;
        }

        .account-dashboard-button {
            min-height: 38px;
            padding: 7px 12px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text);
            border-radius: 12px;
            font-family: inherit;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
            transition: .2s;
        }

        .account-dashboard-button:hover {
            border-color: var(--primary);
            color: var(--primary);
        }


        /* =========================================================
           HERO
           ========================================================= */

        .account-hero {
            background: var(--primary);
            color: white;
            border-radius: 22px;
            padding: 23px 19px;
            margin-bottom: 18px;
            position: relative;
            overflow: hidden;
            box-shadow: var(--shadow-sm);
        }

        .account-hero::after {
            content: "";
            position: absolute;
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: rgba(255,255,255,.08);
            left: -70px;
            top: -70px;
        }

        .account-hero-content {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .avatar {
            width: 63px;
            height: 63px;
            border-radius: 19px;
            background: rgba(255,255,255,.14);
            border: 1px solid rgba(255,255,255,.30);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: 900;
            flex-shrink: 0;
        }

        .account-name {
            margin: 0;
            font-size: 21px;
            line-height: 1.3;
        }

        .account-email {
            margin: 5px 0 0;
            opacity: .86;
            font-size: 12px;
            direction: ltr;
            text-align: right;
            overflow-wrap: anywhere;
        }

        .level-pill {
            display: inline-block;
            margin-top: 8px;
            padding: 5px 10px;
            border-radius: 999px;
            background: rgba(255,255,255,.13);
            font-size: 11px;
            font-weight: 700;
        }


        /* =========================================================
           SECTIONS
           ========================================================= */

        .section-heading {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin: 22px 2px 11px;
        }

        .section-heading h2 {
            margin: 0;
            font-size: 18px;
            color: var(--text);
        }

        .section-heading span {
            color: var(--text-soft);
            font-size: 11px;
        }


        /* =========================================================
           STATS
           ========================================================= */

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .stat-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 17px;
            padding: 15px 10px;
            text-align: center;
            box-shadow: var(--shadow-sm);
        }

        .stat-icon {
            font-size: 20px;
            margin-bottom: 5px;

            /* monochrome */
            filter: grayscale(1);
            -webkit-filter: grayscale(1);
        }

        .stat-number {
            display: block;
            color: var(--primary);
            font-size: 20px;
            font-weight: 900;
        }

        .stat-label {
            color: var(--text-soft);
            font-size: 10px;
        }


        /* =========================================================
           ACCOUNT INFORMATION
           ========================================================= */

        .account-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 18px;
            overflow: hidden;
            box-shadow: var(--shadow-sm);
        }

        .account-row {
            min-height: 59px;
            padding: 12px 14px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 11px;
        }

        .account-row:last-child {
            border-bottom: none;
        }

        .row-icon {
            width: 37px;
            height: 37px;
            border-radius: 11px;
            background: var(--primary-light);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;

            filter: grayscale(1);
            -webkit-filter: grayscale(1);
        }

        .row-text {
            flex: 1;
            min-width: 0;
        }

        .row-label {
            color: var(--text-soft);
            font-size: 10px;
            margin-bottom: 3px;
        }

        .row-value {
            font-size: 13px;
            font-weight: 800;
            color: var(--text);
            overflow-wrap: anywhere;
        }


        /* =========================================================
           ACTIONS
           ========================================================= */

        .account-actions {
            display: grid;
            gap: 9px;
        }

        .account-action {
            width: 100%;
            min-height: 52px;
            border: 1px solid var(--border);
            background: var(--surface);
            border-radius: 15px;
            padding: 10px 12px;
            display: flex;
            align-items: center;
            gap: 11px;
            font-family: inherit;
            font-size: 12px;
            font-weight: 800;
            color: var(--text);
            cursor: pointer;
            text-align: right;
            transition: .2s;
        }

        html[dir="ltr"] .account-action {
            text-align: left;
        }

        .account-action:hover {
            border-color: var(--primary);
            color: var(--primary);
            transform: translateY(-1px);
        }

        .action-icon {
            width: 35px;
            height: 35px;
            border-radius: 10px;
            background: var(--background);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 16px;

            filter: grayscale(1);
            -webkit-filter: grayscale(1);
        }

        .action-arrow {
            margin-right: auto;
            color: var(--text-light);
            font-size: 18px;
        }

        html[dir="ltr"] .action-arrow {
            margin-right: 0;
            margin-left: auto;
        }

        .logout-action {
            color: var(--danger);
            background: var(--surface);
            border-color: var(--border);
        }

        .logout-action .action-icon {
            background: var(--background);
        }

        .logout-action:hover {
            color: var(--danger);
            border-color: var(--danger);
        }

        .danger-action {
            color: var(--danger);
        }


        /* =========================================================
           LOADING
           ========================================================= */

        .loading-account {
            text-align: center;
            padding: 70px 20px;
            color: var(--text-soft);
        }

        .loading-icon {
            font-size: 30px;
            margin-bottom: 10px;

            filter: grayscale(1);
            -webkit-filter: grayscale(1);
        }


        /* =========================================================
           MESSAGE
           ========================================================= */

        .account-message {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            background: var(--text);
            color: var(--surface);
            padding: 11px 16px;
            border-radius: 12px;
            font-size: 12px;
            max-width: 90%;
            text-align: center;
            box-shadow: var(--shadow);
            transition: .25s;
        }

        .bottom-space {
            height: 15px;
        }


        /* =========================================================
           HIDDEN NAVIGATION
           ========================================================= */

        .bottom-nav {
            display: none !important;
            visibility: hidden !important;
            pointer-events: none !important;
        }


        /* =========================================================
           RESPONSIVE
           ========================================================= */

        @media (min-width: 650px) {

            .stats-grid {
                grid-template-columns: repeat(4, 1fr);
            }

            .account-actions {
                grid-template-columns: repeat(2, 1fr);
            }

        }


        @media (max-width: 600px) {

            .account-page-header {
                margin-bottom: 15px;
            }

            .account-page-brand {
                font-size: 14px;
            }

            .account-page-brand-icon {
                width: 33px;
                height: 33px;
            }

            .account-dashboard-button {
                min-height: 36px;
                padding: 6px 10px;
                font-size: 11px;
            }

            .account-hero {
                border-radius: 19px;
                padding: 20px 15px;
            }

            .account-hero-content {
                gap: 11px;
            }

            .avatar {
                width: 57px;
                height: 57px;
                border-radius: 17px;
                font-size: 22px;
            }

            .account-name {
                font-size: 18px;
            }

            .account-email {
                font-size: 11px;
            }

            .stats-grid {
                gap: 8px;
            }

            .stat-card {
                padding: 13px 8px;
                border-radius: 15px;
            }

            .account-row {
                padding: 11px 12px;
            }

            .account-action {
                min-height: 50px;
            }

        }


        @media (max-width: 360px) {

            .account-page-brand span:last-child {
                display: none;
            }

            .account-name {
                font-size: 17px;
            }

            .stats-grid {
                gap: 7px;
            }

            .stat-card {
                padding: 12px 5px;
            }

        }

    </style>

</head>

    function getAccountLanguage() {

        if (
            typeof getSiteLanguage ===
            "function"
        ) {

        }

        return (
            localStorage.getItem(
                "site_language"
            ) || "ar"

    function accountText(key) {

        const language =
            getAccountLanguage();

        return (
            ACCOUNT_TRANSLATIONS[language]?.[key] ||
            ACCOUNT_TRANSLATIONS.ar[key] ||
            key

            );

        }

        const value =
            String(level)
                .trim()
                .toLowerCase();

        const levels = {

            "كونكور":
                "Concours",

            "كونكور":
                "Concours",

            "conconcours":
                "Concours",

            "concours":
                "Concours",

            "بريفيه":
                "Brevet",

            "بريفي":
                "Brevet",

            "brevet":
                "Brevet",

            "باكالوريا":
                "Baccalauréat",

            "baccalaureat":
                "Baccalauréat",

            "baccalauréat":
                "Baccalauréat"

        };

        if (
            getAccountLanguage() === "fr" &&
            levels[value]
        ) {

            return levels[value];

        }

        return level;

    }


    /* =========================================================
       APPLY LANGUAGE
    ========================================================= */

    function translateAccountPage() {

        const language =
            getAccountLanguage();

        document.documentElement.lang =
            language;

        document.documentElement.dir =
            language === "fr"
                ? "ltr"
                : "rtl";

        document.title =
            accountText("pageTitle");


        const elements = {

            dashboardButton: "dashboard",
            loadingText: "loading",
            achievementsTitle: "achievements",
            progressText: "progress",
            pointsLabel: "points",
            lessonsLabel: "lessons",
            badgesLabel: "badges",
            streakLabel: "streak",
            accountInfoTitle: "accountInfo",
            nameLabel: "name",
            emailLabel: "email",
            levelLabel: "level",
            accountManagementTitle: "accountManagement",
            changeLevelText: "changeLevel",
            settingsText: "settings",
            editDataText: "editData",
            passwordText: "password",
            paymentsText: "payments",
            deleteText: "delete",
            logoutText: "logout",
            navHome: "navHome",
            navLibrary: "navLibrary",
            navForum: "navForum",
            navAccount: "navAccount"

        };


        Object.keys(elements).forEach(
            function(id) {

                const element =
                    document.getElementById(id);

                if (element) {

                    element.textContent =
                        accountText(
                            elements[id]
                        );

                }

            }
        );


        const storedLevel =
            localStorage.getItem(
                "student_level"
            );

        if (storedLevel) {

            const translated =
                translateLevel(
                    storedLevel
                );

            const studentLevel =
                document.getElementById(
                    "studentLevel"
                );

            const infoLevel =
                document.getElementById(
                    "infoLevel"
                );

            if (studentLevel) {

                studentLevel.textContent =
                    translated;

            }

            if (infoLevel) {

                infoLevel.textContent =
                    translated;

            }

        }


        if (
            typeof updateThemeControls ===
            "function"
        ) {

            updateThemeControls();

        }

    }


    /* =========================================================
       THEME
    ========================================================= */

    function applyAccountTheme() {

        if (
            typeof getSiteTheme ===
            "function" &&
            typeof applySiteTheme ===
            "function"
        ) {

            applySiteTheme(
                getSiteTheme()
            );

        }

    }


    /* =========================================================
       LOAD ACCOUNT
    ========================================================= */

    async function loadAccount() {

        try {

            const {
                data,
                error
            } =
                await supabaseClient.auth.getSession();


            if (
                error ||
                !data.session
            ) {

                window.location.href =
                    "login.html";

                return;

            }


            const user =
                data.session.user;


            let name =
                user.user_metadata?.full_name ||
                user.user_metadata?.name ||
                user.user_metadata?.display_name;


            if (!name) {

                name =
                    user.email
                        ? user.email.split("@")[0]
                        : accountText(
                            "defaultStudent"
                        );

            }


            const email =
                user.email || "-";


            const level =
                localStorage.getItem(
                    "student_level"
                ) ||
                accountText(
                    "noLevel"
                );


            /* PROFILE */

            document.getElementById(
                "studentName"
            ).textContent =
                name;


            document.getElementById(
                "studentEmail"
            ).textContent =
                email;


            document.getElementById(
                "studentLevel"
            ).textContent =
                translateLevel(level);


            document.getElementById(
                "infoName"
            ).textContent =
                name;


            document.getElementById(
                "infoEmail"
            ).textContent =
                email;


            document.getElementById(
                "infoLevel"
            ).textContent =
                translateLevel(level);


            /* AVATAR */

            const firstLetter =
                name
                    .trim()
                    .charAt(0);


            document.getElementById(
                "avatar"
            ).textContent =
                firstLetter ||
                (
                    getAccountLanguage() === "fr"
                        ? "É"
                        : "ط"
                );


            /* STATISTICS */

            const points =
                parseInt(
                    localStorage.getItem(
                        "student_points"
                    ) || "0",
                    10
                );


            const lessons =
                parseInt(
                    localStorage.getItem(
                        "completed_lessons"
                    ) || "0",
                    10
                );


            const badges =
                points >= 50
                    ? 1
                    : 0;


            const streak =
                lessons > 0
                    ? 1
                    : 0;


            document.getElementById(
                "points"
            ).textContent =
                points;


            document.getElementById(
                "lessons"
            ).textContent =
                lessons;


            document.getElementById(
                "badges"
            ).textContent =
                badges;


            document.getElementById(
                "streak"
            ).textContent =
                streak;


            /* SHOW */

            document.getElementById(
                "loading"
            ).style.display =
                "none";


            document.getElementById(
                "accountContent"
            ).style.display =
                "block";

        }

        catch (error) {

            console.error(
                "Account loading error:",
                error
            );

            showMessage(
                getAccountLanguage() === "fr"
                    ? "Impossible de charger le compte."
                    : "تعذر تحميل الحساب."
            );

        }

    }


    /* =========================================================
       NAVIGATION
    ========================================================= */

    function goDashboard() {

        window.location.href =
            "dashboard.html";

    }


    function changeLevel() {

        window.location.href =
            "levels.html";

    }


    function openSettings() {

        window.location.href =
            "settings.html";

    }


    /* =========================================================
       MESSAGE
    ========================================================= */

    function showMessage(type) {

        const messages = {

            editData:
                accountText(
                    "editDataMessage"
                ),

            password:
                accountText(
                    "passwordMessage"
                ),

            payments:
                accountText(
                    "paymentsMessage"
                ),

            delete:
                accountText(
                    "deleteMessage"
                )

        };


        const message =
            messages[type] ||
            type;


        const old =
            document.querySelector(
                ".account-message"
            );


        if (old) {

            old.remove();

        }


        const box =
            document.createElement(
                "div"
            );


        box.className =
            "account-message";


        box.textContent =
            message;


        document.body.appendChild(
            box
        );


        setTimeout(
            function() {

                box.style.opacity =
                    "0";


                setTimeout(
                    function() {

                        box.remove();

                    },
                    250
                );

            },
            2300
        );

    }


    /* =========================================================
       LOGOUT
    ========================================================= */

    async function logout() {

        const confirmed =
            window.confirm(
                accountText(
                    "logoutConfirm"
                )
            );


        if (!confirmed) {

            return;

        }


        const {
            error
        } =
            await supabaseClient.auth.signOut();


        if (error) {

            showMessage(
                accountText(
                    "logoutError"
                )
            );

            return;

        }


        /*
           نحذف المستوى فقط.
           إعدادات اللغة والوضع تبقى محفوظة.
        */

        localStorage.removeItem(
            "student_level"
        );


        window.location.href =
            "login.html";

    }


    /* =========================================================
       GLOBAL LANGUAGE EVENTS
    ========================================================= */

    window.addEventListener(
        "languageChanged",
        function() {

            translateAccountPage();

        }
    );


    window.addEventListener(
        "siteLanguageChanged",
        function() {

            translateAccountPage();

        }
    );


    window.addEventListener(
        "languagechange",
        function() {

            translateAccountPage();

        }
    );


    /* =========================================================
       GLOBAL THEME EVENTS
    ========================================================= */

    window.addEventListener(
        "themeChanged",
        function() {

            applyAccountTheme();

        }
    );


    window.addEventListener(
        "siteThemeChanged",
        function() {

            applyAccountTheme();

        }
    );


    /* =========================================================
       STORAGE SYNC
    ========================================================= */

    window.addEventListener(
        "storage",
        function(event) {

            if (
                event.key ===
                "site_language"
            ) {

                translateAccountPage();

            }


            if (
                event.key ===
                "site_theme"
            ) {

                applyAccountTheme();

            }


            if (
                event.key ===
                "student_level"
            ) {

                translateAccountPage();

            }

        }
    );


    /* =========================================================
       START
    ========================================================= */

    document.addEventListener(
        "DOMContentLoaded",
        function() {

            if (
                typeof initializeGlobalSettings ===
                "function"
            ) {

                initializeGlobalSettings();

            }


            applyAccountTheme();

            translateAccountPage();

            loadAccount();

        }
    );

</script>
