<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>حسابي | EduNova AI</title>

    <link rel="stylesheet" href="style.css">

    <style>

        .account-hero {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            border-radius: 24px;
            padding: 25px 20px;
            margin-bottom: 18px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 12px 30px rgba(37, 99, 235, .18);
        }

        .account-hero::after {
            content: "";
            position: absolute;
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: rgba(255,255,255,.08);
            left: -70px;
            top: -70px;
        }

        .account-hero-content {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .avatar {
            width: 68px;
            height: 68px;
            border-radius: 21px;
            background: rgba(255,255,255,.18);
            border: 2px solid rgba(255,255,255,.35);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 27px;
            font-weight: 900;
            flex-shrink: 0;
        }

        .account-name {
            margin: 0;
            font-size: 22px;
        }

        .account-email {
            margin: 5px 0 0;
            opacity: .85;
            font-size: 12px;
            direction: ltr;
            text-align: right;
        }

        .level-pill {
            display: inline-block;
            margin-top: 8px;
            padding: 5px 10px;
            border-radius: 999px;
            background: rgba(255,255,255,.15);
            font-size: 11px;
            font-weight: 700;
        }

        .section-heading {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 24px 2px 12px;
        }

        .section-heading h2 {
            margin: 0;
            font-size: 19px;
        }

        .section-heading span {
            color: var(--text-soft);
            font-size: 12px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 11px;
        }

        .stat-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 16px;
            text-align: center;
            box-shadow: var(--shadow-sm);
        }

        .stat-icon {
            font-size: 23px;
            margin-bottom: 5px;
        }

        .stat-number {
            display: block;
            color: var(--primary);
            font-size: 21px;
            font-weight: 900;
        }

        .stat-label {
            color: var(--text-soft);
            font-size: 11px;
        }

        .account-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 19px;
            overflow: hidden;
            box-shadow: var(--shadow-sm);
        }

        .account-row {
            min-height: 61px;
            padding: 13px 15px;
            border-bottom: 1px solid #eef2f7;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .account-row:last-child {
            border-bottom: none;
        }

        .row-icon {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            background: var(--primary-light);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .row-text {
            flex: 1;
            min-width: 0;
        }

        .row-label {
            color: var(--text-soft);
            font-size: 11px;
            margin-bottom: 3px;
        }

        .row-value {
            font-size: 14px;
            font-weight: 800;
            color: var(--text);
            overflow-wrap: anywhere;
        }

        .account-actions {
            display: grid;
            gap: 10px;
        }

        .account-action {
            width: 100%;
            min-height: 54px;
            border: 1px solid var(--border);
            background: var(--surface);
            border-radius: 15px;
            padding: 12px 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-family: inherit;
            font-size: 13px;
            font-weight: 700;
            color: var(--text);
            cursor: pointer;
            text-align: right;
            transition: .2s;
        }

        .account-action:hover {
            border-color: var(--primary);
            color: var(--primary);
            transform: translateY(-1px);
        }

        .action-icon {
            width: 36px;
            height: 36px;
            border-radius: 11px;
            background: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 17px;
        }

        .action-arrow {
            margin-right: auto;
            color: var(--text-light);
            font-size: 18px;
        }

        .logout-action {
            color: var(--danger);
            background: #fff7f7;
            border-color: #fecaca;
        }

        .logout-action .action-icon {
            background: #fee2e2;
        }

        .logout-action:hover {
            color: var(--danger);
            border-color: var(--danger);
        }

        .danger-action {
            color: var(--danger);
        }

        .loading-account {
            text-align: center;
            padding: 70px 20px;
            color: var(--text-soft);
        }

        .loading-icon {
            font-size: 34px;
            margin-bottom: 10px;
        }

        .account-message {
            position: fixed;
            bottom: 84px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            background: #172033;
            color: white;
            padding: 12px 18px;
            border-radius: 12px;
            font-size: 13px;
            max-width: 90%;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0,0,0,.18);
            transition: .25s;
        }

        .bottom-space {
            height: 15px;
        }

        @media (min-width: 650px) {

            .stats-grid {
                grid-template-columns: repeat(4, 1fr);
            }

            .account-actions {
                grid-template-columns: repeat(2, 1fr);
            }

        }

        @media (max-width: 600px) {

            .account-hero {
                border-radius: 20px;
                padding: 21px 16px;
            }

            .account-hero-content {
                gap: 12px;
            }

            .avatar {
                width: 59px;
                height: 59px;
                border-radius: 18px;
                font-size: 23px;
            }

            .account-name {
                font-size: 19px;
            }

        }

    </style>

</head>


<body>

            <section class="stats-grid">

                <div class="stat-card">

                    <div class="stat-icon">
                        📚
                    </div>

                    <span

                    </span>

                    <span class="stat-label">

                    </span>

                </div>


                <div class="stat-card">

                    <div class="stat-icon">
                        🏆
                    </div>

                    <span
                        id="badges"
                        class="stat-number">

                        0

                    </span>

                    <span class="stat-label">
                        الشارات
                    </span>

                </div>


                <div class="stat-card">

                    <div class="stat-icon">
                        🔥
                    </div>

                    <span

                        class="stat-number">

                        0

                    </span>

                    <span class="stat-label">

                </div>


            </section>


            <!-- Account information -->

            <div class="section-heading">

                <h2>
                    معلومات الحساب
                </h2>

            </div>


            <section class="account-card">


                <div class="account-row">

                    <div class="row-icon">

                    <div class="row-text">

                        <div class="row-label">
                            الاسم

                        <div

                            class="row-value">

                    </div>

                </div>


                <div class="account-row">

                    <div class="row-icon">

                    </div>

                    <div class="row-text">

                        <div class="row-label">

                        </div>

                        <div
                            id="infoEmail"
                            class="row-value"
                            dir="ltr">

                            -

                    </div>

                </div>


                <div class="account-row">

                    <div class="row-icon">
                        🎓
                    </div>

                    <div class="row-text">

                        <div class="row-label">

            <!-- Actions -->

            <div class="section-heading">

<!-- Supabase -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


    const SUPABASE_URL =
        "https://qkzdlxqledsznhbifaxy.supabase.co";


    const SUPABASE_KEY =
        "sb_publishable_ZdpHXwLlhpbXztsTXpAFTg_TgOji91v";


    const supabaseClient =
        supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    /* =========================================
       Load account
       ========================================= */

    async function loadAccount() {

        const {
            data,
            error
        } =
            await supabaseClient.auth.getSession();


        if (
            error ||
            !data.session
        ) {

            window.location.href =
                "login.html";

            return;

        }


        const user =
            data.session.user;


        let name =
            user.user_metadata?.full_name ||
            user.user_metadata?.name ||
            user.user_metadata?.display_name;


        if (!name) {

            name =
                user.email
                    ? user.email.split("@")[0]
                    : "الطالب";

        }


        const email =
            user.email || "-";


        const level =
            localStorage.getItem(
                "student_level"
            ) ||
            "لم يتم اختيار المستوى";


        /* Profile */

        document.getElementById(
            "studentName"
        ).textContent = name;


        document.getElementById(
            "studentEmail"
        ).textContent = email;


        document.getElementById(
            "studentLevel"
        ).textContent = level;


        document.getElementById(
            "infoName"
        ).textContent = name;


        document.getElementById(
            "infoEmail"
        ).textContent = email;


        document.getElementById(
            "infoLevel"
        ).textContent = level;


        /* Avatar */

        const firstLetter =
            name.trim().charAt(0);


        document.getElementById(
            "avatar"
        ).textContent =
            firstLetter || "ط";


        /* Statistics */

        const points =
            parseInt(
                localStorage.getItem(
                    "student_points"
                ) || "0",
                10
            );


        const lessons =
            parseInt(
                localStorage.getItem(
                    "completed_lessons"
                ) || "0",
                10
            );


        const submitted =
            localStorage.getItem(
                "weekly_challenge_submitted"
            ) === "true";


        const badges =
            points >= 50
                ? 1
                : 0;


        const streak =
            lessons > 0
                ? 1
                : 0;


        document.getElementById(
            "points"
        ).textContent = points;


        document.getElementById(
            "lessons"
        ).textContent = lessons;


        document.getElementById(
            "badges"
        ).textContent = badges;


        document.getElementById(
            "streak"
        ).textContent = streak;


        /* Show */

        document.getElementById(
            "loading"
        ).style.display = "none";


        document.getElementById(
            "accountContent"
        ).style.display = "block";

    }


    /* =========================================
       Navigation
       ========================================= */

    function goDashboard() {

        window.location.href =
            "dashboard.html";

    }


    function changeLevel() {

        window.location.href =
            "levels.html";

    }


    function openSettings() {

        window.location.href =
            "settings.html";

    }


    /* =========================================
       Message
       ========================================= */

    function showMessage(message) {

        const old =
            document.querySelector(
                ".account-message"
            );


        if (old) {
            old.remove();
        }


        const box =
            document.createElement("div");


        box.className =
            "account-message";


        box.textContent =
            message;


        document.body.appendChild(box);


        setTimeout(function() {

            box.style.opacity = "0";


            setTimeout(function() {

                box.remove();

            }, 250);

        }, 2300);

    }


    /* =========================================
       Logout
       ========================================= */

    async function logout() {

        const confirmed =
            window.confirm(
                "هل تريد تسجيل الخروج من حسابك؟"
            );


        if (!confirmed) {
            return;
        }


        const {
            error
        } =
            await supabaseClient.auth.signOut();


        if (error) {

            showMessage(
                "حدث خطأ أثناء تسجيل الخروج."
            );

            return;

        }


        /*
         * نحذف بيانات الجلسة المحلية
         * مع إبقاء بعض بيانات التعلم
         * حتى لا تضيع عند تسجيل الدخول مجددًا.
         */

        localStorage.removeItem(
            "student_level"
        );


        window.location.href =
            "login.html";

    }


    /* =========================================
       Start
       ========================================= */

    loadAccount();


</script>


</body>
