<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>حسابي | EduNova AI</title>

    <link
        rel="stylesheet"
        href="style.css">

    <style>

        /* =========================================================
           ACCOUNT PAGE
           EduNova AI
           Final UI Foundation
           ========================================================= */

        body {
            padding-top: 0;
        }

        .account-page-header {
            position: sticky;
            top: 0;
            z-index: 1000;
            margin-bottom: 18px;
            background: color-mix(
                in srgb,
                var(--background) 84%,
                transparent
            );
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-bottom: 1px solid var(--border);
        }

        .account-page-header::after {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            bottom: -18px;
            height: 18px;
            pointer-events: none;
            background: linear-gradient(
                to bottom,
                var(--background),
                transparent
            );
            opacity: .95;
        }

        .account-page-header .container {
            min-height: 62px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .account-page-brand {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            text-decoration: none;
            color: var(--text);
            font-weight: 900;
            font-size: 16px;
            min-width: 0;
        }

        .account-page-brand-icon {
            width: 35px;
            height: 35px;
            border-radius: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--text);
            color: var(--surface);
            font-size: 10px;
            font-weight: 900;
            letter-spacing: -.5px;
            flex-shrink: 0;
        }

        .account-dashboard-button {
            min-height: 38px;
            padding: 7px 13px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text);
            border-radius: 12px;
            font-family: inherit;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
            transition:
                border-color .2s ease,
                color .2s ease,
                background .2s ease;
            flex-shrink: 0;
        }

        .account-dashboard-button:hover {
            border-color: var(--primary);
            color: var(--primary);
        }


        /* =========================================================
           HERO
           ========================================================= */

        .account-hero {
            background: var(--primary);
            color: white;
            border-radius: 22px;
            padding: 23px 19px;
            margin-bottom: 18px;
            position: relative;
            overflow: hidden;
            box-shadow: var(--shadow-sm);
        }

        .account-hero::before {
            content: "";
            position: absolute;
            width: 210px;
            height: 210px;
            border-radius: 50%;
            background: rgba(255,255,255,.07);
            left: -85px;
            top: -95px;
        }

        .account-hero::after {
            content: "";
            position: absolute;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,.10);
            right: -45px;
            bottom: -45px;
        }

        .account-hero-content {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .avatar {
            width: 63px;
            height: 63px;
            border-radius: 19px;
            background: rgba(255,255,255,.14);
            border: 1px solid rgba(255,255,255,.30);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: 900;
            flex-shrink: 0;
        }

        .account-name {
            margin: 0;
            font-size: 21px;
            line-height: 1.3;
            overflow-wrap: anywhere;
        }

        .account-email {
            margin: 5px 0 0;
            opacity: .86;
            font-size: 12px;
            direction: ltr;
            text-align: right;
            overflow-wrap: anywhere;
        }

        .level-pill {
            display: inline-block;
            margin-top: 8px;
            padding: 5px 10px;
            border-radius: 999px;
            background: rgba(255,255,255,.13);
            border: 1px solid rgba(255,255,255,.10);
            font-size: 11px;
            font-weight: 700;
        }


        /* =========================================================
           SECTIONS
           ========================================================= */

        .section-heading {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin: 22px 2px 11px;
        }

        .section-heading h2 {
            margin: 0;
            font-size: 18px;
            color: var(--text);
        }

        .section-heading span {
            color: var(--text-soft);
            font-size: 11px;
        }


        /* =========================================================
           STATS
           ========================================================= */

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
        }

        .stat-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 17px;
            padding: 15px 10px;
            text-align: center;
            box-shadow: var(--shadow-sm);
            min-width: 0;
        }

        .stat-icon {
            width: 32px;
            height: 32px;
            margin: 0 auto 7px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--background);
            color: var(--text-soft);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 900;
        }

        .stat-number {
            display: block;
            color: var(--primary);
            font-size: 20px;
            font-weight: 900;
        }

        .stat-label {
            display: block;
            color: var(--text-soft);
            font-size: 10px;
            line-height: 1.4;
            margin-top: 2px;
        }


        /* =========================================================
           ACCOUNT INFORMATION
           ========================================================= */

        .account-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 18px;
            overflow: hidden;
            box-shadow: var(--shadow-sm);
        }

        .account-row {
            min-height: 59px;
            padding: 12px 14px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 11px;
        }

        .account-row:last-child {
            border-bottom: none;
        }

        .row-icon {
            width: 37px;
            height: 37px;
            border-radius: 11px;
            background: var(--primary-light);
            color: var(--text);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 13px;
            font-weight: 900;
        }

        .row-text {
            flex: 1;
            min-width: 0;
        }

        .row-label {
            color: var(--text-soft);
            font-size: 10px;
            margin-bottom: 3px;
        }

        .row-value {
            font-size: 13px;
            font-weight: 800;
            color: var(--text);
            overflow-wrap: anywhere;
        }


        /* =========================================================
           ACTIONS
           ========================================================= */

        .account-actions {
            display: grid;
            gap: 9px;
        }

        .account-action {
            width: 100%;
            min-height: 52px;
            border: 1px solid var(--border);
            background: var(--surface);
            border-radius: 15px;
            padding: 10px 12px;
            display: flex;
            align-items: center;
            gap: 11px;
            font-family: inherit;
            font-size: 12px;
            font-weight: 800;
            color: var(--text);
            cursor: pointer;
            text-align: right;
            transition:
                border-color .2s ease,
                color .2s ease,
                transform .2s ease,
                background .2s ease;
        }

        html[dir="ltr"] .account-action {
            text-align: left;
        }

        .account-action:hover {
            border-color: var(--primary);
            color: var(--primary);
            transform: translateY(-1px);
        }

        .account-action:active {
            transform: translateY(0);
        }

        .action-icon {
            width: 35px;
            height: 35px;
            border-radius: 10px;
            background: var(--background);
            border: 1px solid var(--border);
            color: var(--text-soft);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 14px;
            font-weight: 900;
        }

        .action-arrow {
            margin-right: auto;
            color: var(--text-light);
            font-size: 18px;
            line-height: 1;
        }

        html[dir="ltr"] .action-arrow {
            margin-right: 0;
            margin-left: auto;
        }

        .logout-action {
            color: var(--danger);
            background: var(--surface);
            border-color: var(--border);
        }

        .logout-action .action-icon {
            color: var(--danger);
        }

        .logout-action:hover {
            color: var(--danger);
            border-color: var(--danger);
        }

        .danger-action {
            color: var(--danger);
        }

        .danger-action .action-icon {
            color: var(--danger);
        }


        /* =========================================================
           LOADING
           ========================================================= */

        .loading-account {
            text-align: center;
            padding: 70px 20px;
            color: var(--text-soft);
        }

        .loading-icon {
            width: 42px;
            height: 42px;
            margin: 0 auto 12px;
            border: 1px solid var(--border);
            border-radius: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-soft);
            font-size: 17px;
            font-weight: 900;
        }


        /* =========================================================
           MESSAGE
           ========================================================= */

        .account-message {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            background: var(--text);
            color: var(--surface);
            padding: 11px 16px;
            border-radius: 12px;
            font-size: 12px;
            max-width: min(90%, 430px);
            text-align: center;
            box-shadow: var(--shadow);
            transition: opacity .25s ease;
        }

        .bottom-space {
            height: 15px;
        }


        /* =========================================================
           HIDDEN BOTTOM NAV
           ========================================================= */

        .bottom-nav {
            display: none !important;
            visibility: hidden !important;
            pointer-events: none !important;
        }


        /* =========================================================
           RESPONSIVE
           ========================================================= */

        @media (min-width: 650px) {

            .stats-grid {
                grid-template-columns: repeat(4, 1fr);
            }

            .account-actions {
                grid-template-columns: repeat(2, 1fr);
            }

        }


        @media (max-width: 600px) {

            .account-page-header {
                margin-bottom: 15px;
            }

            .account-page-header .container {
                min-height: 58px;
            }

            .account-page-brand {
                font-size: 14px;
            }

            .account-page-brand-icon {
                width: 33px;
                height: 33px;
                border-radius: 10px;
            }

            .account-dashboard-button {
                min-height: 36px;
                padding: 6px 10px;
                font-size: 11px;
            }

            .account-hero {
                border-radius: 19px;
                padding: 20px 15px;
            }

            .account-hero-content {
                gap: 11px;
            }

            .avatar {
                width: 57px;
                height: 57px;
                border-radius: 17px;
                font-size: 22px;
            }

            .account-name {
                font-size: 18px;
            }

            .account-email {
                font-size: 11px;
            }

            .stats-grid {
                gap: 8px;
            }

            .stat-card {
                padding: 13px 8px;
                border-radius: 15px;
            }

            .account-row {
                padding: 11px 12px;
            }

            .account-action {
                min-height: 50px;
            }

        }


        @media (max-width: 360px) {

            .account-page-brand span:last-child {
                display: none;
            }

            .account-name {
                font-size: 17px;
            }

            .account-email {
                max-width: 190px;
            }

            .stats-grid {
                gap: 7px;
            }

            .stat-card {
                padding: 12px 5px;
            }

            .stat-number {
                font-size: 18px;
            }

            .stat-label {
                font-size: 9px;
            }

        }

    </style>

</head>

    /* =========================================================
       LANGUAGE
    ========================================================= */

    function getAccountLanguage() {

        if (
            typeof getSiteLanguage ===
            "function"
        ) {

            return getSiteLanguage();

        }

        return (
            localStorage.getItem(
                GLOBAL_LANGUAGE_KEY || "site_language"
            ) || "ar"
        );

    }


    function accountText(key) {

        const language =
            getAccountLanguage();

        return (
            ACCOUNT_TRANSLATIONS[language]?.[key] ||
            ACCOUNT_TRANSLATIONS.ar[key] ||
            key
        );

    }


    /* =========================================================
       LEVEL
    ========================================================= */

    function getAccountLevelLabel() {

        let level =
            typeof getStudentLevel ===
            "function"
                ? getStudentLevel()
                : localStorage.getItem(
                    "student_level"
                );


        if (!level) {

            return accountText(
                "noLevel"
            );

        }


        if (
            typeof getLevelLabel ===
            "function"
        ) {

            try {

                return getLevelLabel(
                    level
                );

            } catch (error) {

                console.warn(
                    "Central level label unavailable:",
                    error
                );

            }

        }


        const normalized =
            String(level)
                .trim()
                .toLowerCase();


        const fallback = {

            "concours":
                "Concours",

            "كونكور":
                "Concours",

            "brevet":
                "Brevet",

            "بريفيه":
                "Brevet",

            "بريفي":
                "Brevet",

            "bac":
                "Baccalauréat",

            "baccalaureat":
                "Baccalauréat",

            "baccalauréat":
                "Baccalauréat"

        };


        if (
            getAccountLanguage() === "fr" &&
            fallback[normalized]
        ) {

            return fallback[
                normalized
            ];

        }


        return level;

    }


    /* =========================================================
       APPLY LANGUAGE
    ========================================================= */

    function translateAccountPage() {

        const language =
            getAccountLanguage();


        document.documentElement.lang =
            language;


        document.documentElement.dir =
            language === "fr"
                ? "ltr"
                : "rtl";


        document.title =
            accountText(
                "pageTitle"
            );


        const elements = {

            dashboardButton: "dashboard",
            loadingText: "loading",

            achievementsTitle: "achievements",
            progressText: "progress",

            pointsLabel: "points",
            lessonsLabel: "lessons",
            badgesLabel: "badges",
            streakLabel: "streak",

            accountInfoTitle: "accountInfo",
            nameLabel: "name",
            emailLabel: "email",
            levelLabel: "level",

            accountManagementTitle:
                "accountManagement",

            changeLevelText:
                "changeLevel",

            settingsText:
                "settings",

            editDataText:
                "editData",

            passwordText:
                "password",

            paymentsText:
                "payments",

            deleteText:
                "delete",

            logoutText:
                "logout",

            navHome:
                "navHome",

            navLibrary:
                "navLibrary",

            navForum:
                "navForum",

            navAccount:
                "navAccount"

        };


        Object.keys(elements).forEach(
            function(id) {

                const element =
                    document.getElementById(id);


                if (element) {

                    element.textContent =
                        accountText(
                            elements[id]
                        );

                }

            }
        );


        const levelLabel =
            getAccountLevelLabel();


        const studentLevel =
            document.getElementById(
                "studentLevel"
            );


        const infoLevel =
            document.getElementById(
                "infoLevel"
            );


        if (studentLevel) {

            studentLevel.textContent =
                levelLabel;

        }


        if (infoLevel) {

            infoLevel.textContent =
                levelLabel;

        }


        if (
            typeof updateThemeControls ===
            "function"
        ) {

            updateThemeControls();

        }

    }


    /* =========================================================
       THEME
    ========================================================= */

    function applyAccountTheme() {

        if (
            typeof getSiteTheme ===
            "function" &&
            typeof applySiteTheme ===
            "function"
        ) {

            applySiteTheme(
                getSiteTheme()
            );

        }

    }


    /* =========================================================
       LOAD ACCOUNT
    ========================================================= */

    async function loadAccount() {

        try {

            const {
                data,
                error
            } =
                await supabaseClient.auth.getSession();


            if (
                error ||
                !data.session
            ) {

                window.location.href =
                    "login.html";

                return;

            }


            const user =
                data.session.user;


            let name =
                user.user_metadata?.full_name ||
                user.user_metadata?.name ||
                user.user_metadata?.display_name;


            if (!name) {

                name =
                    user.email
                        ? user.email.split("@")[0]
                        : accountText(
                            "defaultStudent"
                        );

            }


            const email =
                user.email || "-";


            const level =
                getAccountLevelLabel();


            /* PROFILE */

            const studentName =
                document.getElementById(
                    "studentName"
                );

            const studentEmail =
                document.getElementById(
                    "studentEmail"
                );

            const studentLevel =
                document.getElementById(
                    "studentLevel"
                );

            const infoName =
                document.getElementById(
                    "infoName"
                );

            const infoEmail =
                document.getElementById(
                    "infoEmail"
                );

            const infoLevel =
                document.getElementById(
                    "infoLevel"
                );


            if (studentName) {

                studentName.textContent =
                    name;

            }


            if (studentEmail) {

                studentEmail.textContent =
                    email;

            }


            if (studentLevel) {

                studentLevel.textContent =
                    level;

            }


            if (infoName) {

                infoName.textContent =
                    name;

            }


            if (infoEmail) {

                infoEmail.textContent =
                    email;

            }


            if (infoLevel) {

                infoLevel.textContent =
                    level;

            }


            /* AVATAR */

            const firstLetter =
                String(name)
                    .trim()
                    .charAt(0);


            const avatar =
                document.getElementById(
                    "avatar"
                );


            if (avatar) {

                avatar.textContent =
                    firstLetter ||
                    (
                        getAccountLanguage() === "fr"
                            ? "É"
                            : "ط"
                    );

            }


            /* =================================================
               STATISTICS
            ================================================= */

            let points = 0;


            if (
                typeof getStudentPoints ===
                "function"
            ) {

                points =
                    Number(
                        getStudentPoints()
                    ) || 0;

            } else {

                points =
                    parseInt(
                        localStorage.getItem(
                            "student_points"
                        ) || "0",
                        10
                    ) || 0;

            }


            let lessons = 0;


            if (
                typeof getCompletedLessons ===
                "function"
            ) {

                const completed =
                    getCompletedLessons();


                lessons =
                    Array.isArray(completed)
                        ? completed.length
                        : Number(completed) || 0;

            } else {

                lessons =
                    parseInt(
                        localStorage.getItem(
                            "completed_lessons"
                        ) || "0",
                        10
                    ) || 0;

            }


            const badges =
                points >= 50
                    ? 1
                    : 0;


            const streak =
                lessons > 0
                    ? 1
                    : 0;


            const pointsElement =
                document.getElementById(
                    "points"
                );


            const lessonsElement =
                document.getElementById(
                    "lessons"
                );


            const badgesElement =
                document.getElementById(
                    "badges"
                );


            const streakElement =
                document.getElementById(
                    "streak"
                );


            if (pointsElement) {

                pointsElement.textContent =
                    points;

            }


            if (lessonsElement) {

                lessonsElement.textContent =
                    lessons;

            }


            if (badgesElement) {

                badgesElement.textContent =
                    badges;

            }


            if (streakElement) {

                streakElement.textContent =
                    streak;

            }


            /* SHOW */

            const loading =
                document.getElementById(
                    "loading"
                );


            const accountContent =
                document.getElementById(
                    "accountContent"
                );


            if (loading) {

                loading.style.display =
                    "none";

            }


            if (accountContent) {

                accountContent.style.display =
                    "block";

            }

        }

        catch (error) {

            console.error(
                "Account loading error:",
                error
            );


            showMessage(
                getAccountLanguage() === "fr"
                    ? "Impossible de charger le compte."
                    : "تعذر تحميل الحساب."
            );

        }

    }


    /* =========================================================
       NAVIGATION
    ========================================================= */

    function goDashboard() {

        window.location.href =
            "dashboard.html";

    }


    function changeLevel() {

        window.location.href =
            "levels.html";

    }


    function openSettings() {

        window.location.href =
            "settings.html";

    }


    /* =========================================================
       MESSAGE
    ========================================================= */

    function showMessage(type) {

        const messages = {

            editData:
                accountText(
                    "editDataMessage"
                ),

            password:
                accountText(
                    "passwordMessage"
                ),

            payments:
                accountText(
                    "paymentsMessage"
                ),

            delete:
                accountText(
                    "deleteMessage"
                )

        };


        const message =
            messages[type] ||
            type;


        const old =
            document.querySelector(
                ".account-message"
            );


        if (old) {

            old.remove();

        }


        const box =
            document.createElement(
                "div"
            );


        box.className =
            "account-message";


        box.textContent =
            message;


        document.body.appendChild(
            box
        );


        setTimeout(
            function() {

                box.style.opacity =
                    "0";


                setTimeout(
                    function() {

                        box.remove();

                    },
                    250
                );

            },
            2300
        );

    }


    /* =========================================================
       LOGOUT
    ========================================================= */

    async function logout() {

        const confirmed =
            window.confirm(
                accountText(
                    "logoutConfirm"
                )
            );


        if (!confirmed) {

            return;

        }


        const {
            error
        } =
            await supabaseClient.auth.signOut();


        if (error) {

            showMessage(
                accountText(
                    "logoutError"
                )
            );

            return;

        }


        /*
           تسجيل الخروج لا يلمس إعدادات
           اللغة أو الوضع أو بنية المنصة.
        */

        localStorage.removeItem(
            "student_level"
        );

        localStorage.removeItem(
            "bac_branch"
        );

        localStorage.removeItem(
            "selected_subject"
        );

        localStorage.removeItem(
            "selected_subject_type"
        );

        localStorage.removeItem(
            "selected_chapter"
        );

        localStorage.removeItem(
            "selected_video"
        );


        window.location.href =
            "login.html";

    }


    /* =========================================================
       GLOBAL LANGUAGE EVENTS
    ========================================================= */

    window.addEventListener(
        "languageChanged",
        function() {

            translateAccountPage();

        }
    );


    window.addEventListener(
        "siteLanguageChanged",
        function() {

            translateAccountPage();

        }
    );


    window.addEventListener(
        "languagechange",
        function() {

            translateAccountPage();

        }
    );


    /* =========================================================
       GLOBAL THEME EVENTS
    ========================================================= */

    window.addEventListener(
        "themeChanged",
        function() {

            applyAccountTheme();

        }
    );


    window.addEventListener(
        "siteThemeChanged",
        function() {

            applyAccountTheme();

        }
    );


    /* =========================================================
       LEVEL / BRANCH EVENTS
    ========================================================= */

    window.addEventListener(
        "studentLevelChanged",
        function() {

            translateAccountPage();

        }
    );


    window.addEventListener(
        "bacBranchChanged",
        function() {

            translateAccountPage();

        }
    );


    /* =========================================================
       STORAGE SYNC
    ========================================================= */

    window.addEventListener(
        "storage",
        function(event) {

            if (
                event.key ===
                "site_language"
            ) {

                translateAccountPage();

            }


            if (
                event.key ===
                "site_theme"
            ) {

                applyAccountTheme();

            }


            if (
                event.key ===
                "student_level"
            ) {

                translateAccountPage();

            }


            if (
                event.key ===
                "bac_branch"
            ) {

                translateAccountPage();

            }


            if (
                event.key ===
                "student_points"
            ) {

                loadAccount();

            }


            if (
                event.key ===
                "completed_lessons"
            ) {

                loadAccount();

            }

        }
    );


    /* =========================================================
       START
    ========================================================= */

    document.addEventListener(
        "DOMContentLoaded",
        function() {

            if (
                typeof initializeGlobalSettings ===
                "function"
            ) {

                initializeGlobalSettings();

            }


            applyAccountTheme();

            translateAccountPage();

            loadAccount();

        }
    );

</script>
