<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>اختيار المستوى | EduNova AI</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>

    <style>
        /* =========================
           LEVELS PAGE
           ========================= */

        .levels-page {
            min-height: calc(100vh - 70px);
            padding: 32px 0 60px;
            display: flex;
            align-items: center;
        }

        .levels-wrapper {
            width: 100%;
            max-width: 900px;
            margin: auto;
        }

        /* =========================
           IDENTITY
           ========================= */

        .teacher-intro {
            display: flex;
            align-items: center;
            gap: 14px;
            width: fit-content;
            max-width: 100%;
            margin: 0 auto 24px;
            padding: 9px 14px;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: var(--surface);
            box-shadow: var(--shadow-sm);
        }

        .teacher-avatar {
            width: 40px;
            height: 40px;
            flex-shrink: 0;
            display: grid;
            place-items: center;
            border-radius: 50%;
            background: linear-gradient(
                135deg,
                var(--primary),
                var(--accent)
            );
            color: white;
            font-size: 19px;
            font-weight: 900;
        }

        .teacher-intro-text {
            text-align: right;
            line-height: 1.35;
        }

        .teacher-intro-text strong {
            display: block;
            font-size: 13px;
            font-weight: 850;
        }

        .teacher-intro-text span {
            display: block;
            margin-top: 2px;
            color: var(--text-soft);
            font-size: 11px;
        }

        /* =========================
           HERO
           ========================= */

        .levels-hero {
            text-align: center;
            margin-bottom: 30px;
        }

        .levels-icon {
            width: 78px;
            height: 78px;
            margin: 0 auto 17px;

            display: grid;
            place-items: center;

            border-radius: 24px;

            background:
                linear-gradient(
                    135deg,
                    var(--primary-light),
                    #f5f3ff
                );

            border: 1px solid var(--border);
            box-shadow: var(--shadow-md);

            font-size: 34px;
        }

        .levels-hero h1 {
            margin: 0;

            font-size: clamp(28px, 6vw, 40px);
            line-height: 1.25;
            font-weight: 900;

            letter-spacing: -.5px;
        }

        .levels-hero h1 span {
            color: var(--primary);
        }

        .levels-hero p {
            max-width: 620px;

            margin: 11px auto 0;

            color: var(--text-soft);

            font-size: 14px;
            line-height: 1.9;
        }

        /* =========================
           LEVEL CARDS
           ========================= */

        .level-options {
            display: grid;
            gap: 15px;
        }

        .level-option {
            position: relative;

            width: 100%;
            min-height: 126px;

            padding: 19px;

            display: flex;
            align-items: center;
            gap: 15px;

            text-align: right;

            background: var(--surface);
            border: 2px solid var(--border);
            border-radius: var(--radius-lg);

            cursor: pointer;

            transition:
                transform .2s ease,
                border-color .2s ease,
                box-shadow .2s ease,
                background .2s ease;
        }

        .level-option:hover {
            transform: translateY(-3px);
            border-color: #93c5fd;
            box-shadow: var(--shadow-md);
        }

        .level-option:active {
            transform: scale(.985);
        }

        .level-option.selected {
            border-color: var(--primary);

            background:
                linear-gradient(
                    135deg,
                    var(--surface),
                    var(--primary-light)
                );

            box-shadow:
                0 0 0 4px rgba(37, 99, 235, .08),
                var(--shadow-md);
        }

        .level-option-icon {
            width: 62px;
            height: 62px;

            flex-shrink: 0;

            display: grid;
            place-items: center;

            border-radius: 19px;

            background: var(--primary-light);

            font-size: 29px;

            transition: transform .2s ease;
        }

        .level-option:hover .level-option-icon {
            transform: scale(1.06);
        }

        .level-option.selected .level-option-icon {
            background: var(--primary);
            color: white;
        }

        .level-option-content {
            min-width: 0;
            flex: 1;
        }

        .level-option-content h2 {
            margin: 0;

            font-size: 19px;
            font-weight: 900;
        }

        .level-option-content p {
            margin: 6px 0 0;

            color: var(--text-soft);

            font-size: 12px;
            line-height: 1.7;
        }

        .level-tag {
            display: inline-flex;
            align-items: center;

            margin-top: 7px;
            padding: 3px 8px;

            border-radius: 999px;

            background: var(--primary-light);
            color: var(--primary);

            font-size: 10px;
            font-weight: 800;
        }

        .level-check {
            width: 29px;
            height: 29px;

            flex-shrink: 0;

            display: grid;
            place-items: center;

            border: 2px solid #cbd5e1;
            border-radius: 50%;

            color: transparent;

            font-size: 14px;
            font-weight: 900;

            transition: .2s ease;
        }

        .level-option.selected .level-check {
            border-color: var(--primary);
            background: var(--primary);
            color: white;
            transform: scale(1.05);
        }

        /* =========================
           BAC BRANCHES
           ========================= */

        .bac-branches {
            display: none;
            margin-top: 18px;
            gap: 15px;
            animation: fadeIn .25s ease;
        }

        .bac-branches.visible {
            display: grid;
        }

        .bac-branch {
            position: relative;

            width: 100%;
            min-height: 120px;

            padding: 18px;

            display: flex;
            align-items: center;
            gap: 14px;

            text-align: right;

            background: var(--surface);
            border: 2px solid var(--border);
            border-radius: var(--radius-lg);

            cursor: pointer;

            transition:
                transform .2s ease,
                border-color .2s ease,
                box-shadow .2s ease,
                background .2s ease;
        }

        .bac-branch:hover {
            transform: translateY(-3px);
            border-color: #93c5fd;
            box-shadow: var(--shadow-md);
        }

        .bac-branch.selected {
            border-color: var(--primary);

            background:
                linear-gradient(
                    135deg,
                    var(--surface),
                    var(--primary-light)
                );

            box-shadow:
                0 0 0 4px rgba(37, 99, 235, .08),
                var(--shadow-md);
        }

        .bac-branch-icon {
            width: 58px;
            height: 58px;

            flex-shrink: 0;

            display: grid;
            place-items: center;

            border-radius: 17px;

            background: var(--primary-light);

            color: var(--primary);

            font-size: 25px;
            font-weight: 900;
        }

        .bac-branch.selected .bac-branch-icon {
            background: var(--primary);
            color: white;
        }

        .bac-branch-content {
            flex: 1;
            min-width: 0;
        }

        .bac-branch-content h3 {
            margin: 0;
            font-size: 18px;
            font-weight: 900;
        }

        .bac-branch-content p {
            margin: 5px 0 0;
            color: var(--text-soft);
            font-size: 11px;
            line-height: 1.7;
        }

        .bac-branch-check {
            width: 28px;
            height: 28px;

            flex-shrink: 0;

            display: grid;
            place-items: center;

            border: 2px solid #cbd5e1;
            border-radius: 50%;

            color: transparent;

            font-size: 13px;
            font-weight: 900;
        }

        .bac-branch.selected .bac-branch-check {
            border-color: var(--primary);
            background: var(--primary);
            color: white;
        }

        .bac-note {
            display: none;
            margin-top: 10px;
            text-align: center;
            color: var(--text-soft);
            font-size: 11px;
        }

        .bac-note.visible {
            display: block;
        }

        /* =========================
           ACTIONS
           ========================= */

        .levels-actions {
            margin-top: 20px;
        }

        .continue-level {
            width: 100%;
            min-height: 52px;
            font-size: 15px;
        }

        .continue-level:disabled {
            opacity: .5;
            cursor: not-allowed;
            transform: none;
        }

        .back-dashboard {
            width: 100%;
            margin-top: 10px;
        }

        .current-level-note {
            min-height: 22px;

            margin-top: 12px;

            text-align: center;

            color: var(--text-soft);

            font-size: 12px;
        }

        /* =========================
           FOOT NOTE
           ========================= */

        .levels-footer-note {
            margin: 22px auto 0;

            max-width: 620px;

            text-align: center;

            color: var(--text-soft);

            font-size: 11px;
            line-height: 1.8;
        }

        /* =========================
           DESKTOP
           ========================= */

        @media (min-width: 650px) {

            .levels-page {
                padding-top: 45px;
            }

            .level-options {
                grid-template-columns: repeat(3, 1fr);
            }

            .level-option {
                min-height: 285px;

                flex-direction: column;
                justify-content: center;

                padding: 25px 18px;

                text-align: center;
            }

            .level-option-icon {
                width: 72px;
                height: 72px;
                font-size: 33px;
            }

            .level-option-content h2 {
                margin-top: 2px;
                font-size: 20px;
            }

            .level-option-content p {
                margin-top: 9px;
            }

            .level-tag {
                margin-top: 11px;
            }

            .level-check {
                position: absolute;
                top: 14px;
                left: 14px;
            }

            .bac-branches {
                grid-template-columns: repeat(2, 1fr);
            }

            .bac-branch {
                min-height: 150px;
                flex-direction: column;
                justify-content: center;
                text-align: center;
            }

            .bac-branch-check {
                position: absolute;
                top: 14px;
                left: 14px;
            }
        }

        /* =========================
           SMALL PHONES
           ========================= */

        @media (max-width: 420px) {

            .levels-page {
                padding-top: 22px;
            }

            .teacher-intro {
                margin-bottom: 20px;
            }

            .teacher-avatar {
                width: 36px;
                height: 36px;
            }

            .levels-icon {
                width: 68px;
                height: 68px;
                border-radius: 21px;
                font-size: 29px;
            }

            .levels-hero {
                margin-bottom: 22px;
            }

            .levels-hero h1 {
                font-size: 27px;
            }

            .levels-hero p {
                font-size: 13px;
            }

            .level-option {
                min-height: 112px;
                padding: 15px;
                gap: 12px;
            }

            .level-option-icon {
                width: 54px;
                height: 54px;
                border-radius: 16px;
                font-size: 25px;
            }

            .level-option-content h2 {
                font-size: 17px;
            }

            .level-option-content p {
                font-size: 11px;
            }

            .bac-branch {
                min-height: 105px;
                padding: 14px;
            }

            .bac-branch-icon {
                width: 50px;
                height: 50px;
                border-radius: 15px;
            }
        }
    </style>
</head>

<body>

<header class="site-header">

    <div class="container header-inner">

        <button
            class="brand"
            onclick="goHome()"
            aria-label="الصفحة الرئيسية">

            <span class="brand-icon">AI</span>

            <span>EduNova AI</span>

        </button>

        <button
            class="btn btn-secondary"
            onclick="goDashboard()">

            ← الرئيسية

        </button>

    </div>

</header>


<main class="page levels-page">

    <div class="container levels-wrapper">


        <!-- Teacher Identity -->

        <div class="teacher-intro">

            <div class="teacher-avatar">
                AI
            </div>

            <div class="teacher-intro-text">

                <strong>
                    Afkrash AI
                </strong>

                <span>
                    مدرسك الذكي في EduNova AI
                </span>

            </div>

        </div>


        <!-- Hero -->

        <section class="levels-hero">

            <div class="levels-icon">
                🎓
            </div>

            <h1>
                أين تبدأ <span>رحلتك؟</span>
            </h1>

            <p>
                اختر شهادتك الدراسية، وسنجهز لك
                الطريق المناسب لتعلم الرياضيات
                داخل EduNova AI مع Afkrash AI.
            </p>

        </section>


        <!-- Certificates -->

        <section
            class="level-options"
            aria-label="الشهادات الدراسية">


            <!-- 6AF / Concours -->

            <button
                class="level-option"
                data-level="concours"
                onclick="selectLevel('concours', this)"
                type="button">

                <div class="level-option-icon">
                    🏆
                </div>

                <div class="level-option-content">

                    <h2>
                        كونكور
                    </h2>

                    <p>
                        شهادة ختم الدروس الابتدائية
                        والتحضير للمسابقة والاختبارات.
                    </p>

                    <span class="level-tag">
                        6AF
                    </span>

                </div>

                <span class="level-check">
                    ✓
                </span>

            </button>


            <!-- 4ème / Brevet -->

            <button
                class="level-option"
                data-level="brevet"
                onclick="selectLevel('brevet', this)"
                type="button">

                <div class="level-option-icon">
                    📘
                </div>

                <div class="level-option-content">

                    <h2>
                        بريڤي
                    </h2>

                    <p>
                        شهادة ختم الدروس الإعدادية
                        والاستعداد للـ Brevet.
                    </p>

                    <span class="level-tag">
                        4ème année secondaire
                    </span>

                </div>

                <span class="level-check">
                    ✓
                </span>

            </button>


            <!-- Baccalauréat -->

            <button
                class="level-option"
                data-level="bac"
                onclick="selectLevel('bac', this)"
                type="button">

                <div class="level-option-icon">
                    🎓
                </div>

                <div class="level-option-content">

                    <h2>
                        باكالوريا
                    </h2>

                    <p>
                        اختر شعبة البكالوريا للوصول
                        إلى برنامج الرياضيات الصحيح.
                    </p>

                    <span class="level-tag">
                        Baccalauréat
                    </span>

                </div>

                <span class="level-check">
                    ✓
                </span>

            </button>

        </section>


        <!-- Bac Branches -->

        <section
            id="bacBranches"
            class="bac-branches"
            aria-label="شعبة البكالوريا">


            <!-- Bac C -->

            <button
                class="bac-branch"
                data-branch="C"
                onclick="selectBacBranch('C', this)"
                type="button">

                <div class="bac-branch-icon">
                    C
                </div>

                <div class="bac-branch-content">

                    <h3>
                        Bac C
                    </h3>

                    <p>
                        الرياضيات الخاصة بشعبة
                        البكالوريا C.
                    </p>

                </div>

                <span class="bac-branch-check">
                    ✓
                </span>

            </button>


            <!-- Bac D -->

            <button
                class="bac-branch"
                data-branch="D"
                onclick="selectBacBranch('D', this)"
                type="button">

                <div class="bac-branch-icon">
                    D
                </div>

                <div class="bac-branch-content">

                    <h3>
                        Bac D
                    </h3>

                    <p>
                        الرياضيات الخاصة بشعبة
                        البكالوريا D.
                    </p>

                </div>

                <span class="bac-branch-check">
                    ✓
                </span>

            </button>

        </section>


        <div
            id="bacNote"
            class="bac-note">

            اختر Bac C أو Bac D لأن لكل شعبة برنامج رياضيات مختلف.
            
        </div>


        <!-- Actions -->

        <section class="levels-actions">

            <button
                id="continueButton"
                class="btn btn-primary continue-level"
                onclick="continueToLibrary()"
                disabled
                type="button">

                اختر مستواك للمتابعة

            </button>


            <button
                class="btn btn-secondary back-dashboard"
                onclick="goDashboard()"
                type="button">

                العودة إلى لوحة الطالب

            </button>


            <div
                id="currentLevelNote"
                class="current-level-note">
            </div>

        </section>


        <p class="levels-footer-note">

            EduNova AI يساعدك على اختيار طريقك،
            وAfkrash AI يرافقك في تعلم الرياضيات
            خطوة بخطوة.

        </p>


    </div>

</main>


<script>

    /* =========================
       STATE
       ========================= */

    let selectedLevel = null;
    let selectedBacBranch = null;


    /* =========================
       LEVEL NAMES
       ========================= */

    const levelNames = {

        concours: "كونكور — 6AF",

        brevet: "بريڤي — 4ème",

        bac: "باكالوريا"

    };


    /* =========================
       SELECT LEVEL
       ========================= */

    function selectLevel(level, element) {

        selectedLevel = level;

        /*
         * إذا انتقل الطالب من الباك إلى مستوى آخر،
         * نحذف اختيار C/D من الحالة الحالية.
         */
        if (level !== "bac") {

            selectedBacBranch = null;

            localStorage.removeItem("bac_branch");

        }


        /*
         * إزالة التحديد من الشهادات
         */

        document
            .querySelectorAll(".level-option")
            .forEach(option => {

                option.classList.remove("selected");

            });


        element.classList.add("selected");


        /*
         * Bac يحتاج خطوة إضافية
         */

        const bacBranches =
            document.getElementById("bacBranches");

        const bacNote =
            document.getElementById("bacNote");


        if (level === "bac") {

            bacBranches.classList.add("visible");
            bacNote.classList.add("visible");

        } else {

            bacBranches.classList.remove("visible");
            bacNote.classList.remove("visible");

        }


        /*
         * تحديث الزر
         */

        updateContinueButton();

        updateCurrentLevelNote();

    }


    /* =========================
       SELECT BAC BRANCH
       ========================= */

    function selectBacBranch(branch, element) {

        selectedBacBranch = branch;


        document
            .querySelectorAll(".bac-branch")
            .forEach(option => {

                option.classList.remove("selected");

            });


        element.classList.add("selected");


        localStorage.setItem(
            "bac_branch",
            branch
        );


        updateContinueButton();

        updateCurrentLevelNote();

    }


    /* =========================
       UPDATE CONTINUE BUTTON
       ========================= */

    function updateContinueButton() {

        const button =
            document.getElementById(
                "continueButton"
            );


        /*
         * لا يوجد مستوى
         */

        if (!selectedLevel) {

            button.disabled = true;

            button.textContent =
                "اختر مستواك للمتابعة";

            return;

        }


        /*
         * Bac بدون C/D
         */

        if (
            selectedLevel === "bac" &&
            !selectedBacBranch
        ) {

            button.disabled = true;

            button.textContent =
                "اختر Bac C أو Bac D";

            return;

        }


        /*
         * المستوى جاهز
         */

        button.disabled = false;


        if (selectedLevel === "bac") {

            button.textContent =
                "متابعة مع Bac " +
                selectedBacBranch;

        } else {

            button.textContent =
                "متابعة مع " +
                levelNames[selectedLevel];

        }

    }


    /* =========================
       CURRENT LEVEL NOTE
       ========================= */

    function updateCurrentLevelNote() {

        const note =
            document.getElementById(
                "currentLevelNote"
            );


        if (!selectedLevel) {

            note.textContent = "";

            return;

        }


        if (selectedLevel === "bac") {

            if (!selectedBacBranch) {

                note.textContent =
                    "المستوى المحدد: باكالوريا — اختر الشعبة";

            } else {

                note.textContent =
                    "المستوى المحدد: باكالوريا " +
                    selectedBacBranch;

            }

            return;

        }


        note.textContent =
            "المستوى المحدد: " +
            levelNames[selectedLevel];

    }


    /* =========================
       CONTINUE
       ========================= */

    function continueToLibrary() {

        if (!selectedLevel) {
            return;
        }


        /*
         * Bac يجب أن يحتوي على شعبة
         */

        if (
            selectedLevel === "bac" &&
            !selectedBacBranch
        ) {

            return;

        }


        /*
         * حفظ الشهادة
         */

        localStorage.setItem(
            "student_level",
            selectedLevel
        );


        /*
         * حفظ الشعبة فقط للباكالوريا
         */

        if (selectedLevel === "bac") {

            localStorage.setItem(
                "bac_branch",
                selectedBacBranch
            );

        } else {

            localStorage.removeItem(
                "bac_branch"
            );

        }


        /*
         * الانتقال إلى المواد
         */

        window.location.href =
            "library.html";

    }


    /* =========================
       LOAD SAVED LEVEL
       ========================= */

    function loadSavedLevel() {

        const saved =
            localStorage.getItem(
                "student_level"
            );


        if (!saved) {
            return;
        }


        const option =
            document.querySelector(
                `[data-level="${saved}"]`
            );


        if (!option) {
            return;
        }


        selectLevel(
            saved,
            option
        );


        /*
         * استرجاع شعبة الباك
         */

        if (saved === "bac") {

            const savedBranch =
                localStorage.getItem(
                    "bac_branch"
                );


            if (
                savedBranch === "C" ||
                savedBranch === "D"
            ) {

                const branchElement =
                    document.querySelector(
                        `[data-branch="${savedBranch}"]`
                    );


                if (branchElement) {

                    selectBacBranch(
                        savedBranch,
                        branchElement
                    );

                }

            }

        }

    }


    /* =========================
       NAVIGATION
       ========================= */

    function goDashboard() {

        if (typeof goTo === "function") {

            goTo("dashboard.html");

            return;

        }


        window.location.href =
            "dashboard.html";

    }


    function goHome() {

        if (typeof goTo === "function") {

            goTo("index.html");

            return;

        }


        window.location.href =
            "index.html";

    }


    /* =========================
       GLOBAL LANGUAGE / THEME
       ========================= */

    document.addEventListener(
        "DOMContentLoaded",
        function () {

            if (
                typeof initializeGlobalSettings ===
                "function"
            ) {

                initializeGlobalSettings();

            }

            loadSavedLevel();

        }
    );

</script>

</body>

    </html>
