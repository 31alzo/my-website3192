<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>اختيار المستوى | EduNova AI</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>

    <style>
        /* =========================================================
           LEVELS PAGE
           EduNova AI
           Certificate / Branch Selection
           ========================================================= */

        .levels-page {
            min-height: calc(100vh - 70px);
            padding: 32px 0 60px;
            display: flex;
            align-items: center;
        }

        .levels-wrapper {
            width: 100%;
            max-width: 900px;
            margin: auto;
        }

        /* =========================
           TEACHER IDENTITY
           ========================= */

        .teacher-intro {
            display: flex;
            align-items: center;
            gap: 14px;
            width: fit-content;
            max-width: 100%;
            margin: 0 auto 24px;
            padding: 9px 14px;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: var(--surface);
            box-shadow: var(--shadow-sm);
        }

        .teacher-avatar {
            width: 40px;
            height: 40px;
            flex-shrink: 0;

            display: grid;
            place-items: center;

            border-radius: 50%;

            background: linear-gradient(
                135deg,
                var(--primary),
                var(--accent)
            );

            color: white;
            font-size: 13px;
            font-weight: 900;
        }

        .teacher-intro-text {
            text-align: right;
            line-height: 1.35;
        }

        .teacher-intro-text strong {
            display: block;
            font-size: 13px;
            font-weight: 850;
        }

        .teacher-intro-text span {
            display: block;
            margin-top: 2px;
            color: var(--text-soft);
            font-size: 11px;
        }

        /* =========================
           HERO
           ========================= */

        .levels-hero {
            text-align: center;
            margin-bottom: 30px;
        }

        .levels-icon {
            width: 78px;
            height: 78px;
            margin: 0 auto 17px;

            display: grid;
            place-items: center;

            border-radius: 24px;

            background:
                linear-gradient(
                    135deg,
                    var(--primary-light),
                    #f5f3ff
                );

            border: 1px solid var(--border);
            box-shadow: var(--shadow-md);

            color: var(--primary);
            font-size: 30px;
            font-weight: 900;
        }

        .levels-hero h1 {
            margin: 0;

            font-size: clamp(28px, 6vw, 40px);
            line-height: 1.25;
            font-weight: 900;

            letter-spacing: -.5px;
        }

        .levels-hero h1 span {
            color: var(--primary);
        }

        .levels-hero p {
            max-width: 650px;

            margin: 11px auto 0;

            color: var(--text-soft);

            font-size: 14px;
            line-height: 1.9;
        }

        /* =========================
           CERTIFICATE OPTIONS
           ========================= */

        .level-options {
            display: grid;
            gap: 15px;
        }

        .level-option {
            position: relative;

            width: 100%;
            min-height: 126px;

            padding: 19px;

            display: flex;
            align-items: center;
            gap: 15px;

            text-align: right;

            background: var(--surface);
            border: 2px solid var(--border);
            border-radius: var(--radius-lg);

            cursor: pointer;

            transition:
                transform .2s ease,
                border-color .2s ease,
                box-shadow .2s ease,
                background .2s ease;
        }

        .level-option:hover {
            transform: translateY(-3px);
            border-color: var(--primary);
            box-shadow: var(--shadow-md);
        }

        .level-option:active {
            transform: scale(.985);
        }

        .level-option.selected {
            border-color: var(--primary);

            background:
                linear-gradient(
                    135deg,
                    var(--surface),
                    var(--primary-light)
                );

            box-shadow:
                0 0 0 4px rgba(37, 99, 235, .08),
                var(--shadow-md);
        }

        .level-option-icon {
            width: 62px;
            height: 62px;

            flex-shrink: 0;

            display: grid;
            place-items: center;

            border-radius: 19px;

            background: var(--primary-light);

            color: var(--primary);
            font-size: 22px;
            font-weight: 900;

            transition: transform .2s ease;
        }

        .level-option:hover .level-option-icon {
            transform: scale(1.06);
        }

        .level-option.selected .level-option-icon {
            background: var(--primary);
            color: white;
        }

        .level-option-content {
            min-width: 0;
            flex: 1;
        }

        .level-option-content h2 {
            margin: 0;

            font-size: 19px;
            font-weight: 900;
        }

        .level-option-content p {
            margin: 6px 0 0;

            color: var(--text-soft);

            font-size: 12px;
            line-height: 1.7;
        }

        .level-tag {
            display: inline-flex;
            align-items: center;

            margin-top: 7px;
            padding: 3px 8px;

            border-radius: 999px;

            background: var(--primary-light);
            color: var(--primary);

            font-size: 10px;
            font-weight: 800;
        }

        .level-check {
            width: 29px;
            height: 29px;

            flex-shrink: 0;

            display: grid;
            place-items: center;

            border: 2px solid #cbd5e1;
            border-radius: 50%;

            color: transparent;

            font-size: 14px;
            font-weight: 900;

            transition: .2s ease;
        }

        .level-option.selected .level-check {
            border-color: var(--primary);
            background: var(--primary);
            color: white;
            transform: scale(1.05);
        }

        /* =========================
           SUBJECT SUMMARY
           ========================= */

        .level-subject-summary {
            display: none;

            margin-top: 14px;
            padding: 13px 15px;

            border: 1px solid var(--border);
            border-radius: var(--radius-md);

            background: var(--surface);

            animation: fadeIn .25s ease;
        }

        .level-subject-summary.visible {
            display: block;
        }

        .summary-title {
            margin: 0 0 8px;

            color: var(--text);
            font-size: 12px;
            font-weight: 850;
        }

        .subject-count {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;

            color: var(--text-soft);
            font-size: 11px;
        }

        .subject-count strong {
            color: var(--primary);
            font-size: 15px;
        }

        /* =========================
           BAC BRANCHES
           ========================= */

        .bac-branches {
            display: none;

            margin-top: 18px;
            gap: 15px;

            animation: fadeIn .25s ease;
        }

        .bac-branches.visible {
            display: grid;
        }

        .bac-branch {
            position: relative;

            width: 100%;
            min-height: 120px;

            padding: 18px;

            display: flex;
            align-items: center;
            gap: 14px;

            text-align: right;

            background: var(--surface);
            border: 2px solid var(--border);
            border-radius: var(--radius-lg);

            cursor: pointer;

            transition:
                transform .2s ease,
                border-color .2s ease,
                box-shadow .2s ease,
                background .2s ease;
        }

        .bac-branch:hover {
            transform: translateY(-3px);
            border-color: var(--primary);
            box-shadow: var(--shadow-md);
        }

        .bac-branch.selected {
            border-color: var(--primary);

            background:
                linear-gradient(
                    135deg,
                    var(--surface),
                    var(--primary-light)
                );

            box-shadow:
                0 0 0 4px rgba(37, 99, 235, .08),
                var(--shadow-md);
        }

        .bac-branch-icon {
            width: 58px;
            height: 58px;

            flex-shrink: 0;

            display: grid;
            place-items: center;

            border-radius: 17px;

            background: var(--primary-light);
            color: var(--primary);

            font-size: 25px;
            font-weight: 900;
        }

        .bac-branch.selected .bac-branch-icon {
            background: var(--primary);
            color: white;
        }

        .bac-branch-content {
            flex: 1;
            min-width: 0;
        }

        .bac-branch-content h3 {
            margin: 0;

            font-size: 18px;
            font-weight: 900;
        }

        .bac-branch-content p {
            margin: 5px 0 0;

            color: var(--text-soft);

            font-size: 11px;
            line-height: 1.7;
        }

        .bac-branch-check {
            width: 28px;
            height: 28px;

            flex-shrink: 0;

            display: grid;
            place-items: center;

            border: 2px solid #cbd5e1;
            border-radius: 50%;

            color: transparent;

            font-size: 13px;
            font-weight: 900;
        }

        .bac-branch.selected .bac-branch-check {
            border-color: var(--primary);
            background: var(--primary);
            color: white;
        }

        .bac-note {
            display: none;

            margin-top: 10px;

            text-align: center;

            color: var(--text-soft);

            font-size: 11px;
        }

        .bac-note.visible {
            display: block;
        }

        /* =========================
           ACTIONS
           ========================= */

        .levels-actions {
            margin-top: 20px;
        }

        .continue-level {
            width: 100%;
            min-height: 52px;
            font-size: 15px;
        }

        .continue-level:disabled {
            opacity: .5;
            cursor: not-allowed;
            transform: none;
        }

        .back-dashboard {
            width: 100%;
            margin-top: 10px;
        }

        .current-level-note {
            min-height: 22px;

            margin-top: 12px;

            text-align: center;

            color: var(--text-soft);

            font-size: 12px;
        }

        /* =========================
           FOOT NOTE
           ========================= */

        .levels-footer-note {
            margin: 22px auto 0;

            max-width: 650px;

            text-align: center;

            color: var(--text-soft);

            font-size: 11px;
            line-height: 1.8;
        }

        /* =========================
           DESKTOP
           ========================= */

        @media (min-width: 650px) {

            .levels-page {
                padding-top: 45px;
            }

            .level-options {
                grid-template-columns: repeat(3, 1fr);
            }

            .level-option {
                min-height: 285px;

                flex-direction: column;
                justify-content: center;

                padding: 25px 18px;

                text-align: center;
            }

            .level-option-icon {
                width: 72px;
                height: 72px;

                font-size: 25px;
            }

            .level-option-content h2 {
                margin-top: 2px;
                font-size: 20px;
            }

            .level-option-content p {
                margin-top: 9px;
            }

            .level-tag {
                margin-top: 11px;
            }

            .level-check {
                position: absolute;
                top: 14px;
                left: 14px;
            }

            .level-subject-summary {
                max-width: 100%;
            }

            .bac-branches {
                grid-template-columns: repeat(2, 1fr);
            }

            .bac-branch {
                min-height: 150px;

                flex-direction: column;
                justify-content: center;

                text-align: center;
            }

            .bac-branch-check {
                position: absolute;
                top: 14px;
                left: 14px;
            }
        }

        /* =========================
           SMALL PHONES
           ========================= */

        @media (max-width: 420px) {

            .levels-page {
                padding-top: 22px;
            }

            .teacher-intro {
                margin-bottom: 20px;
            }

            .teacher-avatar {
                width: 36px;
                height: 36px;
            }

            .levels-icon {
                width: 68px;
                height: 68px;

                border-radius: 21px;

                font-size: 27px;
            }

            .levels-hero {
                margin-bottom: 22px;
            }

            .levels-hero h1 {
                font-size: 27px;
            }

            .levels-hero p {
                font-size: 13px;
            }

            .level-option {
                min-height: 112px;

                padding: 15px;
                gap: 12px;
            }

            .level-option-icon {
                width: 54px;
                height: 54px;

                border-radius: 16px;

                font-size: 20px;
            }

            .level-option-content h2 {
                font-size: 17px;
            }

            .level-option-content p {
                font-size: 11px;
            }

            .bac-branch {
                min-height: 105px;
                padding: 14px;
            }

            .bac-branch-icon {
                width: 50px;
                height: 50px;
                border-radius: 15px;
            }
        }
    </style>
</head>

<body>

<header class="site-header">

    <div class="container header-inner">

        <button
            class="brand"
            onclick="goHome()"
            aria-label="الصفحة الرئيسية"
            data-level-aria="home">

            <span class="brand-icon">AI</span>
            <span>EduNova AI</span>

        </button>

        <button
            class="btn btn-secondary"
            onclick="goDashboard()"
            data-level-i18n="home">

            ← الرئيسية

        </button>

    </div>

</header>


<main class="page levels-page">

    <div class="container levels-wrapper">

        <!-- Teacher Identity -->

        <div class="teacher-intro">

            <div class="teacher-avatar">
                AI
            </div>

            <div class="teacher-intro-text">

                <strong>
                    Afkrash AI
                </strong>

                <span data-level-i18n="teacher_subtitle">
                    مدرسك الذكي في EduNova AI
                </span>

            </div>

        </div>


        <!-- Hero -->

        <section class="levels-hero">

            <div
                class="levels-icon"
                aria-hidden="true">
                ✦
            </div>

            <h1 data-level-i18n="levels_title">
                أين تبدأ <span>رحلتك؟</span>
            </h1>

            <p data-level-i18n="levels_description">
                اختر شهادتك الدراسية، وسنجهز لك الطريق المناسب
                للتعلم داخل EduNova AI مع Afkrash AI.
            </p>

        </section>


        <!-- Certificates -->

        <section
            class="level-options"
            aria-label="الشهادات الدراسية"
            data-level-aria="levels_certificates">


            <!-- 6AF / CONCOURS -->

            <button
                class="level-option"
                data-level="concours"
                onclick="selectLevel('concours', this)"
                type="button">

                <div class="level-option-icon">
                    6
                </div>

                <div class="level-option-content">

                    <h2 data-level-i18n="concours_title">
                        كونكور
                    </h2>

                    <p data-level-i18n="concours_description">
                        مسار 6AF للتحضير للمسابقة،
                        مع جميع المواد الأساسية.
                    </p>

                    <span
                        class="level-tag"
                        data-level-i18n="concours_tag">
                        6AF
                    </span>

                </div>

                <span class="level-check">
                    ✓
                </span>

            </button>


            <!-- 4EME / BREVET -->

            <button
                class="level-option"
                data-level="brevet"
                onclick="selectLevel('brevet', this)"
                type="button">

                <div class="level-option-icon">
                    4
                </div>

                <div class="level-option-content">

                    <h2 data-level-i18n="brevet_title">
                        بريڤي
                    </h2>

                    <p data-level-i18n="brevet_description">
                        مسار 4ème للتحضير للـ Brevet
                        عبر المواد الأساسية.
                    </p>

                    <span
                        class="level-tag"
                        data-level-i18n="brevet_tag">
                        4ème
                    </span>

                </div>

                <span class="level-check">
                    ✓
                </span>

            </button>


            <!-- BAC -->

            <button
                class="level-option"
                data-level="bac"
                onclick="selectLevel('bac', this)"
                type="button">

                <div class="level-option-icon">
                    B
                </div>

                <div class="level-option-content">

                    <h2 data-level-i18n="bac_title">
                        باكالوريا
                    </h2>

                    <p data-level-i18n="bac_description">
                        اختر شعبة البكالوريا للوصول
                        إلى البرنامج الدراسي الصحيح.
                    </p>

                    <span
                        class="level-tag"
                        data-level-i18n="bac_tag">
                        Baccalauréat
                    </span>

                </div>

                <span class="level-check">
                    ✓
                </span>

            </button>

        </section>


        <!-- Subject Count Summary -->

        <div
            id="levelSubjectSummary"
            class="level-subject-summary">

            <p
                id="summaryTitle"
                class="summary-title">
            </p>

            <div class="subject-count">

                <span id="summaryDescription">
                </span>

                <strong id="subjectCount">
                    0
                </strong>

            </div>

        </div>


        <!-- Bac Branches -->

        <section
            id="bacBranches"
            class="bac-branches"
            aria-label="شعبة البكالوريا"
            data-level-aria="bac_branches">


            <!-- BAC C -->

            <button
                class="bac-branch"
                data-branch="C"
                onclick="selectBacBranch('C', this)"
                type="button">

                <div class="bac-branch-icon">
                    C
                </div>

                <div class="bac-branch-content">

                    <h3>
                        Bac C
                    </h3>

                    <p data-level-i18n="bac_c_description">
                        المسار الدراسي الخاص بشعبة
                        البكالوريا C.
                    </p>

                </div>

                <span class="bac-branch-check">
                    ✓
                </span>

            </button>


            <!-- BAC D -->

            <button
                class="bac-branch"
                data-branch="D"
                onclick="selectBacBranch('D', this)"
                type="button">

                <div class="bac-branch-icon">
                    D
                </div>

                <div class="bac-branch-content">

                    <h3>
                        Bac D
                    </h3>

                    <p data-level-i18n="bac_d_description">
                        المسار الدراسي الخاص بشعبة
                        البكالوريا D.
                    </p>

                </div>

                <span class="bac-branch-check">
                    ✓
                </span>

            </button>

        </section>


        <div
            id="bacNote"
            class="bac-note"
            data-level-i18n="bac_note">

            اختر Bac C أو Bac D لأن لكل شعبة برنامجها الدراسي الخاص.

        </div>


        <!-- Actions -->

        <section class="levels-actions">

            <button
                id="continueButton"
                class="btn btn-primary continue-level"
                onclick="continueToLibrary()"
                disabled
                type="button">

                اختر مستواك للمتابعة

            </button>


            <button
                class="btn btn-secondary back-dashboard"
                onclick="goDashboard()"
                type="button"
                data-level-i18n="back_to_dashboard">

                العودة إلى لوحة الطالب

            </button>


            <div
                id="currentLevelNote"
                class="current-level-note">
            </div>

        </section>


        <p
            class="levels-footer-note"
            data-level-i18n="levels_footer">

            اختر مسارك أولًا، ثم ستجد داخل مكتبك الدراسي
            المواد والفصول والدروس الخاصة بمستواك.
        </p>

    </div>

</main>

            bac_branches:
                "Séries du baccalauréat",

            bac_c_description:
                "Parcours scolaire de la série Baccalauréat C.",

            bac_d_description:
                "Parcours scolaire de la série Baccalauréat D.",

            bac_note:
                "Choisissez Bac C ou Bac D car chaque série possède son propre programme.",

            select_level_continue:
                "Choisissez votre niveau pour continuer",

            select_bac_branch:
                "Choisissez Bac C ou Bac D",

            continue_bac:
                "Continuer avec Bac ",

            continue_with:
                "Continuer avec ",

            back_to_dashboard:
                "Retour au tableau de bord",

            current_level:
                "Niveau sélectionné : ",

            bac_choose_branch:
                "Niveau sélectionné : Baccalauréat — choisissez la série",

            current_bac:
                "Niveau sélectionné : Baccalauréat ",

            subjects_available:
                "Nombre de matières disponibles dans ce parcours :",

            subjects_label:
                "matières",

            levels_footer:
                "Choisissez d’abord votre parcours, puis vous trouverez dans votre espace les matières, chapitres et cours correspondant à votre niveau."

        }

    };


    /* =========================================================
       LANGUAGE
       ========================================================= */

    function getPageLanguage() {

        if (typeof getSiteLanguage === "function") {

            return getSiteLanguage() === "fr"
                ? "fr"
                : "ar";

        }

        return localStorage.getItem(
            "site_language"
        ) === "fr"
            ? "fr"
            : "ar";
    }


    /* =========================================================
       CENTRAL STRUCTURE HELPERS
       ========================================================= */

    function getSubjectsCount() {

        if (!selectedLevel) {
            return 0;
        }

        if (
            typeof getAvailableSubjects !== "function"
        ) {
            return 0;
        }

        const subjects =
            getAvailableSubjects(
                selectedLevel,
                selectedBacBranch
            );

        return Array.isArray(subjects)
            ? subjects.length
            : 0;
    }


    function getSelectedLevelLabel() {

        if (
            typeof getLevelLabel === "function"
        ) {

            return getLevelLabel(
                selectedLevel
            );

        }

        return selectedLevel || "";
    }


    /* =========================================================
       APPLY PAGE LANGUAGE
       ========================================================= */

    function applyLevelsLanguage() {

        const language =
            getPageLanguage();

        const translations =
            LEVEL_TRANSLATIONS[language];


        /*
         * Page-specific text
         */

        document
            .querySelectorAll(
                "[data-level-i18n]"
            )
            .forEach(element => {

                const key =
                    element.getAttribute(
                        "data-level-i18n"
                    );

                if (
                    translations[key] !== undefined
                ) {

                    element.innerHTML =
                        translations[key];

                }

            });


        /*
         * Page-specific aria labels
         */

        document
            .querySelectorAll(
                "[data-level-aria]"
            )
            .forEach(element => {

                const key =
                    element.getAttribute(
                        "data-level-aria"
                    );

                if (
                    translations[key] !== undefined
                ) {

                    element.setAttribute(
                        "aria-label",
                        translations[key]
                    );

                }

            });


        /*
         * Document direction
         */

        document.documentElement.lang =
            language;

        document.documentElement.dir =
            language === "fr"
                ? "ltr"
                : "rtl";


        /*
         * Page title
         */

        document.title =
            language === "fr"
                ? "Choix du niveau | EduNova AI"
                : "اختيار المستوى | EduNova AI";


        updateContinueButton();
        updateCurrentLevelNote();
        updateSubjectSummary();

    }


    /* =========================================================
       SELECT LEVEL
       ========================================================= */

    function selectLevel(
        level,
        element
    ) {

        if (
            typeof getLevelDefinition ===
            "function" &&
            !getLevelDefinition(level)
        ) {
            return;
        }


        selectedLevel =
            level;


        /*
         * Central source of truth
         */

        if (
            typeof setStudentLevel ===
            "function"
        ) {

            setStudentLevel(level);

        } else {

            localStorage.setItem(
                "student_level",
                level
            );

        }


        /*
         * If not Bac, remove branch
         */

        if (level !== "bac") {

            selectedBacBranch = null;

            if (
                typeof setBacBranch ===
                "function"
            ) {

                setBacBranch(null);

            } else {

                localStorage.removeItem(
                    "bac_branch"
                );

            }

            document
                .querySelectorAll(
                    ".bac-branch"
                )
                .forEach(option => {

                    option.classList.remove(
                        "selected"
                    );

                });

        }


        /*
         * Highlight certificate
         */

        document
            .querySelectorAll(
                ".level-option"
            )
            .forEach(option => {

                option.classList.remove(
                    "selected"
                );

            });


        if (element) {

            element.classList.add(
                "selected"
            );

        }


        /*
         * Bac requires branch
         */

        const bacBranches =
            document.getElementById(
                "bacBranches"
            );

        const bacNote =
            document.getElementById(
                "bacNote"
            );


        if (level === "bac") {

            bacBranches.classList.add(
                "visible"
            );

            bacNote.classList.add(
                "visible"
            );

        } else {

            bacBranches.classList.remove(
                "visible"
            );

            bacNote.classList.remove(
                "visible"
            );

        }


        updateContinueButton();
        updateCurrentLevelNote();
        updateSubjectSummary();

    }


    /* =========================================================
       SELECT BAC BRANCH
       ========================================================= */

    function selectBacBranch(
        branch,
        element
    ) {

        if (
            branch !== "C" &&
            branch !== "D"
        ) {
            return;
        }


        if (
            selectedLevel !== "bac"
        ) {

            return;

        }


        selectedBacBranch =
            branch;


        document
            .querySelectorAll(
                ".bac-branch"
            )
            .forEach(option => {

                option.classList.remove(
                    "selected"
                );

            });


        if (element) {

            element.classList.add(
                "selected"
            );

        }


        /*
         * Central source of truth
         */

        if (
            typeof setBacBranch ===
            "function"
        ) {

            setBacBranch(branch);

        } else {

            localStorage.setItem(
                "bac_branch",
                branch
            );

        }


        updateContinueButton();
        updateCurrentLevelNote();
        updateSubjectSummary();

    }


    /* =========================================================
       SUBJECT SUMMARY
       ========================================================= */

    function updateSubjectSummary() {

        const summary =
            document.getElementById(
                "levelSubjectSummary"
            );

        const title =
            document.getElementById(
                "summaryTitle"
            );

        const description =
            document.getElementById(
                "summaryDescription"
            );

        const count =
            document.getElementById(
                "subjectCount"
            );


        if (
            !summary ||
            !title ||
            !description ||
            !count
        ) {

            return;

        }


        /*
         * No level
         */

        if (!selectedLevel) {

            summary.classList.remove(
                "visible"
            );

            return;

        }


        /*
         * Bac requires C/D
         */

        if (
            selectedLevel === "bac" &&
            !selectedBacBranch
        ) {

            summary.classList.remove(
                "visible"
            );

            return;

        }


        const language =
            getPageLanguage();

        const t =
            LEVEL_TRANSLATIONS[
                language
            ];


        const subjectCount =
            getSubjectsCount();


        if (!subjectCount) {

            summary.classList.remove(
                "visible"
            );

            return;

        }


        summary.classList.add(
            "visible"
        );


        title.textContent =
            getSelectedLevelLabel();


        description.textContent =
            t.subjects_available;


        count.textContent =
            subjectCount +
            " " +
            t.subjects_label;

    }


    /* =========================================================
       CONTINUE BUTTON
       ========================================================= */

    function updateContinueButton() {

        const button =
            document.getElementById(
                "continueButton"
            );

        if (!button) {
            return;
        }


        const language =
            getPageLanguage();

        const t =
            LEVEL_TRANSLATIONS[
                language
            ];


        /*
         * No level
         */

        if (!selectedLevel) {

            button.disabled = true;

            button.textContent =
                t.select_level_continue;

            return;

        }


        /*
         * Bac without branch
         */

        if (
            selectedLevel === "bac" &&
            !selectedBacBranch
        ) {

            button.disabled = true;

            button.textContent =
                t.select_bac_branch;

            return;

        }


        /*
         * Ready
         */

        button.disabled = false;


        if (
            selectedLevel === "bac"
        ) {

            button.textContent =
                t.continue_bac +
                selectedBacBranch;

        } else {

            button.textContent =
                t.continue_with +
                getSelectedLevelLabel();

        }

    }


    /* =========================================================
       CURRENT LEVEL NOTE
       ========================================================= */

    function updateCurrentLevelNote() {

        const note =
            document.getElementById(
                "currentLevelNote"
            );

        if (!note) {
            return;
        }


        const language =
            getPageLanguage();

        const t =
            LEVEL_TRANSLATIONS[
                language
            ];


        if (!selectedLevel) {

            note.textContent = "";

            return;

        }


        if (
            selectedLevel === "bac"
        ) {

            if (!selectedBacBranch) {

                note.textContent =
                    t.bac_choose_branch;

            } else {

                note.textContent =
                    t.current_bac +
                    selectedBacBranch;

            }

            return;

        }


        note.textContent =
            t.current_level +
            getSelectedLevelLabel();

    }


    /* =========================================================
       CONTINUE TO LIBRARY
       ========================================================= */

    function continueToLibrary() {

        if (!selectedLevel) {
            return;
        }


        /*
         * Bac must have branch
         */

        if (
            selectedLevel === "bac" &&
            !selectedBacBranch
        ) {

            return;

        }


        /*
         * Save through central system
         */

        if (
            typeof setStudentLevel ===
            "function"
        ) {

            setStudentLevel(
                selectedLevel
            );

        } else {

            localStorage.setItem(
                "student_level",
                selectedLevel
            );

        }


        if (
            selectedLevel === "bac"
        ) {

            if (
                typeof setBacBranch ===
                "function"
            ) {

                setBacBranch(
                    selectedBacBranch
                );

            } else {

                localStorage.setItem(
                    "bac_branch",
                    selectedBacBranch
                );

            }

        } else {

            if (
                typeof setBacBranch ===
                "function"
            ) {

                setBacBranch(null);

            } else {

                localStorage.removeItem(
                    "bac_branch"
                );

            }

        }


        /*
         * Clear previous learning selection.
         * The library will start the subject flow.
         */

        if (
            typeof clearSelectedLearningAfterLevelChange ===
            "function"
        ) {

            clearSelectedLearningAfterLevelChange();

        }


        window.location.href =
            "library.html";

    }


    /* =========================================================
       LOAD SAVED STATE
       ========================================================= */

    function loadSavedLevel() {

        let savedLevel = null;


        if (
            typeof getStudentLevel ===
            "function"
        ) {

            savedLevel =
                getStudentLevel();

        } else {

            savedLevel =
                localStorage.getItem(
                    "student_level"
                );

        }


        if (
            !savedLevel
        ) {

            updateContinueButton();
            updateCurrentLevelNote();
            updateSubjectSummary();

            return;

        }


        const levelElement =
            document.querySelector(
                `[data-level="${savedLevel}"]`
            );


        if (!levelElement) {
            return;
        }


        selectedLevel =
            savedLevel;


        levelElement.classList.add(
            "selected"
        );


        /*
         * Restore Bac branch
         */

        if (
            savedLevel === "bac"
        ) {

            const branches =
                document.getElementById(
                    "bacBranches"
                );

            const note =
                document.getElementById(
                    "bacNote"
                );


            branches.classList.add(
                "visible"
            );

            note.classList.add(
                "visible"
            );


            let savedBranch = null;


            if (
                typeof getBacBranch ===
                "function"
            ) {

                savedBranch =
                    getBacBranch();

            } else {

                savedBranch =
                    localStorage.getItem(
                        "bac_branch"
                    );

            }


            if (
                savedBranch === "C" ||
                savedBranch === "D"
            ) {

                selectedBacBranch =
                    savedBranch;


                const branchElement =
                    document.querySelector(
                        `[data-branch="${savedBranch}"]`
                    );


                if (branchElement) {

                    branchElement.classList.add(
                        "selected"
                    );

                }

            }

        }


        updateContinueButton();
        updateCurrentLevelNote();
        updateSubjectSummary();

    }


    /* =========================================================
       NAVIGATION
       ========================================================= */

    function goDashboard() {

        if (
            typeof goTo ===
            "function"
        ) {

            goTo(
                "dashboard.html"
            );

            return;

        }


        window.location.href =
            "dashboard.html";

    }


    function goHome() {

        if (
            typeof goTo ===
            "function"
        ) {

            goTo(
                "index.html"
            );

            return;

        }


        window.location.href =
            "index.html";

    }


    /* =========================================================
       GLOBAL INITIALIZATION
       ========================================================= */

    document.addEventListener(
        "DOMContentLoaded",
        function () {

            /*
             * Initialize global theme/language
             */

            if (
                typeof initializeGlobalSettings ===
                "function"
            ) {

                initializeGlobalSettings();

            }


            /*
             * Restore saved state
             */

            loadSavedLevel();


            /*
             * Apply page language
             */

            applyLevelsLanguage();

        }
    );


    /* =========================================================
       CENTRAL EVENTS
       ========================================================= */

    window.addEventListener(
        "languageChanged",
        function () {

            applyLevelsLanguage();

        }
    );


    window.addEventListener(
        "siteLanguageChanged",
        function () {

            applyLevelsLanguage();

        }
    );


    window.addEventListener(
        "studentLevelChanged",
        function () {

            updateContinueButton();
            updateCurrentLevelNote();
            updateSubjectSummary();

        }
    );


    window.addEventListener(
        "bacBranchChanged",
        function () {

            updateContinueButton();
            updateCurrentLevelNote();
            updateSubjectSummary();

        }
    );


    /* =========================================================
       STORAGE SYNC
       ========================================================= */

    window.addEventListener(
        "storage",
        function (event) {

            if (
                event.key ===
                "site_language"
            ) {

                applyLevelsLanguage();

            }


            if (
                event.key ===
                "site_theme"
            ) {

                if (
                    typeof applySiteTheme ===
                    "function"
                ) {

                    applySiteTheme(
                        event.newValue ||
                        "light"
                    );

                }

            }


            if (
                event.key ===
                "student_level"
            ) {

                loadSavedLevel();

            }


            if (
                event.key ===
                "bac_branch"
            ) {

                loadSavedLevel();

            }

        }
    );

</script>

</body>
