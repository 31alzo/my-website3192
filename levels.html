<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>اختيار المستوى | عالم شيخ الأساتذة</title>

    <link rel="stylesheet" href="style.css">

    <style>
        /* =========================
           LEVELS PAGE
           ========================= */

        .levels-page {
            min-height: calc(100vh - 70px);
            padding: 32px 0 60px;
            display: flex;
            align-items: center;
        }

        .levels-wrapper {
            width: 100%;
            max-width: 900px;
            margin: auto;
        }

        /* =========================
           IDENTITY
           ========================= */

        .teacher-intro {
            display: flex;
            align-items: center;
            gap: 14px;
            width: fit-content;
            max-width: 100%;
            margin: 0 auto 24px;
            padding: 9px 14px;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: var(--surface);
            box-shadow: var(--shadow-sm);
        }

        .teacher-avatar {
            width: 40px;
            height: 40px;
            flex-shrink: 0;
            display: grid;
            place-items: center;
            border-radius: 50%;
            background: linear-gradient(
                135deg,
                var(--primary),
                var(--accent)
            );
            color: white;
            font-size: 19px;
            font-weight: 900;
        }

        .teacher-intro-text {
            text-align: right;
            line-height: 1.35;
        }

        .teacher-intro-text strong {
            display: block;
            font-size: 13px;
            font-weight: 850;
        }

        .teacher-intro-text span {
            display: block;
            margin-top: 2px;
            color: var(--text-soft);
            font-size: 11px;
        }

        /* =========================
           HERO
           ========================= */

        .levels-hero {
            text-align: center;
            margin-bottom: 30px;
        }

        .levels-icon {
            width: 78px;
            height: 78px;
            margin: 0 auto 17px;

            display: grid;
            place-items: center;

            border-radius: 24px;

            background:
                linear-gradient(
                    135deg,
                    var(--primary-light),
                    #f5f3ff
                );

            border: 1px solid var(--border);
            box-shadow: var(--shadow-md);

            font-size: 34px;
        }

        .levels-hero h1 {
            margin: 0;

            font-size: clamp(28px, 6vw, 40px);
            line-height: 1.25;
            font-weight: 900;

            letter-spacing: -.5px;
        }

        .levels-hero h1 span {
            color: var(--primary);
        }

        .levels-hero p {
            max-width: 620px;

            margin: 11px auto 0;

            color: var(--text-soft);

            font-size: 14px;
            line-height: 1.9;
        }

        /* =========================
           LEVEL CARDS
           ========================= */

        .level-options {
            display: grid;
            gap: 15px;
        }

        .level-option {
            position: relative;

            width: 100%;
            min-height: 126px;

            padding: 19px;

            display: flex;
            align-items: center;
            gap: 15px;

            text-align: right;

            background: var(--surface);
            border: 2px solid var(--border);
            border-radius: var(--radius-lg);

            cursor: pointer;

            transition:
                transform .2s ease,
                border-color .2s ease,
                box-shadow .2s ease,
                background .2s ease;
        }

        .level-option:hover {
            transform: translateY(-3px);
            border-color: #93c5fd;
            box-shadow: var(--shadow-md);
        }

        .level-option:active {
            transform: scale(.985);
        }

        .level-option.selected {
            border-color: var(--primary);

            background:
                linear-gradient(
                    135deg,
                    var(--surface),
                    var(--primary-light)
                );

            box-shadow:
                0 0 0 4px rgba(37, 99, 235, .08),
                var(--shadow-md);
        }

        .level-option-icon {
            width: 62px;
            height: 62px;

            flex-shrink: 0;

            display: grid;
            place-items: center;

            border-radius: 19px;

            background: var(--primary-light);

            font-size: 29px;

            transition: transform .2s ease;
        }

        .level-option:hover .level-option-icon {
            transform: scale(1.06);
        }

        .level-option.selected .level-option-icon {
            background: var(--primary);
            color: white;
        }

        .level-option-content {
            min-width: 0;
            flex: 1;
        }

        .level-option-content h2 {
            margin: 0;

            font-size: 19px;
            font-weight: 900;
        }

        .level-option-content p {
            margin: 6px 0 0;

            color: var(--text-soft);

            font-size: 12px;
            line-height: 1.7;
        }

        .level-tag {
            display: inline-flex;
            align-items: center;

            margin-top: 7px;
            padding: 3px 8px;

            border-radius: 999px;

            background: var(--primary-light);
            color: var(--primary);

            font-size: 10px;
            font-weight: 800;
        }

        .level-check {
            width: 29px;
            height: 29px;

            flex-shrink: 0;

            display: grid;
            place-items: center;

            border: 2px solid #cbd5e1;
            border-radius: 50%;

            color: transparent;

            font-size: 14px;
            font-weight: 900;

            transition: .2s ease;
        }

        .level-option.selected .level-check {
            border-color: var(--primary);
            background: var(--primary);
            color: white;
            transform: scale(1.05);
        }

        /* =========================
           ACTIONS
           ========================= */

        .levels-actions {
            margin-top: 20px;
        }

        .continue-level {
            width: 100%;
            min-height: 52px;
            font-size: 15px;
        }

        .continue-level:disabled {
            opacity: .5;
            cursor: not-allowed;
            transform: none;
        }

        .back-dashboard {
            width: 100%;
            margin-top: 10px;
        }

        .current-level-note {
            min-height: 22px;

            margin-top: 12px;

            text-align: center;

            color: var(--text-soft);

            font-size: 12px;
        }

        /* =========================
           FOOT NOTE
           ========================= */

        .levels-footer-note {
            margin: 22px auto 0;

            max-width: 620px;

            text-align: center;

            color: var(--text-soft);

            font-size: 11px;
            line-height: 1.8;
        }

        /* =========================
           DESKTOP
           ========================= */

        @media (min-width: 650px) {

            .levels-page {
                padding-top: 45px;
            }

            .level-options {
                grid-template-columns: repeat(3, 1fr);
            }

            .level-option {
                min-height: 285px;

                flex-direction: column;
                justify-content: center;

                padding: 25px 18px;

                text-align: center;
            }

            .level-option-icon {
                width: 72px;
                height: 72px;
                font-size: 33px;
            }

            .level-option-content h2 {
                margin-top: 2px;
                font-size: 20px;
            }

            .level-option-content p {
                margin-top: 9px;
            }

            .level-tag {
                margin-top: 11px;
            }

            .level-check {
                position: absolute;
                top: 14px;
                left: 14px;
            }
        }

        /* =========================
           SMALL PHONES
           ========================= */

        @media (max-width: 420px) {

            .levels-page {
                padding-top: 22px;
            }

            .teacher-intro {
                margin-bottom: 20px;
            }

            .teacher-avatar {
                width: 36px;
                height: 36px;
            }

            .levels-icon {
                width: 68px;
                height: 68px;
                border-radius: 21px;
                font-size: 29px;
            }

            .levels-hero {
                margin-bottom: 22px;
            }

            .levels-hero h1 {
                font-size: 27px;
            }

            .levels-hero p {
                font-size: 13px;
            }

            .level-option {
                min-height: 112px;
                padding: 15px;
                gap: 12px;
            }

            .level-option-icon {
                width: 54px;
                height: 54px;
                border-radius: 16px;
                font-size: 25px;
            }

            .level-option-content h2 {
                font-size: 17px;
            }

            .level-option-content p {
                font-size: 11px;
            }
        }
    </style>
</head>

<body>

<header class="site-header">

    <div class="container header-inner">

        <button
            class="brand"
            onclick="goHome()"
            aria-label="الصفحة الرئيسية">

            <span class="brand-icon">AI</span>

            <span>عالم شيخ الأساتذة</span>

        </button>

        <button
            class="btn btn-secondary"
            onclick="goDashboard()">

            ← الرئيسية

        </button>

    </div>

</header>


<main class="page levels-page">

    <div class="container levels-wrapper">


        <!-- Teacher Identity -->

        <div class="teacher-intro">

            <div class="teacher-avatar">
                AI
            </div>

            <div class="teacher-intro-text">

                <strong>
                    شيخ الأساتذة
                </strong>

                <span>
                    الأستاذ AI — معك خطوة بخطوة
                </span>

            </div>

        </div>


        <!-- Hero -->

        <section class="levels-hero">

            <div class="levels-icon">
                🎓
            </div>

            <h1>
                أين تبدأ <span>رحلتك؟</span>
            </h1>

            <p>
                اختر مستواك الدراسي، وسنجهز لك
                الطريق المناسب للدروس والتمارين
                والمراجعة داخل عالم شيخ الأساتذة.
            </p>

        </section>


        <!-- Levels -->

        <section
            class="level-options"
            aria-label="المستويات الدراسية">


            <!-- Concours -->

            <button
                class="level-option"
                data-level="concours"
                onclick="selectLevel('concours', this)"
                type="button">

                <div class="level-option-icon">
                    🏆
                </div>

                <div class="level-option-content">

                    <h2>
                        كونكور
                    </h2>

                    <p>
                        التحضير للمسابقة والاختبارات
                        مع دروس وتمارين مركزة.
                    </p>

                    <span class="level-tag">
                        مسابقة
                    </span>

                </div>

                <span class="level-check">
                    ✓
                </span>

            </button>


            <!-- Brevet -->

            <button
                class="level-option"
                data-level="brevet"
                onclick="selectLevel('brevet', this)"
                type="button">

                <div class="level-option-icon">
                    📘
                </div>

                <div class="level-option-content">

                    <h2>
                        بريڤي
                    </h2>

                    <p>
                        دروس وتمارين تساعدك على بناء
                        أساس قوي والاستعداد للشهادة.
                    </p>

                    <span class="level-tag">
                        شهادة ختم الدروس
                    </span>

                </div>

                <span class="level-check">
                    ✓
                </span>

            </button>


            <!-- Bac -->

            <button
                class="level-option"
                data-level="bac"
                onclick="selectLevel('bac', this)"
                type="button">

                <div class="level-option-icon">
                    🎓
                </div>

                <div class="level-option-content">

                    <h2>
                        باكالوريا
                    </h2>

                    <p>
                        دروس وتمارين ومراجعة منظمة
                        للاستعداد للباكالوريا.
                    </p>

                    <span class="level-tag">
                        باكالوريا
                    </span>

                </div>

                <span class="level-check">
                    ✓
                </span>

            </button>


        </section>


        <!-- Actions -->

        <section class="levels-actions">

            <button
                id="continueButton"
                class="btn btn-primary continue-level"
                onclick="continueToLibrary()"
                disabled
                type="button">

                اختر مستواك للمتابعة

            </button>


            <button
                class="btn btn-secondary back-dashboard"
                onclick="goDashboard()"
                type="button">

                العودة إلى لوحة الطالب

            </button>


            <div
                id="currentLevelNote"
                class="current-level-note">
            </div>

        </section>


        <p class="levels-footer-note">

            شيخ الأساتذة لا يختار عنك طريقك،
            بل يساعدك على السير فيه بثبات.
            اختر مستواك ولنبدأ.

        </p>


    </div>

</main>


<script>

    let selectedLevel = null;


    /* =========================
       LEVEL NAMES
       ========================= */

    const levelNames = {

        concours: "كونكور",

        brevet: "بريڤي",

        bac: "باكالوريا"

    };


    /* =========================
       SELECT LEVEL
       ========================= */

    function selectLevel(level, element) {

        selectedLevel = level;


        document
            .querySelectorAll(".level-option")
            .forEach(option => {

                option.classList.remove("selected");

            });


        element.classList.add("selected");


        const button =
            document.getElementById("continueButton");


        button.disabled = false;

        button.textContent =
            "متابعة مع " +
            levelNames[level];


        document.getElementById(
            "currentLevelNote"
        ).textContent =
            "المستوى المحدد: " +
            levelNames[level];

    }


    /* =========================
       CONTINUE
       ========================= */

    function continueToLibrary() {

        if (!selectedLevel) {
            return;
        }


        localStorage.setItem(
            "student_level",
            selectedLevel
        );


        window.location.href =
            "library.html";

    }


    /* =========================
       LOAD SAVED LEVEL
       ========================= */

    function loadSavedLevel() {

        const saved =
            localStorage.getItem(
                "student_level"
            );


        if (!saved) {
            return;
        }


        const option =
            document.querySelector(
                `[data-level="${saved}"]`
            );


        if (!option) {
            return;
        }


        selectLevel(
            saved,
            option
        );

    }


    /* =========================
       NAVIGATION
       ========================= */

    function goDashboard() {

        window.location.href =
            "dashboard.html";

    }


    function goHome() {

        window.location.href =
            "index.html";

    }


    /* =========================
       START
       ========================= */

    loadSavedLevel();

</script>

</body>
    </html>
