<!DOCTYPE html><html lang="ar" dir="rtl"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><title>اختيار المستوى | عالم شيخ الأساتذة</title>

<link rel="stylesheet" href="style.css">

<style>
    .levels-page {
        min-height: calc(100vh - 70px);
        display: flex;
        align-items: center;
    }

    .levels-wrapper {
        width: 100%;
        max-width: 760px;
        margin: auto;
    }

    .levels-hero {
        text-align: center;
        margin-bottom: 28px;
    }

    .levels-icon {
        width: 70px;
        height: 70px;

        margin: 0 auto 16px;

        display: grid;
        place-items: center;

        border-radius: 22px;

        background: var(--primary-light);
        color: var(--primary);

        font-size: 31px;

        box-shadow: var(--shadow-sm);
    }

    .levels-hero h1 {
        margin: 0;

        font-size: clamp(25px, 6vw, 34px);
        font-weight: 850;
    }

    .levels-hero p {
        max-width: 560px;

        margin: 9px auto 0;

        color: var(--text-soft);

        font-size: 14px;
        line-height: 1.8;
    }

    .level-options {
        display: grid;
        gap: 14px;
    }

    .level-option {
        position: relative;

        width: 100%;

        padding: 20px;

        display: flex;
        align-items: center;

        gap: 16px;

        text-align: right;

        background: var(--surface);

        border: 2px solid var(--border);

        border-radius: var(--radius-lg);

        cursor: pointer;

        transition:
            transform var(--transition),
            border-color var(--transition),
            box-shadow var(--transition),
            background var(--transition);
    }

    .level-option:hover {
        transform: translateY(-2px);

        border-color: #bfdbfe;

        box-shadow: var(--shadow-md);
    }

    .level-option:active {
        transform: scale(.99);
    }

    .level-option.selected {
        border-color: var(--primary);

        background: #f8fbff;

        box-shadow:
            0 0 0 3px rgba(37, 99, 235, .08);
    }

    .level-option-icon {
        width: 58px;
        height: 58px;

        flex-shrink: 0;

        display: grid;
        place-items: center;

        border-radius: 17px;

        background: var(--primary-light);

        font-size: 27px;
    }

    .level-option-content {
        min-width: 0;
        flex: 1;
    }

    .level-option-content h2 {
        margin: 0;

        font-size: 18px;
        font-weight: 850;
    }

    .level-option-content p {
        margin: 5px 0 0;

        color: var(--text-soft);

        font-size: 12px;
        line-height: 1.6;
    }

    .level-check {
        width: 27px;
        height: 27px;

        flex-shrink: 0;

        display: grid;
        place-items: center;

        border: 2px solid #cbd5e1;

        border-radius: 50%;

        color: transparent;

        font-size: 14px;
        font-weight: 900;
    }

    .level-option.selected .level-check {
        border-color: var(--primary);

        background: var(--primary);

        color: white;
    }

    .levels-actions {
        margin-top: 20px;
    }

    .continue-level {
        width: 100%;
    }

    .continue-level:disabled {
        opacity: .5;
        cursor: not-allowed;
        transform: none;
    }

    .back-dashboard {
        width: 100%;

        margin-top: 10px;
    }

    .current-level-note {
        min-height: 20px;

        margin-top: 12px;

        text-align: center;

        color: var(--text-soft);

        font-size: 12px;
    }

    @media (min-width: 650px) {

        .level-options {
            grid-template-columns: repeat(3, 1fr);
        }

        .level-option {
            min-height: 235px;

            flex-direction: column;

            justify-content: center;

            text-align: center;

            padding: 22px 15px;
        }

        .level-option-content p {
            margin-top: 8px;
        }

        .level-check {
            position: absolute;

            top: 14px;
            left: 14px;
        }
    }
</style>

</head><body><!-- Header -->

<header class="site-header">

    <div class="container header-inner">

        <button
            class="brand"
            onclick="goHome()"
            aria-label="الصفحة الرئيسية">

            <span class="brand-icon">
                AI
            </span>

            <span>
                عالم شيخ الأساتذة
            </span>

        </button>

        <button
            class="btn btn-secondary"
            onclick="goDashboard()">

            ← الرئيسية

        </button>

    </div>

</header>


<main class="page levels-page">

    <div class="container levels-wrapper">


        <!-- Hero -->

        <section class="levels-hero">

            <div class="levels-icon">
                🎓
            </div>

            <h1>
                اختر مستواك الدراسي
            </h1>

            <p>
                اختر المستوى الذي تستعد له حتى نتمكن
                من عرض المحتوى المناسب لك.
            </p>

        </section>


        <!-- Levels -->

        <section
            class="level-options"
            aria-label="المستويات الدراسية">


            <!-- Concours -->

            <button
                class="level-option"
                data-level="concours"
                onclick="selectLevel('concours', this)">

                <div class="level-option-icon">
                    🏆
                </div>

                <div class="level-option-content">

                    <h2>
                        كونكور
                    </h2>

                    <p>
                        التحضير لمسابقة الكونكور
                        والاختبارات المرتبطة بها.
                    </p>

                </div>

                <span class="level-check">
                    ✓
                </span>

            </button>


            <!-- Brevet -->

            <button
                class="level-option"
                data-level="brevet"
                onclick="selectLevel('brevet', this)">

                <div class="level-option-icon">
                    📘
                </div>

                <div class="level-option-content">

                    <h2>
                        بريڤي
                    </h2>

                    <p>
                        دروس وتمارين تساعدك على
                        الاستعداد لشهادة ختم الدروس.
                    </p>

                </div>

                <span class="level-check">
                    ✓
                </span>

            </button>


            <!-- Bac -->

            <button
                class="level-option"
                data-level="bac"
                onclick="selectLevel('bac', this)">

                <div class="level-option-icon">
                    🎓
                </div>

                <div class="level-option-content">

                    <h2>
                        باكالوريا
                    </h2>

                    <p>
                        التحضير للباكالوريا مع الدروس
                        والتمارين والمراجعة.
                    </p>

                </div>

                <span class="level-check">
                    ✓
                </span>

            </button>


        </section>


        <!-- Actions -->

        <section class="levels-actions">

            <button
                id="continueButton"
                class="btn btn-primary continue-level"
                onclick="continueToLibrary()"
                disabled>

                اختر مستوى للمتابعة

            </button>


            <button
                class="btn btn-secondary back-dashboard"
                onclick="goDashboard()">

                العودة إلى لوحة الطالب

            </button>


            <div
                id="currentLevelNote"
                class="current-level-note">
            </div>

        </section>


    </div>

</main>


<script>

    let selectedLevel = null;


    /* =========================
       LEVEL NAMES
       ========================= */

    const levelNames = {

        concours: "كونكور",

        brevet: "بريڤي",

        bac: "باكالوريا"

    };


    /* =========================
       SELECT LEVEL
       ========================= */

    function selectLevel(level, element) {

        selectedLevel = level;


        document
            .querySelectorAll(".level-option")
            .forEach(option => {

                option.classList.remove(
                    "selected"
                );

            });


        element.classList.add(
            "selected"
        );


        const button =
            document.getElementById(
                "continueButton"
            );


        button.disabled = false;

        button.textContent =
            "متابعة مع " +
            levelNames[level];


        document.getElementById(
            "currentLevelNote"
        ).textContent =
            "المستوى المحدد: " +
            levelNames[level];

    }


    /* =========================
       CONTINUE
       ========================= */

    function continueToLibrary() {

        if (!selectedLevel) {

            return;

        }


        localStorage.setItem(
            "student_level",
            selectedLevel
        );


        window.location.href =
            "library.html";

    }


    /* =========================
       LOAD SAVED LEVEL
       ========================= */

    function loadSavedLevel() {

        const saved =
            localStorage.getItem(
                "student_level"
            );


        if (!saved) {

            return;

        }


        const option =
            document.querySelector(
                `[data-level="${saved}"]`
            );


        if (!option) {

            return;

        }


        selectLevel(
            saved,
            option
        );

    }


    /* =========================
       NAVIGATION
       ========================= */

    function goDashboard() {

        window.location.href =
            "dashboard.html";

    }


    function goHome() {

        window.location.href =
            "index.html";

    }


    /* =========================
       START
       ========================= */

    loadSavedLevel();

</script>

</body></html>
